<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1F4D36">
<title>GoyerFlow</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --cream:#F7F5EF; --ink:#1B2B22; --accent:#1F4D36; --accent-soft:rgba(31,77,54,0.14);
    --border:#ECE7DA; --muted:#9A9385; --muted-ink:#6B6558; --warn:#A85E1C; --warn-bg:rgba(168,94,28,0.08);
    --err:#A33434; --err-bg:rgba(163,52,52,0.08); --blue:#3E74A8; --blue-dark:#1F4566;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  button{font-family:inherit}
  .wrap{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;padding:0 20px}
  .topbar{padding:28px 0 8px 0;display:flex;align-items:center;gap:10px}
  .backbtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;
    background:#fff;border:1px solid var(--border);cursor:pointer;flex-shrink:0;padding:0}
  .brandwrap{flex:1;min-width:0}
  .brand{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:0.2px}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 40px 0;gap:16px}
  .screen.tracker{justify-content:flex-start;padding-top:14px;gap:8px}
  h1{font-size:22px;font-weight:800;margin:0 0 4px 0}
  p.help{font-size:14px;color:var(--muted-ink);line-height:1.45;margin:0 0 4px 0}
  label{font-size:13px;font-weight:700;color:var(--muted-ink);text-transform:uppercase;letter-spacing:0.3px}
  input[type=text], input[type=password], input[inputmode=numeric]{
    width:100%;font-size:22px;font-weight:700;letter-spacing:2px;padding:14px 16px;margin-top:6px;
    border-radius:14px;border:1.5px solid var(--border);background:#fff;color:var(--ink);text-align:center}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{display:block;width:100%;padding:15px 18px;border-radius:14px;border:none;background:var(--accent);
    color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
  .btn:disabled{opacity:0.5;cursor:default}
  .btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--border)}
  .msg{font-size:14px;line-height:1.45;padding:12px 14px;border-radius:12px}
  .msg.err{color:var(--err);background:var(--err-bg)}
  .msg.warn{color:var(--warn);background:var(--warn-bg)}
  .card{border-radius:20px;border:1px solid var(--border);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.04);
    padding:16px 18px;margin-bottom:0}
  .card.me{background:var(--accent);border:none;box-shadow:0 4px 14px rgba(0,0,0,0.1);color:#fff;padding:18px}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
  .card.me .eyebrow{color:rgba(255,255,255,0.7);text-align:center;margin-bottom:10px}
  .posline{font-size:16px;line-height:1.35}
  .holebig{font-size:52px;font-weight:800;color:#fff;line-height:1;text-align:center;margin:2px 0 2px}
  .pleklabel{font-size:14px;font-weight:700;color:rgba(255,255,255,0.85);text-align:center;
    text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
  .detailline{font-size:14px;color:rgba(255,255,255,0.92);line-height:1.45;margin-top:12px;
    padding-top:12px;border-top:1px solid rgba(255,255,255,0.18)}
  .footerinfo{font-size:12px;color:var(--muted);text-align:center;padding:16px 0 4px}

  /* Stappers (hole +/-) */
  .stepperrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
  .stepperrow.big{gap:16px;margin-bottom:10px}
  .stepbtn{width:28px;height:28px;border-radius:8px;border:none;display:flex;align-items:center;
    justify-content:center;cursor:pointer;flex-shrink:0;padding:0;background:rgba(168,94,28,0.12)}
  .stepbtn.light{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,0.15)}
  .steplabel{font-size:12px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
  .stepvalue{font-size:26px;font-weight:800;color:var(--warn);min-width:34px;text-align:center}
  .stepvalue.big{font-size:52px;color:#fff;min-width:60px}

  /* Marker-knoppen (Afslag/Fairway/Green) */
  .markerrow{display:flex;gap:6px;margin-bottom:6px}
  .markerrow.big{gap:8px}
  .markerbtn{flex:1;box-sizing:border-box;padding:11px 4px;border-radius:10px;cursor:pointer;
    font-size:14px;font-weight:700;text-align:center}
  .markerbtn.big{padding:13px 6px;border-radius:14px;font-size:16px;border-width:2px}

  /* Inhaal-correctie (flight-voor-jou) */
  .correctiewarn{font-size:14px;color:var(--warn);line-height:1.45;margin-bottom:8px;padding:10px 12px;
    border-radius:12px;background:var(--warn-bg)}
  .uitgestaptbtn{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;background:#fff;
    border:1.5px dashed rgba(168,94,28,0.4);cursor:pointer;margin-bottom:8px;font-size:14px;
    font-weight:700;color:var(--warn);text-align:center}
  /* Doorlaat-knop — duidelijk herkenbaar door een stevige rand + lichte tint, zonder een volle
     blok accentkleur te zijn (dat trok te veel aandacht naast de groene middelste kaart) */
  .doorlaatbtn{display:block;width:100%;box-sizing:border-box;padding:13px 14px;border-radius:14px;
    cursor:pointer;text-align:center;background:var(--accent-soft);border:2px solid var(--accent);
    transition:opacity 0.15s}
  .doorlaatbtn.vergrendeld{background:#F0EEE6;border-color:#C7C0AF;opacity:1;cursor:default}
  .doorlaatbtn .tekst{font-size:15px;font-weight:800;color:var(--accent)}
  .doorlaatbtn.vergrendeld .tekst{color:#9B9585}
  .gewisseldline{font-size:13px;color:#8A8470;margin-top:6px;line-height:1.35}

  /* Ronde voltooid (eigen kaart) */
  .rondeklaartekst{font-size:14px;color:rgba(255,255,255,0.92);line-height:1.45;margin-bottom:14px}
  .rondeafgerondbtn{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:14px;background:#fff;
    border:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);text-align:center}

  /* Conclusie (op schema / te snel / te langzaam) */
  .conclusieline{font-size:14px;color:rgba(255,255,255,0.92);line-height:1.45;margin-top:12px;
    padding-top:12px;border-top:1px solid rgba(255,255,255,0.18)}
  .tipsbtn{margin-top:10px;width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;
    background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:8px;font-size:15px;font-weight:700}

  /* Tips-popup */
  .tipsoverlay{position:fixed;inset:0;background:rgba(27,43,34,0.55);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:50}
  .tipsmodal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:360px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25)}
  .tipsheader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .tipstitle{font-size:18px;font-weight:800}
  .tipsclose{width:26px;height:26px;border-radius:8px;background:#F3F0E6;border:none;display:flex;
    align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
  .tipitem{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
  .tipdot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
  .tiptekst{font-size:14px;line-height:1.4;color:#3A362C}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar">
    <div class="brandwrap">
      <div class="brand">GoyerFlow</div>
      <div class="sub" id="subline">Tempo-tracker voor leden</div>
    </div>
  </div>
  <div id="app" class="screen"></div>
</div>

<script>
/* ============================================================================================
   CONFIGURATIE — eenmalig invullen (zelfde patroon als de Marshal App: deze waarden zijn
   publieke client-sleutels, bedoeld om in de frontend te staan — geen geheimen).
   ============================================================================================ */
const SUPABASE_URL = "https://osnahudrlucxxpncdscs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zbmFodWRybHVjeHhwbmNkc2NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTA5ODUsImV4cCI6MjEwODI2Njk4NX0.XLZgfsED-MgdBZzKrgvciTS160uBbwNuUWFqkEiVUa4";

/* ============================================================================================
   AANNAMES DIE NOG BEVESTIGD MOETEN WORDEN (zie claude/scope-tempo-tracker-leden-app.md)
   1) Par-verdeling van de baan (North Course, 18 holes): hier aangenomen als 4x par3 + 10x par4
      + 4x par5 (par 72) — een gangbare verdeling, NIET geverifieerd tegen Goyer's eigen
      HOLES_DATA. Zodra Kay de echte hole-nummer→par-lijst aanlevert (zie holes-tabel in
      schema.sql), moet de berekening hieronder vervangen worden door een echte cumulatieve
      per-hole tijdlijn in plaats van dit vlakke gemiddelde.
   2) De hcp- en flightgrootte-correctieformule is gereconstrueerd uit het screenshot van het
      bestaande instelscherm (par3=9.5, par4=11.1, par5=13.6, hcp-correctie=0.05/punt boven 10,
      flightgrootte-correctie=0.8/speler boven 2), NIET uit de Marshal App-broncode zelf
      (die is hier niet beschikbaar). De uitkomst is tegen Kay's eigen "Verwachte rondetijden"-
      tabel gevalideerd or (tweebal 210, driebal ~224-225, vierbal 240 — binnen afronding gelijk),
      maar dit moet je nog bevestigen tegen de echte Marshal App-formule voordat dit als
      definitief geldt.
   ============================================================================================ */
const AANTAL_HOLES = 18;
const PAR_VERDELING = { 3: 4, 4: 10, 5: 4 }; // aantal holes per par-type, aanname (zie boven)
const ZICHTBAARHEIDSVENSTER_MINUTEN = 15;    // zelfde venster als Marshal App v1.9.0

/* ============================================================================================
   Supabase REST helper
   ============================================================================================ */
async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`Supabase-fout (${res.status}): ${body}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

function loggen(persoonscode, type, succes) {
  // Logboek van logins/pincode-wijzigingen (maatregel 1+2 uit "Login-beveiliging"). Best-effort:
  // een logging-fout mag een login nooit blokkeren.
  sb("login_log", {
    method: "POST",
    prefer: "return=minimal",
    body: JSON.stringify({ persoonscode, type, succes }),
  }).catch((e) => console.warn("Loggen mislukt (niet blokkerend):", e));
}

/* ============================================================================================
   Rondetijd-berekening
   ============================================================================================ */
function basisRondetijd(params) {
  return PAR_VERDELING[3] * params.par3_minuten
       + PAR_VERDELING[4] * params.par4_minuten
       + PAR_VERDELING[5] * params.par5_minuten;
}

function rondetijdVoor(params, aantalSpelers, gemiddeldeHcp) {
  const basis = basisRondetijd(params);
  const hcpBovenTien = Math.max(0, gemiddeldeHcp - 10);
  const hcpCorrectie = hcpBovenTien * params.hcp_correctie_per_punt_boven_10 * AANTAL_HOLES;
  const extraSpelers = Math.max(0, aantalSpelers - 2);
  const flightCorrectie = extraSpelers * params.flightgrootte_correctie_per_speler_boven_2 * AANTAL_HOLES;
  return basis + hcpCorrectie + flightCorrectie;
}

function verwachtePositie(starttijdISO, minutenPerHole, nu) {
  const starttijd = new Date(starttijdISO).getTime();
  const verstreken = (nu.getTime() - starttijd) / 60000; // minuten
  const fractie = verstreken / minutenPerHole;
  const holeIndex = Math.floor(fractie);
  const rest = fractie - holeIndex;
  let checkpoint = "afslag";
  if (rest >= 0.75) checkpoint = "green";
  else if (rest >= 0.25) checkpoint = "fairway";
  const hole = Math.max(1, Math.min(AANTAL_HOLES, holeIndex + 1));
  return { hole, checkpoint, verstreken, fractie };
}

const CHECKPOINT_LABEL = { afslag: "afslag", fairway: "fairway", green: "green" };
const CHECKPOINT_KNOPLABEL = { afslag: "Afslag", fairway: "Fairway", green: "Green" };
const CHECKPOINT_VOLGORDE = ["afslag", "fairway", "green"];

function checkpointFractie(key) {
  return { afslag: 0, fairway: 0.5, green: 1 }[key] ?? 0;
}

// Ronde voltooid: de ONGECLEMDE fractie (dus los van de weergegeven hole, die bij
// verwachtePositie() al op AANTAL_HOLES wordt vastgezet) is voorbij het totaal aantal holes —
// er is geen hole 19, dus vanaf hier moet de tracker een eindstatus laten zien in plaats van
// te blijven "hangen" op hole 18.
function rondeVoltooid(pos) {
  return pos.fractie >= AANTAL_HOLES;
}

function formatTijd(iso) {
  return new Date(iso).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}

function formatDuur(minuten) {
  const h = Math.floor(minuten / 60);
  const m = Math.round(minuten - h * 60);
  return `${h} uur ${m} minuten`;
}

// Conclusie bij een zelf-gemelde positie — zelfde vijf categorieën en kleuren als de goedgekeurde
// mockup (Tracker.dc.html): veel_te_snel/te_snel/op_schema/te_langzaam/veel_te_langzaam.
function conclusieVoor(deltaHoles) {
  if (deltaHoles >= 1.0) return { key: "veel_te_snel", label: "Veel te snel", kleur: "var(--blue-dark)", zin: "Dus je loopt veel te snel." };
  if (deltaHoles >= 0.4) return { key: "te_snel", label: "Te snel", kleur: "var(--blue)", zin: "Dus je loopt te snel." };
  if (deltaHoles <= -1.0) return { key: "veel_te_langzaam", label: "Veel te langzaam", kleur: "var(--err)", zin: "Dus je loopt veel te langzaam." };
  if (deltaHoles <= -0.4) return { key: "te_langzaam", label: "Te langzaam", kleur: "var(--warn)", zin: "Dus je loopt te langzaam." };
  return { key: "op_schema", label: "Op schema", kleur: "var(--accent)", zin: "Dus je loopt op schema." };
}

const TIPS = [
  "Speel 'ready golf': wie klaar is, slaat — niet per se op volgorde van afstand tot de hole.",
  "Bepaal je club en richting terwijl een ander aan de beurt is, niet pas als jij aan de beurt bent.",
  "Loop door naar je bal terwijl je partners nog voorbereiden, in plaats van te wachten.",
  "Zoek een verloren bal maximaal 3 minuten en wenk de flight achter je door als je langer zoekt.",
  "Zet de trolley of buggy aan de kant van de volgende afslag neer, niet terug bij de green.",
];

// Kleine chevron-svg, voor de hole-steppers en de terug-knop.
function chevronSvg(richting, kleur) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", "13"); svg.setAttribute("height", "13"); svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", richting === "links" ? "M15 6l-6 6 6 6" : "M9 6l6 6-6 6");
  path.setAttribute("stroke", kleur); path.setAttribute("stroke-width", "2.5");
  path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  return svg;
}

// Vinkje-svg, voor de doorlaat-knoppen.
function checkSvg(kleur) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", "18"); svg.setAttribute("height", "18"); svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", "M5 13l4 4L19 7");
  path.setAttribute("stroke", kleur); path.setAttribute("stroke-width", "2.5");
  path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  return svg;
}

/* ============================================================================================
   App-state en navigatie
   ============================================================================================ */
const state = { scherm: "persoonscode", speler: null, flight: null, fout: null, bericht: null };

// Lokale, niet-opgeslagen UI-staat voor het trackerscherm: vergrendeling na een doorlaat-klik (4
// seconden, zelfde patroon als de mockup) en de draft-hole-waarden van de twee steppers, voordat
// ze als melding worden bevestigd. Wordt bij uitloggen gereset.
function nieuweTrackerLocal() {
  return {
    voorKnopVergrendeld: false,
    achterKnopVergrendeld: false,
    zelfHoleDraft: null,       // null = volg de live berekende verwachte hole
    voorCorrectieHole: null,  // null = volg de live berekende positie van de flight voor je
    toontTipsPopup: false,
    bezig: false,              // voorkomt dubbele schrijfacties tijdens een lopende Supabase-call
  };
}
let trackerLocal = nieuweTrackerLocal();

// Auto-ververs: zolang het trackerscherm open staat, wordt de weergave periodiek stil opnieuw
// berekend (en de flights opnieuw opgehaald), zodat de verwachte positie — en welke Afslag/
// Fairway/Green-knop live gemarkeerd is — vanzelf meebeweegt met de klok, zonder dat de speler
// iets hoeft aan te raken. Een druk op een knop blijft de ENIGE manier om een echte melding op
// te slaan; de automatische highlight is puur informatief. 20 seconden is een eerste inschatting
// — makkelijk aan te passen (TRACKER_VERVERS_MS hieronder) als dat te vaak/te traag blijkt.
const TRACKER_VERVERS_MS = 20000;
let trackerIntervalId = null;

function render() {
  const app = document.getElementById("app");
  const sub = document.getElementById("subline");
  const topbar = document.getElementById("topbar");
  app.innerHTML = "";
  app.className = "screen" + (state.scherm === "tracker" ? " tracker" : "");

  // Topbar: op het trackerscherm een terug/uitlog-knop, net als de "terug naar inloggen"-pijl in
  // de goedgekeurde mockup — en een contextregel (starttijd) in plaats van de generieke ondertitel.
  const bestaandeBackbtn = document.getElementById("backbtn");
  if (bestaandeBackbtn) bestaandeBackbtn.remove();
  if (state.scherm === "tracker" && state.flight) {
    const back = el("button", { class: "backbtn", id: "backbtn", "aria-label": "Uitloggen", onclick: logout }, [
      chevronSvg("links", "#5B5648"),
    ]);
    topbar.insertBefore(back, topbar.firstChild);
    sub.textContent = `${state.flight.aantal_spelers}-bal · gestart ${formatTijd(state.flight.starttijd_effectief)}`;
    if (!trackerIntervalId) {
      trackerIntervalId = setInterval(() => {
        if (state.scherm === "tracker") renderTracker(document.getElementById("app"), { stil: true });
      }, TRACKER_VERVERS_MS);
    }
  } else {
    sub.textContent = "Tempo-tracker voor leden";
    if (trackerIntervalId) { clearInterval(trackerIntervalId); trackerIntervalId = null; }
  }

  if (state.scherm === "persoonscode") return renderPersoonscode(app);
  if (state.scherm === "pincode") return renderPincode(app);
  if (state.scherm === "nieuwe_pincode") return renderNieuwePincode(app);
  if (state.scherm === "tracker") return renderTracker(app);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

function meldingNode() {
  if (!state.fout) return null;
  return el("div", { class: "msg err", text: state.fout });
}

/* ---- Scherm 1: persoonscode ---- */
function renderPersoonscode(app) {
  const input = el("input", { type: "text", id: "persoonscode", inputmode: "text", placeholder: "bv. 1234", maxlength: "12" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const code = input.value.trim().toUpperCase();
    if (!code) return;
    const btn = document.getElementById("submit-persoonscode");
    btn.disabled = true;
    try {
      const rows = await sb(`spelers?persoonscode=eq.${encodeURIComponent(code)}&select=*,flights(*)`);
      if (!rows || rows.length === 0) {
        loggen(code, "login", false);
        state.fout = "Geen geboekte flight gevonden voor deze persoonscode. Probeer het vanaf ongeveer 15 minuten voor je starttijd nog eens, of neem contact op met de caddymaster.";
        render();
        return;
      }
      const speler = rows[0];
      const flight = speler.flights;
      if (flight.uitgestapt) {
        loggen(code, "login", false);
        state.fout = "Deze flight staat als uitgestapt geregistreerd.";
        render();
        return;
      }
      const nu = new Date();
      const venstertijd = new Date(new Date(flight.starttijd_effectief).getTime() - ZICHTBAARHEIDSVENSTER_MINUTEN * 60000);
      if (nu < venstertijd) {
        loggen(code, "login", false);
        const tijdstr = venstertijd.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
        state.fout = `Nog niet beschikbaar — deze flight wordt zichtbaar vanaf ${tijdstr} (15 minuten voor de starttijd).`;
        render();
        return;
      }
      state.speler = speler;
      state.flight = flight;
      state.fout = null;
      state.scherm = "pincode";
      render();
    } catch (e) {
      state.fout = "Er ging iets mis bij het ophalen van je gegevens. Probeer het zo nog eens.";
      console.error(e);
      render();
    } finally {
      btn.disabled = false;
    }
  };

  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

  app.append(
    el("h1", { text: "Inloggen" }),
    el("p", { class: "help", text: "Vul je persoonscode in — dezelfde code als op je tassenlabel." }),
    el("label", { text: "Persoonscode" }),
    input,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-persoonscode", onclick: submit, text: "Verder" })
  );
  input.focus();
}

/* ---- Scherm 2: pincode ---- */
function renderPincode(app) {
  const voornaam = (state.speler.naam || "").split(" ")[0];
  const input = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "••••" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const pin = input.value.trim();
    if (pin.length !== 4) { state.fout = "Vul een pincode van 4 cijfers in."; render(); return; }
    const btn = document.getElementById("submit-pincode");
    btn.disabled = true;
    try {
      if (pin !== state.speler.pincode) {
        loggen(state.speler.persoonscode, "login", false);
        state.fout = "Onjuiste pincode.";
        render();
        return;
      }
      loggen(state.speler.persoonscode, "login", true);
      if (!state.speler.pincode_gewijzigd) {
        state.scherm = "nieuwe_pincode";
      } else {
        state.scherm = "tracker";
      }
      state.fout = null;
      render();
    } finally {
      btn.disabled = false;
    }
  };

  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

  app.append(
    el("h1", { text: `Welkom, ${voornaam}` }),
    el("p", { class: "help", text: state.speler.pincode_gewijzigd ? "Vul je pincode in." : "Vul de standaard pincode in (0000) — je wordt daarna gevraagd een eigen pincode te kiezen." }),
    el("label", { text: "Pincode" }),
    input,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-pincode", onclick: submit, text: "Inloggen" })
  );
  input.focus();
}

/* ---- Scherm 3: nieuwe pincode (verplicht bij eerste login) ---- */
function renderNieuwePincode(app) {
  const i1 = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "nieuwe pincode" });
  const i2 = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "herhaal" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const p1 = i1.value.trim(), p2 = i2.value.trim();
    if (p1.length !== 4 || !/^\d{4}$/.test(p1)) { state.fout = "Kies een pincode van 4 cijfers."; render(); return; }
    if (p1 !== p2) { state.fout = "De twee pincodes komen niet overeen."; render(); return; }
    if (p1 === "0000") { state.fout = "Kies een andere pincode dan de standaardwaarde 0000."; render(); return; }
    const btn = document.getElementById("submit-nieuwe-pincode");
    btn.disabled = true;
    try {
      await sb(`spelers?id=eq.${state.speler.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ pincode: p1, pincode_gewijzigd: true }),
      });
      loggen(state.speler.persoonscode, "pincode_wijziging", true);
      state.speler = { ...state.speler, pincode: p1, pincode_gewijzigd: true };
      state.scherm = "tracker";
      state.fout = null;
      render();
    } catch (e) {
      state.fout = "Pincode wijzigen is niet gelukt. Probeer het nog eens.";
      console.error(e);
      render();
    } finally {
      btn.disabled = false;
    }
  };

  app.append(
    el("h1", { text: "Kies je eigen pincode" }),
    el("p", { class: "help", text: "Verplicht bij de eerste keer inloggen. Kies 4 cijfers die je kunt onthouden." }),
    el("label", { text: "Nieuwe pincode" }),
    i1,
    el("label", { text: "Herhaal" }),
    i2,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-nieuwe-pincode", onclick: submit, text: "Pincode instellen" })
  );
  i1.focus();
}

/* ---- Scherm 4: tracker ---- */
async function renderTracker(app, opts = {}) {
  // "stil" = automatische achtergrondverversing (zie TRACKER_VERVERS_MS/trackerIntervalId in
  // render()): geen laad-tekst tonen, en bij een mislukte ophaalactie de bestaande weergave laten
  // staan in plaats van te vervangen door een foutmelding — de speler heeft niets aangeraakt en
  // mag niet merken dat er op de achtergrond iets misging. Bij de eerste, niet-stille load blijft
  // het oude gedrag (laad-tekst, en bij een fout de melding tonen) ongewijzigd.
  const stil = !!opts.stil;
  if (!stil) app.append(el("div", { class: "msg", text: "Bezig met laden…" }));

  let params, flights;
  try {
    [params] = await sb("parameters?select=*&limit=1");
    flights = await sb(`flights?lus=eq.${encodeURIComponent(state.flight.lus)}&uitgestapt=eq.false&select=*&order=starttijd_effectief.asc`);
  } catch (e) {
    console.error(e);
    if (!stil) {
      app.innerHTML = "";
      app.append(el("div", { class: "msg err", text: "Kon de actuele gegevens niet ophalen. Probeer de pagina te verversen." }));
    }
    return;
  }

  const nu = new Date();
  const index = flights.findIndex((f) => f.id === state.flight.id);
  // "Voor jou"/"achter jou" volgen simpelweg uit de live, op starttijd gesorteerde lijst — geen
  // aparte queue-/buffer-logica nodig (anders dan in de mockup): elke doorlaat-wissel, correctie of
  // "uitgestapt"-markering herschikt deze lijst vanzelf bij de eerstvolgende herberekening.
  const voor = index > 0 ? flights[index - 1] : null;
  const achter = index >= 0 && index < flights.length - 1 ? flights[index + 1] : null;
  const zelf = flights[index] || state.flight;

  function posVan(flight) {
    const minutenPerHole = rondetijdVoor(params, flight.aantal_spelers, flight.gemiddelde_hcp) / AANTAL_HOLES;
    return { ...verwachtePositie(flight.starttijd_effectief, minutenPerHole, nu), minutenPerHole };
  }

  const voorPos = voor ? posVan(voor) : null;
  const achterPos = achter ? posVan(achter) : null;
  const zelfPos = posVan(zelf);
  const zelfRondetijd = rondetijdVoor(params, zelf.aantal_spelers, zelf.gemiddelde_hcp);

  // Ronde voltooid: vanaf hier toont elke kaart een eindstatus in plaats van door te blijven
  // rekenen aan een hole die niet bestaat (zie rondeVoltooid()).
  const zelfRondeVoltooid = rondeVoltooid(zelfPos);
  const voorRondeVoltooid = voor ? rondeVoltooid(voorPos) : false;
  const achterRondeVoltooid = achter ? rondeVoltooid(achterPos) : false;

  // Eigen gemelde positie: gedeeld per flight (zelfde rij, dus zichtbaar voor alle spelers van die
  // flight — "laatste melding wint"), opgeslagen in gerapporteerde_hole/gerapporteerd_checkpoint.
  const heeftGekozen = zelf.gerapporteerde_hole != null && zelf.gerapporteerd_checkpoint != null;
  const actueleFractie = heeftGekozen ? (zelf.gerapporteerde_hole - 1) + checkpointFractie(zelf.gerapporteerd_checkpoint) : null;
  const deltaHoles = heeftGekozen ? actueleFractie - zelfPos.fractie : null;
  const conclusie = heeftGekozen ? conclusieVoor(deltaHoles) : null;
  const kaartKleur = conclusie ? conclusie.kleur : "var(--accent)";
  const toonTipsKnop = conclusie && (conclusie.key === "te_langzaam" || conclusie.key === "veel_te_langzaam");

  // Inhaal-signaal: je eigen melding bereikt of overschrijdt de geschatte positie van de flight
  // voor je (zie scopedocument, "Inhaal-signaal"). Alleen relevant als je al een positie hebt
  // gemeld en er een flight voor je is.
  const loopJeTegenVoorAan = heeftGekozen && voor && !voorRondeVoltooid && actueleFractie >= voorPos.fractie;

  // Draft-waarden van de steppers: volgen de live berekening totdat de speler er zelf aan heeft
  // gedraaid (zie nieuweTrackerLocal()). Let op: dit volgt altijd zelfPos (de live berekende
  // positie), NIET de laatst opgeslagen melding — zo loopt de weergave vanzelf door (Afslag →
  // Fairway → Green → volgende hole) zonder dat dat ooit zelf een melding opslaat. Alleen een
  // druk op een knop (zelfPositieMelden) schrijft iets naar de database.
  const zelfHoleWeergave = trackerLocal.zelfHoleDraft ?? zelfPos.hole;
  const voorCorrectieHoleWeergave = voor ? (trackerLocal.voorCorrectieHole ?? voorPos.hole) : null;

  app.innerHTML = "";

  if (trackerLocal.fout) app.append(el("div", { class: "msg err", text: trackerLocal.fout }));

  /* ---------------------------------------------------------------------------------------
     Kaart: flight voor jou
     --------------------------------------------------------------------------------------- */
  const voorKinderen = [el("div", { class: "eyebrow", text: "Flight voor jou" })];
  if (!voor) {
    voorKinderen.push(el("div", { class: "posline", text: "Geen flight voor jou gevonden op dezelfde lus." }));
  } else if (voorRondeVoltooid) {
    voorKinderen.push(el("div", { class: "posline", text: "Deze flight heeft de ronde waarschijnlijk afgerond." }));
  } else {
    voorKinderen.push(el("div", { class: "posline" }, [
      document.createTextNode("Moet rond de "),
      el("b", { text: CHECKPOINT_LABEL[voorPos.checkpoint] }),
      document.createTextNode(` van hole ${voorPos.hole} zijn.`),
    ]));

    if (loopJeTegenVoorAan) {
      voorKinderen.push(el("div", { class: "correctiewarn", text: "Jouw gemelde positie is gelijk aan of verder dan die van de flight voor jou. Waar bevindt de flight voor jou zich in werkelijkheid?" }));

      const stepMin = el("button", { class: "stepbtn", "aria-label": "Een hole terug", onclick: () => { trackerLocal.voorCorrectieHole = Math.max(1, voorCorrectieHoleWeergave - 1); render(); } }, [chevronSvg("links", "#8A5A1C")]);
      const stepPlus = el("button", { class: "stepbtn", "aria-label": "Een hole verder", onclick: () => { trackerLocal.voorCorrectieHole = Math.min(AANTAL_HOLES, voorCorrectieHoleWeergave + 1); render(); } }, [chevronSvg("rechts", "#8A5A1C")]);
      voorKinderen.push(el("div", { class: "stepperrow" }, [
        stepMin,
        el("div", { class: "steplabel", text: "hole" }),
        el("div", { class: "stepvalue", text: String(voorCorrectieHoleWeergave) }),
        stepPlus,
      ]));

      const markerKnoppen = CHECKPOINT_VOLGORDE.map((key) => {
        const komtOvereen = voorCorrectieHoleWeergave === voorPos.hole && key === voorPos.checkpoint && trackerLocal.voorCorrectieHole === null;
        return el("button", {
          class: "markerbtn",
          style: komtOvereen ? "background:rgba(168,94,28,0.12);border:2px solid #8A5A1C;color:#8A5A1C"
                              : "background:#fff;border:1.5px solid rgba(168,94,28,0.4);color:#8A5A1C",
          onclick: () => correctieVanVoorMelden(key),
          text: CHECKPOINT_KNOPLABEL[key],
        });
      });
      voorKinderen.push(el("div", { class: "markerrow" }, markerKnoppen));

      voorKinderen.push(el("button", { class: "uitgestaptbtn", onclick: markeerVoorUitgestapt, text: "Uitgestapt" }));
    }


    const voorVergrendeld = trackerLocal.voorKnopVergrendeld;
    voorKinderen.push(el("button", {
      class: "doorlaatbtn" + (voorVergrendeld ? " vergrendeld" : ""),
      onclick: () => doorlaatWissel(voor, "voor"),
    }, [
      el("div", { class: "tekst", text: "Deze flight laat ons door" }),
    ]));
    if (voorVergrendeld) voorKinderen.push(el("div", { class: "gewisseldline", text: "Starttijden gewisseld — jullie spelen nu op elkaars schema." }));
  }
  const voorCard = el("div", { class: "card" }, voorKinderen);

  /* ---------------------------------------------------------------------------------------
     Kaart: jouw flight (eigen positie melden)
     --------------------------------------------------------------------------------------- */
  const stepMinZelf = el("button", { class: "stepbtn light", "aria-label": "Een hole terug", onclick: () => { trackerLocal.zelfHoleDraft = Math.max(1, zelfHoleWeergave - 1); render(); } }, [chevronSvg("links", "#fff")]);
  const stepPlusZelf = el("button", { class: "stepbtn light", "aria-label": "Een hole verder", onclick: () => { trackerLocal.zelfHoleDraft = Math.min(AANTAL_HOLES, zelfHoleWeergave + 1); render(); } }, [chevronSvg("rechts", "#fff")]);

  const markerKnoppenZelf = CHECKPOINT_VOLGORDE.map((key) => {
    // Highlight volgt de live berekende positie (zelfPos), niet de laatst opgeslagen melding —
    // dit is puur visueel/informatief en slaat niets op. Zodra de speler zelf aan de stepper
    // draait (trackerLocal.zelfHoleDraft wijkt af van zelfPos.hole), volgt de highlight die keuze.
    const geselecteerd = key === zelfPos.checkpoint && zelfHoleWeergave === zelfPos.hole;
    return el("button", {
      class: "markerbtn big",
      style: geselecteerd ? "background:#fff;border-color:#fff;color:" + kaartKleur
                           : "background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85)",
      onclick: () => zelfPositieMelden(key, zelfHoleWeergave),
      text: CHECKPOINT_KNOPLABEL[key],
    });
  });

  const meKinderen = [el("div", { class: "eyebrow", text: "Waar is jouw flight nu?" })];
  if (zelfRondeVoltooid) {
    // Ronde voltooid: er is geen hole 19 om naar te schuiven, dus geen stepper/marker-knoppen meer —
    // alleen een expliciete bevestiging (zelfRondeAfgerond) sluit de ronde daadwerkelijk af en
    // haalt de flight uit de live lijst voor andere spelers.
    meKinderen.push(el("div", { class: "rondeklaartekst", text: `Op basis van jullie starttijd zouden jullie alle ${AANTAL_HOLES} holes nu gespeeld moeten hebben.` }));
    meKinderen.push(el("button", { class: "rondeafgerondbtn", onclick: zelfRondeAfgerond, text: "Ronde afgerond" }));
  } else {
    meKinderen.push(
      el("div", { class: "stepperrow big" }, [stepMinZelf, el("div", { class: "stepvalue big", text: String(zelfHoleWeergave) }), stepPlusZelf]),
      el("div", { class: "markerrow big" }, markerKnoppenZelf)
    );
    if (heeftGekozen) {
      meKinderen.push(el("div", { class: "conclusieline" }, [
        document.createTextNode("Op basis van een start om "),
        el("b", { text: formatTijd(zelf.starttijd_effectief) }),
        document.createTextNode(" en een gemiddelde rondetijd van "),
        el("b", { text: formatDuur(zelfRondetijd) }),
        document.createTextNode(` voor een ${zelf.aantal_spelers}-bal over ${AANTAL_HOLES} holes zou je nu ongeveer op de `),
        el("b", { text: `${CHECKPOINT_LABEL[zelfPos.checkpoint]} van hole ${zelfPos.hole}` }),
        document.createTextNode(` moeten zijn. ${conclusie.zin}`),
      ]));
    }
    if (toonTipsKnop) {
      meKinderen.push(el("button", { class: "tipsbtn", style: "color:" + kaartKleur, onclick: () => { trackerLocal.toontTipsPopup = true; render(); }, text: "Tips om sneller te spelen" }));
    }
  }
  const meCard = el("div", { class: "card me", style: "background:" + kaartKleur }, meKinderen);

  /* ---------------------------------------------------------------------------------------
     Kaart: flight achter jou
     --------------------------------------------------------------------------------------- */
  const achterKinderen = [el("div", { class: "eyebrow", text: "Flight achter jou" })];
  if (!achter) {
    achterKinderen.push(el("div", { class: "posline", text: "Geen flight achter jou gevonden op dezelfde lus." }));
  } else if (achterRondeVoltooid) {
    achterKinderen.push(el("div", { class: "posline", text: "Deze flight heeft de ronde waarschijnlijk afgerond." }));
  } else {
    achterKinderen.push(el("div", { class: "posline" }, [
      document.createTextNode("Moet rond de "),
      el("b", { text: CHECKPOINT_LABEL[achterPos.checkpoint] }),
      document.createTextNode(` van hole ${achterPos.hole} zijn.`),
    ]));
    const achterVergrendeld = trackerLocal.achterKnopVergrendeld;
    achterKinderen.push(el("button", {
      class: "doorlaatbtn" + (achterVergrendeld ? " vergrendeld" : ""),
      onclick: () => doorlaatWissel(achter, "achter"),
    }, [
      el("div", { class: "tekst", text: "Wij laten deze flight door" }),
    ]));
    if (achterVergrendeld) achterKinderen.push(el("div", { class: "gewisseldline", text: "Starttijden gewisseld — jullie spelen nu op elkaars schema." }));
  }
  const achterCard = el("div", { class: "card" }, achterKinderen);

  app.append(voorCard, meCard, achterCard);

  if (trackerLocal.toontTipsPopup) {
    app.append(el("div", { class: "tipsoverlay" }, [
      el("div", { class: "tipsmodal" }, [
        el("div", { class: "tipsheader" }, [
          el("div", { class: "tipstitle", text: "Tips om sneller te spelen" }),
          el("button", { class: "tipsclose", "aria-label": "Sluiten", onclick: () => { trackerLocal.toontTipsPopup = false; render(); } }, [
            (() => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width","13"); s.setAttribute("height","13"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none");
              const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d","M6 6l12 12M18 6L6 18"); p.setAttribute("stroke","#6B6558"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round"); s.appendChild(p); return s; })(),
          ]),
        ]),
        ...TIPS.map((t) => el("div", { class: "tipitem" }, [el("div", { class: "tipdot" }), el("div", { class: "tiptekst", text: t })])),
      ]),
    ]));
  }

  /* ---------------------------------------------------------------------------------------
     Schrijfacties
     --------------------------------------------------------------------------------------- */
  async function zelfPositieMelden(checkpoint, hole) {
    if (trackerLocal.bezig) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${zelf.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ gerapporteerde_hole: hole, gerapporteerd_checkpoint: checkpoint, gerapporteerd_tijdstip: new Date().toISOString() }),
      });
      trackerLocal.zelfHoleDraft = null;
      trackerLocal.fout = null;
    } catch (e) {
      trackerLocal.fout = "Melden is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }

  // Ronde afgerond (eigen flight): schrijft uitgestapt=true op de eigen rij, zodat deze flight
  // verdwijnt uit de live lijst (dezelfde kolom/filter als "uitgestapt" bij een buurflight — het
  // praktische effect is identiek: niet meer meegenomen als "voor"/"achter" bij andere spelers),
  // en logt daarna direct uit: er is voor jezelf niets meer te tracken na afloop van de ronde.
  async function zelfRondeAfgerond() {
    if (trackerLocal.bezig) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${zelf.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      logout();
    } catch (e) {
      trackerLocal.fout = "Afsluiten van de ronde is niet gelukt. Probeer het nog eens.";
      console.error(e);
      trackerLocal.bezig = false;
      render();
    }
  }

  async function correctieVanVoorMelden(checkpoint) {
    if (trackerLocal.bezig || !voor) return;
    trackerLocal.bezig = true;
    try {
      const doelFractie = (voorCorrectieHoleWeergave - 1) + checkpointFractie(checkpoint);
      const nieuweStartTijdMs = nu.getTime() - doelFractie * voorPos.minutenPerHole * 60000;
      await sb(`flights?id=eq.${voor.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ starttijd_effectief: new Date(nieuweStartTijdMs).toISOString(), gecorrigeerd: true }),
      });
      trackerLocal.voorCorrectieHole = null;
      trackerLocal.fout = null;
    } catch (e) {
      trackerLocal.fout = "Corrigeren is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }

  async function markeerVoorUitgestapt() {
    if (trackerLocal.bezig || !voor) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${voor.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      trackerLocal.voorCorrectieHole = null;
      trackerLocal.fout = null;
    } catch (e) {
      trackerLocal.fout = "Markeren als 'uitgestapt' is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }

  // Generieke doorlaat-wissel: zelf en de buurflight (voor of achter) wisselen van starttijd. Welke
  // van de twee daarna "voor"/"achter" is, volgt vanzelf uit de eerstvolgende sortering op
  // starttijd_effectief — geen aparte queue-boekhouding nodig (zie opmerking hierboven bij voor/achter).
  async function doorlaatWissel(buur, kant) {
    if (trackerLocal.bezig || trackerLocal[`${kant}KnopVergrendeld`]) return;
    trackerLocal.bezig = true;
    const zelfOudeStart = zelf.starttijd_effectief;
    try {
      await sb(`flights?id=eq.${zelf.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ starttijd_effectief: buur.starttijd_effectief }) });
      await sb(`flights?id=eq.${buur.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ starttijd_effectief: zelfOudeStart }) });
      trackerLocal[`${kant}KnopVergrendeld`] = true;
      trackerLocal.fout = null;
      setTimeout(() => { trackerLocal[`${kant}KnopVergrendeld`] = false; render(); }, 4000);
    } catch (e) {
      trackerLocal.fout = "Doorlaten is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }
}

function logout() {
  state.scherm = "persoonscode";
  state.speler = null;
  state.flight = null;
  state.fout = null;
  trackerLocal = nieuweTrackerLocal();
  render();
}

render();
</script>
</body>
</html>
