<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1F4D36">
<title>GoyerFlow</title>
<link rel="manifest" href="manifest.json">
<!-- Homescherm-icoon: iOS/Safari negeert manifest.json-icons bij "Zet op beginscherm" en heeft een
     expliciete apple-touch-icon-link nodig; icon-192/icon-512 (via manifest.json) dekken Android/
     Chrome. Logo aangeleverd door Kay (23 oktober 2026), hier vastgezet als apple-touch-icon.png/
     icon-192.png/icon-512.png — alleen als homescherm-icoon, verder nergens in de app verwerkt. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --cream:#F7F5EF; --ink:#1B2B22; --accent:#1F4D36; --accent-soft:rgba(31,77,54,0.14);
    --border:#ECE7DA; --muted:#9A9385; --muted-ink:#6B6558; --warn:#A85E1C; --warn-bg:rgba(168,94,28,0.08);
    --err:#A33434; --err-bg:rgba(163,52,52,0.08); --blue:#3E74A8; --blue-dark:#1F4566;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  button{font-family:inherit}
  .wrap{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;padding:0 20px}
  .topbar{padding:28px 0 8px 0;display:flex;align-items:center;gap:10px}
  /* Op de login-/pincodeschermen staat de "Welkom bij GoyerFlow"-titel al in het scherm zelf
     (zie .authtitle), dus is de merknaam/ondertitel hierboven in de topbar overbodig — alleen
     het versienummer blijft daar zichtbaar, met minder gereserveerde ruimte erboven/eronder. */
  .topbar.compact{padding:10px 0 2px 0}
  .topbar.compact .brandwrap{display:none}
  /* Uitlogknop (v0.7.0): vervangt het oude linker-pijltje (.backbtn, tot v0.6.0) — dat zag eruit als
     "terug naar een ander menu" terwijl het eigenlijk uitlogde. Nu een expliciete tekstknop rechts in
     de topbar, na het versienummer (zie de insertievolgorde in render()). */
  .logoutbtn{flex-shrink:0;padding:7px 13px;border-radius:10px;background:#fff;border:1px solid var(--border);
    cursor:pointer;font-size:13px;font-weight:700;color:var(--muted-ink);margin-left:8px}
  .brandwrap{flex:1;min-width:0}
  .brand{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:0.2px}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .versiebadge{font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0;align-self:flex-start;margin-top:2px}
  /* flex-start (ipv eerder: center) zodat het invoerveld bij een opkomend toetsenbord niet
     onder de rand van het scherm verdwijnt — de inhoud begint nu gewoon bovenaan */
  .screen{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:24px 0 40px 0;gap:16px}
  .screen.tracker{padding-top:14px;gap:8px}
  .screen.auth{padding-top:4px}
  h1{font-size:22px;font-weight:800;margin:0 0 4px 0}
  p.help{font-size:14px;color:var(--muted-ink);line-height:1.45;margin:0 0 4px 0}
  /* Titel + tagline samen in één blok (eigen, kleine gap) i.p.v. los op de algemene .screen-gap
     (16px) te laten vertrouwen — zo kan de ruimte tússen titel en tagline specifiek klein
     blijven, zonder de ruimte tussen dit blok en de rest van het scherm te verkleinen. */
  .authheader{display:flex;flex-direction:column;gap:2px}
  .authtitle{font-size:24px;font-weight:800;color:var(--ink);margin:0}
  .authtagline{font-size:15px;font-weight:700;color:var(--accent);margin:0}
  .authdesc{font-size:14px;color:var(--muted-ink);line-height:1.5;margin:10px 0 0 0}
  .authwelkom{font-size:17px;font-weight:700;color:var(--ink);margin:14px 0 0 0}
  label{font-size:13px;font-weight:700;color:var(--muted-ink);text-transform:uppercase;letter-spacing:0.3px}
  input[type=text], input[type=password], input[inputmode=numeric]{
    width:100%;font-size:22px;font-weight:700;letter-spacing:2px;padding:14px 16px;margin-top:6px;
    border-radius:14px;border:1.5px solid var(--border);background:#fff;color:var(--ink);text-align:center}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{display:block;width:100%;padding:15px 18px;border-radius:14px;border:none;background:var(--accent);
    color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
  .btn:disabled{opacity:0.5;cursor:default}
  .btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--border)}
  .msg{font-size:14px;line-height:1.45;padding:12px 14px;border-radius:12px}
  .msg.err{color:var(--err);background:var(--err-bg)}
  .msg.warn{color:var(--warn);background:var(--warn-bg)}
  .card{border-radius:20px;border:1px solid var(--border);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.04);
    padding:16px 18px;margin-bottom:0}
  .card.me{background:var(--accent);border:none;box-shadow:0 4px 14px rgba(0,0,0,0.1);color:#fff;padding:18px}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
  .card.me .eyebrow{color:rgba(255,255,255,0.7);text-align:center;margin-bottom:10px}
  .posline{font-size:16px;line-height:1.35}
  .holebig{font-size:52px;font-weight:800;color:#fff;line-height:1;text-align:center;margin:2px 0 2px}
  .pleklabel{font-size:14px;font-weight:700;color:rgba(255,255,255,0.85);text-align:center;
    text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
  .detailline{font-size:14px;color:rgba(255,255,255,0.92);line-height:1.45;margin-top:12px;
    padding-top:12px;border-top:1px solid rgba(255,255,255,0.18)}
  .footerinfo{font-size:12px;color:var(--muted);text-align:center;padding:16px 0 4px}

  /* Stappers (hole +/-) */
  .stepperrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
  .stepperrow.big{gap:16px;margin-bottom:10px}
  .stepbtn{width:28px;height:28px;border-radius:8px;border:none;display:flex;align-items:center;
    justify-content:center;cursor:pointer;flex-shrink:0;padding:0;background:rgba(168,94,28,0.12)}
  .stepbtn.light{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,0.15)}
  .steplabel{font-size:12px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
  .stepvalue{font-size:26px;font-weight:800;color:var(--warn);min-width:34px;text-align:center}
  .stepvalue.big{font-size:52px;color:#fff;min-width:60px}

  /* Marker-knoppen (Afslag/Fairway/Green). De niet-"big" variant (inhaal-correctierijen op de voor-/
     achter-kaart) kreeg meer padding en tussenruimte (was 11px 4px / gap 6px) — te klein en te dicht
     op elkaar, waardoor per ongeluk de verkeerde knop aangetikt werd (gemeld door Kay). */
  .markerrow{display:flex;gap:10px;margin-bottom:6px}
  .markerrow.big{gap:8px}
  .markerbtn{flex:1;box-sizing:border-box;padding:15px 6px;border-radius:12px;cursor:pointer;
    font-size:15px;font-weight:700;text-align:center}
  .markerbtn.big{padding:13px 6px;border-radius:14px;font-size:16px;border-width:2px}

  /* Inhaal-correctie (flight-voor-jou) */
  .correctiewarn{font-size:14px;color:var(--warn);line-height:1.45;margin-bottom:8px;padding:10px 12px;
    border-radius:12px;background:var(--warn-bg)}
  .uitgestaptbtn{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:10px;background:#fff;
    border:1.5px dashed rgba(168,94,28,0.4);cursor:pointer;margin-bottom:8px;font-size:14px;
    font-weight:700;color:var(--warn);text-align:center}
  /* Doorlaat-knop — duidelijk herkenbaar door een stevige rand + lichte tint, zonder een volle
     blok accentkleur te zijn (dat trok te veel aandacht naast de groene middelste kaart).
     Breedte volgt nu de tekst (ipv de volle kaartbreedte) en staat gecentreerd, met wat meer
     ruimte boven zich t.o.v. de tekst erboven. */
  .doorlaatbtn{display:block;width:fit-content;max-width:100%;box-sizing:border-box;padding:13px 20px;
    border-radius:14px;cursor:pointer;text-align:center;background:var(--accent-soft);
    border:2px solid var(--accent);transition:opacity 0.15s;margin:16px auto 0 auto}
  .doorlaatbtn.vergrendeld{background:#F0EEE6;border-color:#C7C0AF;opacity:1;cursor:default}
  .doorlaatbtn .tekst{font-size:15px;font-weight:800;color:var(--accent);white-space:nowrap}
  .doorlaatbtn.vergrendeld .tekst{color:#9B9585}
  .gewisseldline{font-size:13px;color:#8A8470;margin-top:6px;line-height:1.35;text-align:center}

  /* Bevestiging voor doorlaten ("Weet je het zeker?") */
  .bevestigblok{margin:16px auto 0 auto;width:fit-content;max-width:100%}
  .bevestigtekst{font-size:14px;font-weight:700;color:var(--accent);text-align:center;margin-bottom:8px}
  .bevestigrow{display:flex;gap:8px;justify-content:center}
  .bevestigbtn{box-sizing:border-box;padding:11px 16px;border-radius:12px;cursor:pointer;
    font-size:14px;font-weight:800;text-align:center;white-space:nowrap}
  .bevestigbtn.ja{background:var(--accent);border:2px solid var(--accent);color:#fff}
  .bevestigbtn.annuleren{background:#fff;border:2px solid var(--border);color:var(--muted-ink)}

  /* Ronde voltooid (eigen kaart) */
  .rondeklaartekst{font-size:14px;color:rgba(255,255,255,0.92);line-height:1.45;margin-bottom:14px}
  .rondeafgerondbtn{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:14px;background:#fff;
    border:none;cursor:pointer;font-size:15px;font-weight:800;color:var(--accent);text-align:center}

  /* GPS-ondersteunde check-in (eigen kaart) — zie startGpsPositiebepaling()/gpsPending in index.html */
  .gpssubregel{font-size:13px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center;margin-bottom:10px}
  .gpsuitleg{font-size:13px;color:rgba(255,255,255,0.85);line-height:1.4;margin-bottom:10px}
  .gpsbevestigbtn{margin-top:12px;width:100%;box-sizing:border-box;padding:13px 14px;border-radius:14px;
    background:#fff;border:none;cursor:pointer;font-size:15px;font-weight:800;text-align:center}
  /* GPS mislukt (toegevoegd 27 oktober 2026, Kay's feedback tijdens veldtest): voorheen faalde een
     GPS-poging volledig stil — geen melding, geen manier om het opnieuw te proberen, de speler kon
     niet zien of de functie er überhaupt was. Zie gpsStatus === "nietBeschikbaar" in renderTracker. */
  .gpsmisluktregel{font-size:13px;color:rgba(255,255,255,0.75);line-height:1.4;margin-bottom:8px;text-align:center}
  .gpsretrybtn{margin-bottom:12px;width:100%;box-sizing:border-box;padding:10px 14px;border-radius:14px;
    background:transparent;border:1.5px solid rgba(255,255,255,0.5);cursor:pointer;font-size:13px;
    font-weight:700;color:rgba(255,255,255,0.92);text-align:center}

  /* Tijdlijn onder Afslag/Fairway/Green — vordert live mee met de klok, puur visueel (zie
     tijdlijnPercentage()); de knoppen erboven zijn drie gelijke kolommen, dus de balk komt exact
     bij 1/3 (Fairway) resp. 2/3 (Green) op het moment dat die knop wit wordt. */
  .tijdlijn{margin-top:10px}
  .tijdlijnvak{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,0.18);overflow:hidden}
  .tijdlijnvoortgang{position:absolute;top:0;left:0;height:100%;border-radius:3px;background:#fff;
    transition:width 1s linear}

  /* Conclusie (op schema / te snel / te langzaam) */
  .conclusieline{font-size:14px;color:rgba(255,255,255,0.92);line-height:1.45;margin-top:12px;
    padding-top:12px;border-top:1px solid rgba(255,255,255,0.18)}
  .tipsbtn{margin-top:10px;width:100%;box-sizing:border-box;padding:12px 14px;border-radius:14px;
    background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:8px;font-size:15px;font-weight:700}

  /* Tips-popup */
  .tipsoverlay{position:fixed;inset:0;background:rgba(27,43,34,0.55);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:50}
  .tipsmodal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:360px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25)}
  .tipsheader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .tipstitle{font-size:18px;font-weight:800}
  .tipsclose{width:26px;height:26px;border-radius:8px;background:#F3F0E6;border:none;display:flex;
    align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
  .tipitem{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
  .tipdot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
  .tiptekst{font-size:14px;line-height:1.4;color:#3A362C}

  /* Kleine losse links onder een inlogscherm (beheerder inlog, pincode vergeten, terug) */
  .authlink{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--muted-ink);
    margin-top:14px;background:none;border:none;cursor:pointer;padding:4px;text-decoration:underline;
    text-decoration-color:var(--border)}
  .authlink.klein{margin-top:6px;font-size:12px}

  /* Beheerder — tabbalk (Tracker/Parameters/Admin) */
  .tabbar{display:flex;gap:6px;margin-bottom:14px;background:#F0EEE6;border-radius:14px;padding:4px}
  .tabbtn{flex:1;text-align:center;padding:10px 4px;border-radius:11px;border:none;background:none;
    cursor:pointer;font-size:13px;font-weight:700;color:var(--muted-ink)}
  .tabbtn.actief{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.08)}

  /* Beheerder — Tracker-tab: overzicht van alle flights (v0.6.0: Marshal App-achtige lijstvorm —
     cirkel-badge, naam-pills, klok+hole/status-regel, dunne voortgangsbalk — i.p.v. de platte
     eerdere rij. Elke rij is nu ook klikbaar en opent het flight-detailscherm hieronder.) */
  .flightrij{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);
    cursor:pointer}
  .flightrij:last-child{border-bottom:none}
  .flightbol{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:13px;font-weight:800;color:#fff;text-align:center;line-height:1.1}
  .flightinfo{flex:1;min-width:0}
  .flightnaampillen{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .flightnaampil{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;
    background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  /* Wedstrijdflight-indicatie (v0.13.0, zie teecontrol-sync/index.ts + schema.sql "Fase 2g") — zelfde
     stijl (trofee-emoji + blauw, vet) als de Marshal App dit toont. */
  .flighttoernooi{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:4px}
  .detailtoernooi{font-size:13px;font-weight:700;color:var(--blue);margin-top:3px}
  .flightmeta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted-ink)}
  .flightmeta svg{flex-shrink:0}
  .flightprogressvak{position:relative;height:4px;border-radius:2px;background:var(--border);
    overflow:hidden;margin-top:7px}
  .flightprogressvoortgang{position:absolute;top:0;left:0;height:100%;border-radius:2px;background:var(--blue)}

  /* Beheerder — flight-detailscherm (popup bij klik op een flight in de Tracker-tab) */
  .detailoverlay{position:fixed;inset:0;background:rgba(27,43,34,0.55);display:flex;align-items:center;
    justify-content:center;padding:18px;z-index:50}
  .detailmodal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px;
    max-height:88vh;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,0.25)}
  .detailheader{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:2px}
  .detailtitle{font-size:18px;font-weight:800;color:var(--ink)}
  .detailsub{font-size:13px;color:var(--muted-ink);margin-top:2px}
  .detailclose{width:26px;height:26px;border-radius:8px;background:#F3F0E6;border:none;display:flex;
    align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;margin-top:2px}
  .spelerlijst{margin-top:14px}
  .spelerrij{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--border)}
  .spelerrij:last-child{border-bottom:none}
  .spelernaamrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .spelernaampil{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;
    background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .spelermeta{font-size:12px;color:var(--muted-ink)}
  .spelerhcp{font-size:15px;font-weight:800;color:var(--ink);flex-shrink:0;white-space:nowrap}
  .gemhcprow{display:flex;justify-content:space-between;align-items:center;font-size:14px;
    font-weight:700;color:var(--ink);padding-top:11px;margin-top:3px;border-top:1.5px solid var(--border)}
  .detaileigenkaart{margin-top:16px}

  /* Beheerder — Parameters-tab */
  .paramrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--border)}
  .paramrow:last-child{border-bottom:none}
  .paramlabel{font-size:14px;color:var(--ink);font-weight:600;text-transform:none;letter-spacing:0}
  .paraminput{width:84px;font-size:15px;font-weight:700;padding:8px 10px;margin-top:0;letter-spacing:0;
    text-align:center;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--ink)}
  .analyseresultaat{font-size:14px;color:var(--ink);line-height:1.6;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--border)}
  .analyseresultaat b{color:var(--accent)}

  /* Beheerder — Admin-tab: in-/uitklapbare ledenlijst + wachtwoordwijzigen */
  .ledenlijst{display:flex;flex-direction:column}
  .ledenrij{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;
    border-bottom:1px solid var(--border);cursor:pointer}
  .ledenrij:last-child{border-bottom:none}
  .ledenrij.open{border-bottom:none}
  .ledennaam{font-size:14px;font-weight:700;color:var(--ink)}
  .ledensub{font-size:12px;color:var(--muted-ink);margin-top:2px}
  .ledendetail{padding:0 0 14px 0;border-bottom:1px solid var(--border)}
  .ledendetail:last-child{border-bottom:none}
  .resetbtn{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;background:var(--warn-bg);
    border:1.5px solid rgba(168,94,28,0.35);cursor:pointer;font-size:14px;font-weight:700;color:var(--warn);
    text-align:center}
  .okmsg{font-size:13px;color:var(--accent);font-weight:700;margin-top:8px}
  .paramfout{font-size:13px;color:var(--err);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar">
    <div class="brandwrap" id="brandwrap">
      <div class="brand">GoyerFlow</div>
      <div class="sub" id="subline">Speeltempo-tracker voor leden</div>
    </div>
    <div class="versiebadge" id="versiebadge"></div>
  </div>
  <div id="app" class="screen"></div>
</div>

<script>
/* ============================================================================================
   GoyerFlow — v0.11.1
   Versienummer bij elke volgende build op TWEE plekken bijwerken: deze kopregel-comment en de
   APP_VERSIE-constante hieronder (zelfde patroon als de Marshal App — zie diens bouwgeschiedenis
   voor de precedent-regel). De zichtbare versie-indicator naast "GoyerFlow" in de topbar wordt
   dynamisch uit APP_VERSIE afgeleid, dus die hoeft nergens los bijgewerkt te worden.
   Bump-conventie: patch (0.1.0 → 0.1.1) voor kleine/bugfix-wijzigingen, minor (0.1.x → 0.2.0)
   voor een nieuwe/functioneel andere feature — zelfde onderscheid als bij de Marshal App.
   v0.2.0: beheerders inlog functie (Tracker/Parameters/Admin-tabs, pincode-reset, "pincode
   vergeten"-link). Vereist twee nieuwe kolommen in Supabase — zie schema.sql, Fase 2b.
   v0.3.0: GPS-ondersteunde check-in op de "zelf"-kaart. Bij elk bezoek aan het trackerscherm wordt
   op de achtergrond een eenmalige, foreground GPS-fix opgevraagd (stilzwijgend bij weigering/

      (die is hier niet beschikbaar). De uitkomst is tegen Kay's eigen "Verwachte rondetijden"-
      tabel gevalideerd or (tweebal 210, driebal ~224-225, vierbal 240 — binnen afronding gelijk),
      maar dit moet je nog bevestigen tegen de echte Marshal App-formule voordat dit als
      definitief geldt.
   ============================================================================================ */
const AANTAL_HOLES = 18;
const PAR_VERDELING = { 3: 4, 4: 10, 5: 4 }; // aantal holes per par-type over de volle 18 holes — sinds v0.8.0 puur documentair/ter controle (HOLE_PAR klopt hiermee, zie basisRondetijdVoorRonde), niet meer zelf gebruikt in de rondetijd-berekening.
const ZICHTBAARHEIDSVENSTER_MINUTEN = 15;    // zelfde venster als Marshal App v1.9.0

// Par per hole, North Course (hole 1 t/m 18). Bevestigd tegen goyer.nl (per-hole pagina's) en de
// GolfPass-scorekaart van deze baan — 4x par 3 (holes 2,5,11,14), 10x par 4, 4x par 5 (holes
// 4,7,13,17), optellend tot par 72 over 18 holes, consistent met PAR_VERDELING hierboven.
const HOLE_PAR = [4, 3, 4, 5, 3, 4, 5, 4, 4, 4, 3, 4, 5, 3, 4, 4, 5, 4];

/* ============================================================================================
   Rondetype-bewustzijn (v0.8.0) — zie claude/bouwgeschiedenis-goyerflow-app.md voor de volledige
   analyse. Niet elke flight start op hole 1 en speelt 18 holes: Teecontrol levert per boeking een
   lus ("North Course 1ste 9" / "2de 9") plus has_crossover/is_crossover, waaruit teecontrol-sync nu
   (zie bepaalRondeType() in die Edge Function, geport van de Marshal App) één van vier rondetypes
   afleidt en in flights.ronde_type zet:
     "18holes"         — start hole 1,  speelt door, 18 holes
     "18holes_vanaf10" — start hole 10, speelt door, 18 holes (holevolgorde WRAPT: 10..18,1..9)
     "9holes_voor"     — start hole 1,  stopt na 9 holes
     "9holes_achter"   — start hole 10, stopt na 9 holes
   Alle interne tijd-/positieberekeningen (rondetijdVoor/verwachtePositie/projecteerVanafMelding/
   pasWachttijdToe/rondeVoltooid, en checkpointOrdinaal voor de voor/achter-afstandsvergelijking)
   blijven rekenen met een RONDE-RELATIEF holenummer (1 = eerste hole van DEZE ronde, zoals het al
   altijd deed) — dat blijft correct en wrap-vrij zolang twee vergeleken flights dezelfde lus (dus
   hetzelfde starthole) delen, wat voor voor/zelf/achter altijd het geval is. Pas op de twee plekken
   waar een FYSIEK holenummer (zoals op de baan/in de Marshal App) nodig is — de par-opzoeking in
   doorlaatMarge (HOLE_PAR is fysiek geïndexeerd) en alle schermteksten/stepper-labels — wordt
   fysiekeHole() toegepast. Ontbrekend/onherkend ronde_type (oude data van vóór deze migratie) valt
   terug op het oorspronkelijke gedrag: start hole 1, 18 holes — dus geen gedragsverandering voor
   reeds bestaande flights totdat ze opnieuw gesynchroniseerd zijn.
   ============================================================================================ */
const RONDE_INFO = {
  "18holes": { startHole: 1, holesInRonde: 18 },
  "18holes_vanaf10": { startHole: 10, holesInRonde: 18 },
  "9holes_voor": { startHole: 1, holesInRonde: 9 },
  "9holes_achter": { startHole: 10, holesInRonde: 9 },
};
function rondeInfo(rondeType) {
  return RONDE_INFO[rondeType] || { startHole: 1, holesInRonde: AANTAL_HOLES };
}

// Fysiek holenummer (1-18, zoals op de baan) voor de N-de hole van DEZE ronde (1-based: 1 = eerste
// hole van de ronde). Wrapt vanzelf van 18 terug naar 1 bij een "vanaf 10"-ronde die over de 18 heen
// doorspeelt.
function fysiekeHole(rondeType, rondeHoleIndex) {
  const { startHole } = rondeInfo(rondeType);
  return ((startHole - 1 + rondeHoleIndex - 1) % 18) + 1;
}

// Inverse van fysiekeHole(): voor een fysiek holenummer (zoals een GPS-match, zie
// dichtstbijzijndeCheckpoint hieronder — die scant altijd alle 18 fysieke holes), de hoeveelste hole
// van DEZE ronde dat is (1-based), geklemd op de ronde zelf. Nodig op precies één plek: de
// GPS-suggestie geeft een fysiek holenummer terug, terwijl de stepper/het gemelde holenummer
// ronde-relatief is (zie de toelichting bij RONDE_INFO).
function rondeIndexVanFysiek(rondeType, fysiekeHoleNr) {
  const { startHole, holesInRonde } = rondeInfo(rondeType);
  const ongeklemd = ((fysiekeHoleNr - startHole + 18) % 18) + 1;
  return Math.max(1, Math.min(holesInRonde, ongeklemd));
}

/* ============================================================================================
   Supabase REST helper
   ============================================================================================ */
async function sb(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=representation",
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`Supabase-fout (${res.status}): ${body}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

function loggen(persoonscode, type, succes) {
  // Logboek van logins/pincode-wijzigingen (maatregel 1+2 uit "Login-beveiliging"). Best-effort:
  // een logging-fout mag een login nooit blokkeren.
  sb("login_log", {
    method: "POST",
    prefer: "return=minimal",
    body: JSON.stringify({ persoonscode, type, succes }),
  }).catch((e) => console.warn("Loggen mislukt (niet blokkerend):", e));
}

/* ============================================================================================
   Rondetijd-berekening
   ============================================================================================ */
// v0.8.0: was een vlak gemiddelde (PAR_VERDELING: 4x par3 + 10x par4 + 4x par5, ongeacht welke
// holes daadwerkelijk gespeeld worden) — nu een exacte som over de FYSIEKE holes van déze ronde,
// met het al bevestigde HOLE_PAR. Voor een volle 18-holes-ronde is de uitkomst identiek aan de oude
// berekening (PAR_VERDELING is precies de par-verdeling die in HOLE_PAR zit, zie de toelichting
// bovenaan dit bestand) — geen gedragsverandering daar. Voor een 9-holes-ronde (voor óf achter) was
// er tot nu toe helemaal geen correcte basis: de vaste 18-holes-waarde zou de helft te hoog zijn.
function basisRondetijdVoorRonde(params, rondeType) {
  const { holesInRonde } = rondeInfo(rondeType);
  let totaal = 0;
  for (let i = 1; i <= holesInRonde; i++) {
    const par = HOLE_PAR[fysiekeHole(rondeType, i) - 1] ?? 4;
    totaal += par === 3 ? params.par3_minuten : par === 5 ? params.par5_minuten : params.par4_minuten;
  }
  return totaal;
}

function rondetijdVoor(params, aantalSpelers, gemiddeldeHcp, rondeType) {
  const { holesInRonde } = rondeInfo(rondeType);
  const basis = basisRondetijdVoorRonde(params, rondeType);
  const hcpBovenTien = Math.max(0, gemiddeldeHcp - 10);
  const hcpCorrectie = hcpBovenTien * params.hcp_correctie_per_punt_boven_10 * holesInRonde;
  const extraSpelers = Math.max(0, aantalSpelers - 2);
  const flightCorrectie = extraSpelers * params.flightgrootte_correctie_per_speler_boven_2 * holesInRonde;
  return basis + hcpCorrectie + flightCorrectie;
}

// "hole" hierin (en in pasWachttijdToe/projecteerVanafMelding) blijft RONDE-RELATIEF (1 = eerste
// hole van déze ronde) — zie de rondetype-toelichting bij RONDE_INFO hierboven. Pas bij weergave of
// een par-opzoeking wordt dit via fysiekeHole() naar het fysieke holenummer vertaald.
function verwachtePositie(starttijdISO, minutenPerHole, nu, rondeType) {
  const { holesInRonde } = rondeInfo(rondeType);
  const starttijd = new Date(starttijdISO).getTime();
  const verstreken = (nu.getTime() - starttijd) / 60000; // minuten
  const fractie = verstreken / minutenPerHole;
  const holeIndex = Math.floor(fractie);
  const rest = fractie - holeIndex;
  let checkpoint = "afslag";
  if (rest >= 0.75) checkpoint = "green";
  else if (rest >= 0.25) checkpoint = "fairway";
  const hole = Math.max(1, Math.min(holesInRonde, holeIndex + 1));
  return { hole, checkpoint, verstreken, fractie };
}

const CHECKPOINT_LABEL = { afslag: "afslag", fairway: "fairway", green: "green" };
const CHECKPOINT_KNOPLABEL = { afslag: "Afslag", fairway: "Fairway", green: "Green" };
const CHECKPOINT_VOLGORDE = ["afslag", "fairway", "green"];

function checkpointFractie(key) {
  return { afslag: 0, fairway: 0.5, green: 1 }[key] ?? 0;
}

// Middelpunt van elke checkpoint-"zone" i.p.v. de grenswaarde (zie verwachtePositie: afslag =
// rest < 0.25, fairway = 0.25-0.75, green = rest >= 0.75). checkpointFractie() geeft de GRENS
// (0 / 0.5 / 1) — prima voor de "op schema"-vergelijking, maar onbruikbaar om een melding mee te
// verankeren: een fractie van precies N (green van hole N) ligt exact op de drempel en zou bij het
// direct terugrekenen naar hole/checkpoint onmiddellijk omslaan naar "afslag van hole N+1". Het
// middelpunt van de zone voorkomt dat: die rekent vlak na het melden weer exact terug naar wat er
// net gemeld is.
function checkpointFractieMidden(key) {
  return { afslag: 0.125, fairway: 0.5, green: 0.875 }[key] ?? 0.125;
}

// Discreet volgnummer van een checkpoint, doorlopend over de hele ronde (hole 1/afslag = 0,
// hole 1/fairway = 1, hole 1/green = 2, hole 2/afslag = 3, enz.) — gebruikt om de AFSTAND tussen
// twee flights uit te drukken in checkpoint-stappen, voor de doorlaat-zichtbaarheid hieronder.
function checkpointOrdinaal(hole, checkpoint) {
  const idx = { afslag: 0, fairway: 1, green: 2 }[checkpoint] ?? 0;
  return (hole - 1) * 3 + idx;
}

// Marge (in checkpoint-stappen, zie checkpointOrdinaal) waarbinnen een doorlaat-knop getoond
// wordt, bepaald door de par van de hole van de VOOROP liggende flight — zie scopedocument
// "Doorlaat-afstand" en Kay's voorbeeld: op een par-3 hole (korte speeltijd) is 2 stappen marge al
// realistisch (bijv. achterflight op hole N-1/green, jij al op hole N/afslag); op par-4/5 holes
// (langere speeltijd) is de marge ruimer, 3 stappen.
function doorlaatMarge(hole) {
  const par = HOLE_PAR[hole - 1] ?? 4;
  return par === 3 ? 2 : 3;
}

// Het checkpoint ONMIDDELLIJK NA het gegeven checkpoint, in de vaste Afslag → Fairway → Green →
// volgende hole/Afslag-volgorde — gebruikt om de wachttijd bij een doorlaat te bepalen (zie
// duurTotVolgendCheckpoint/doorlaatWissel hieronder). "hole" is hier, net als overal, RONDE-RELATIEF
// — zie de rondetype-toelichting bij RONDE_INFO. Klemt op de laatste green van DEZE ronde (geen hole
// na de laatste), vandaar rondeType hier nodig.
function volgendCheckpoint(hole, checkpoint, rondeType) {
  const { holesInRonde } = rondeInfo(rondeType);
  const idx = { afslag: 0, fairway: 1, green: 2 }[checkpoint] ?? 0;
  const ordinaal = (hole - 1) * 3 + idx + 1;
  const nieuweHole = Math.floor(ordinaal / 3) + 1;
  if (nieuweHole > holesInRonde) return { hole: holesInRonde, checkpoint: "green" };
  return { hole: nieuweHole, checkpoint: CHECKPOINT_VOLGORDE[ordinaal % 3] };
}

// Hoe lang (in minuten, met het EIGEN tempo van de spelende flight) het duurt om van het gegeven
// checkpoint naar het volgende te spelen — zie doorlaatWissel: de flight die doorlaat staat precies
// zo lang stil als de doorgelaten flight nodig heeft om dat volgende stuk te spelen. Levert 0 op bij
// een holeovergang (green → afslag van de volgende hole): die overgang kost in dit rekenmodel
// sowieso al geen tijd (checkpointFractie(green) van hole N en checkpointFractie(afslag) van hole
// N+1 vallen op precies dezelfde fractie) — bestaande modelkeuze, geen nieuwe aanname hier.
function duurTotVolgendCheckpoint(hole, checkpoint, minutenPerHole, rondeType) {
  const huidigeFractie = (hole - 1) + checkpointFractie(checkpoint);
  const doel = volgendCheckpoint(hole, checkpoint, rondeType);
  const doelFractie = (doel.hole - 1) + checkpointFractie(doel.checkpoint);
  return Math.max(0, doelFractie - huidigeFractie) * minutenPerHole;
}

// Wachttijd na een doorlaat (zie doorlaatWissel in renderTracker, en de kolommen wacht_tot/
// wacht_hole/wacht_checkpoint in schema.sql — Fase 2c): Kay's model is dat de flight die doorlaat
// stilstaat op het checkpoint waar dat gebeurt, en pas na wacht_tot haar eigen tempo weer laat
// doortellen. Dat is EXACT (geen middelpunt-truc nodig, zoals bij projecteerVanafMelding — dit is
// een bewuste, precieze waarneming op het moment van doorlaten, geen mogelijk-onnauwkeurige eigen
// melding) tot wacht_tot, en loopt daarna normaal door vanaf dat ankerpunt — zelfde projectie-vorm
// als projecteerVanafMelding, nu met wacht_tot als ankertijdstip in plaats van gerapporteerd_tijdstip.
// Overschrijft bewust ELKE andere positiebron (schema, eigen melding, correctie) zolang hij actief
// is: dit is de meest recente, fysiek geobserveerde waarheid. Raakt nooit de PURE schema-positie
// (posVan/verwachtePositie zonder dit) die voor de "op schema"-vergelijking gebruikt wordt — die
// moet de afwijking door het wachten juist laten zien, niet verbergen.
function pasWachttijdToe(pos, flight, minutenPerHole, nu, rondeType) {
  if (!flight.wacht_tot) return pos;
  const { holesInRonde } = rondeInfo(rondeType);
  const wachtTot = new Date(flight.wacht_tot).getTime();
  const ankerFractie = (flight.wacht_hole - 1) + checkpointFractie(flight.wacht_checkpoint);
  if (nu.getTime() < wachtTot) {
    return { ...pos, hole: flight.wacht_hole, checkpoint: flight.wacht_checkpoint, fractie: ankerFractie };
  }
  const minutenSindsWachttot = (nu.getTime() - wachtTot) / 60000;
  const fractie = ankerFractie + minutenSindsWachttot / minutenPerHole;
  const holeIndex = Math.floor(fractie);
  const rest = fractie - holeIndex;
  let checkpoint = "afslag";
  if (rest >= 0.75) checkpoint = "green";
  else if (rest >= 0.25) checkpoint = "fairway";
  const hole = Math.max(1, Math.min(holesInRonde, holeIndex + 1));
  return { ...pos, hole, checkpoint, fractie };
}

// Ronde voltooid: de ONGECLEMDE fractie (dus los van de weergegeven hole, die bij
// verwachtePositie() al op het aantal holes van DEZE ronde wordt vastgezet) is voorbij het totaal
// aantal holes van deze ronde — er is geen "hole na de laatste", dus vanaf hier moet de tracker een
// eindstatus laten zien in plaats van te blijven "hangen" op de laatste hole.
function rondeVoltooid(pos, rondeType) {
  return pos.fractie >= rondeInfo(rondeType).holesInRonde;
}

// Projecteert de laatst gemelde positie vooruit in de tijd, met hetzelfde tempo (minutenPerHole)
// als de live berekening. Dit lost een sprong-bug op: zonder dit viel de weergave direct na het
// melden van een (eventueel handmatig gecorrigeerde) positie terug op de pure starttijd-gebaseerde
// berekening (verwachtePositie vanaf starttijd_effectief) — die bij een net gemelde, afwijkende
// positie een heel andere hole/checkpoint kan tonen dan wat net is ingedrukt. Door in plaats
// daarvan vanaf het gemelde punt verder te tellen, sluit de weergave direct na een melding aan bij
// wat er net is gemeld, en loopt hij daarna vanzelf door (Afslag → Fairway → Green → volgende hole)
// — precies het gedrag dat hoort bij "alleen een knopdruk mag een melding geven, de rest is live".
// Geeft null terug als er nog geen melding is; de aanroeper valt dan terug op de pure live positie.
function projecteerVanafMelding(zelf, minutenPerHole, nu, rondeType) {
  if (zelf.gerapporteerde_hole == null || zelf.gerapporteerd_checkpoint == null || !zelf.gerapporteerd_tijdstip) {
    return null;
  }
  const { holesInRonde } = rondeInfo(rondeType);
  const gemeldeFractie = (zelf.gerapporteerde_hole - 1) + checkpointFractieMidden(zelf.gerapporteerd_checkpoint);
  const minutenSindsMelding = (nu.getTime() - new Date(zelf.gerapporteerd_tijdstip).getTime()) / 60000;
  const fractie = gemeldeFractie + minutenSindsMelding / minutenPerHole;
  const holeIndex = Math.floor(fractie);
  const rest = fractie - holeIndex;
  let checkpoint = "afslag";
  if (rest >= 0.75) checkpoint = "green";
  else if (rest >= 0.25) checkpoint = "fairway";
  const hole = Math.max(1, Math.min(holesInRonde, holeIndex + 1));
  return { hole, checkpoint, fractie };
}

// Zet de tijd-fractie bínnen één hole (0-1, met de checkpoint-zonegrenzen op 0.25/0.75 — zie
// verwachtePositie hierboven) om naar een schermpositie (0-100%) voor de voortgangsbalk onder de
// Afslag/Fairway/Green-knoppen. De drie knoppen zijn op het scherm drie GELIJKE kolommen (elk 1/3
// breed), terwijl hun tijdzones dat niet zijn (25% / 50% / 25% van de holetijd) — deze functie
// buigt dat recht, zodat de balk precies de Fairway-kolom (bij 1/3) bereikt op het moment dat die
// knop wit wordt (restFractie 0.25), en precies de Green-kolom (bij 2/3) op het moment dat Green
// wit wordt (restFractie 0.75). Binnen elke zone loopt de balk daarbij gewoon lineair door.
function tijdlijnPercentage(restFractie) {
  const r = Math.min(1, Math.max(0, restFractie));
  if (r < 0.25) return (r / 0.25) * (100 / 3);
  if (r < 0.75) return 100 / 3 + ((r - 0.25) / 0.5) * (100 / 3);
  return 200 / 3 + ((r - 0.75) / 0.25) * (100 / 3);
}

function formatTijd(iso) {
  return new Date(iso).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}

function formatDuur(minuten) {
  const h = Math.floor(minuten / 60);
  const m = Math.round(minuten - h * 60);
  return `${h} uur ${m} minuten`;
}

// Conclusie bij een zelf-gemelde positie — zelfde vijf categorieën/kleuren/drempels als de
// goedgekeurde mockup (Tracker.dc.html): veel_te_snel/te_snel/op_schema/te_langzaam/
// veel_te_langzaam (key/kleur/toonTipsKnop-logica elders blijven ongewijzigd).
// Label/zin AANGEPAST (27 oktober 2026, Kay's feedback tijdens de veldtest): "veel te snel" klinkt
// als een verwijt, terwijl voorlopen op schema op zich niets verkeerds is zolang je niemand in de
// weg loopt. Vervangen door een neutrale, feitelijke holes-voor/achter-op-schema-indicatie met het
// werkelijke verschil (bijv. "1,2 holes voor op schema") i.p.v. een waardeoordeel — zowel in de
// korte badge-tekst (label) als de volzin (zin) in de kaart.
function conclusieVoor(deltaHoles) {
  const afgerond = Math.round(Math.abs(deltaHoles) * 10) / 10;
  // Nederlandse decimaalnotatie (komma), consistent met de rest van de app (bijv. hcp-weergave).
  const getal = String(afgerond).replace(".", ",");
  const voorText = `${getal} holes voor op schema`;
  const achterText = `${getal} holes achter op schema`;
  if (deltaHoles >= 1.0) return { key: "veel_te_snel", label: voorText, kleur: "var(--blue-dark)", zin: `Dus je loopt ${voorText}.` };
  if (deltaHoles >= 0.4) return { key: "te_snel", label: voorText, kleur: "var(--blue)", zin: `Dus je loopt ${voorText}.` };
  if (deltaHoles <= -1.0) return { key: "veel_te_langzaam", label: achterText, kleur: "var(--err)", zin: `Dus je loopt ${achterText}.` };
  if (deltaHoles <= -0.4) return { key: "te_langzaam", label: achterText, kleur: "var(--warn)", zin: `Dus je loopt ${achterText}.` };
  return { key: "op_schema", label: "Op schema", kleur: "var(--accent)", zin: "Dus je loopt op schema." };
}

/* ============================================================================================
   GPS-ondersteunde check-in — Fase 2c (toegevoegd 23 oktober 2026, zie
   claude/bouwgeschiedenis-goyerflow-app.md). Eén keer per bezoek aan het trackerscherm (zie de
   aanroep van startGpsPositiebepaling() in render()) wordt een eenmalige, foreground GPS-fix
   opgevraagd en vergeleken met HOLE_GPS, om een suggestie te doen op de "zelf"-kaart — ALTIJD als
   voorstel, nooit als automatische melding: de speler moet zelf op "Bevestigen" drukken (zie
   renderTracker: gpsPending/markerKnoppenZelf/zelfPositieBevestigenGps). Bij weigering, time-out of
   een niet-ondersteunende browser werkt de kaart exact zoals zonder deze functie — zie
   haalGpsPositieOp(). Bewust geen achtergrond-tracking: de Geolocation API biedt daar op iOS/
   Android-PWA's geen betrouwbare ondersteuning voor, dus alleen een eenmalige fix bij het openen
   van het scherm.
   ============================================================================================ */

// Haversine-afstand in meters tussen twee {lat, lon}-punten.
function gpsAfstandMeter(p1, p2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(p2.lat - p1.lat);
  const dLon = toRad(p2.lon - p1.lon);
  const a = Math.sin(dLat / 2) ** 2
          + Math.cos(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Coördinaat van één checkpoint. "fairway" valt terug op het midden tussen afslag en green als er
// geen expliciet ingemeten fairwaypunt is (zie toelichting bij HOLE_GPS hierboven).
function holeCheckpointCoord(hole, checkpoint) {
  const punten = HOLE_GPS[hole - 1];
  if (!punten) return null;
  if (checkpoint === "afslag") return punten.afslag;
  if (checkpoint === "green") return punten.green;
  if (punten.fairway) return punten.fairway;
  return { lat: (punten.afslag.lat + punten.green.lat) / 2, lon: (punten.afslag.lon + punten.green.lon) / 2 };
}

// Verst toegestane afstand (in meters) tussen een GPS-fix en het dichtstbijzijnde checkpoint voordat
// die match nog als bruikbare suggestie geldt — zonder deze grens geeft dichtstbijzijndeCheckpoint()
// ALTIJD een "dichtstbijzijnde" terug, ook van kilometers afstand (bijv. thuis getest, ver van de
// baan), wat een onzinnige suggestie zou tonen. Op basis van de eigen inmeting: de langste afslag-
// green-afstand binnen één hole is ~510m, de hele baan past in een rechthoek van ~1,15km diagonaal —
// 400m is ruim boven wat je op de baan zelf tussen een punt en het dichtstbijzijnde checkpoint kunt
// tegenkomen, maar ruim onder "duidelijk niet op de baan".
const GPS_MAX_AFSTAND_METER = 400;

// Na hoeveel holes sinds de laatste eigen melding de "op schema"-conclusie niet langer stilzwijgend
// getoond wordt, maar eerst opnieuw bevestigd moet worden (zie renderTracker, moetOpnieuwBevestigen
// — Kay's feedback 25 oktober 2026: een oude melding kan een inmiddels verkeerde conclusie laten
// zien, en bevestigen kost de speler maar één tik op de al-voorgeselecteerde Afslag/Fairway/Green-
// knop). In HOLES, niet in minuten — zo krijgt een langzame flight dezelfde "holes speeltijd" voordat
// er opnieuw gevraagd wordt als een snelle flight, in plaats van dat een vast aantal minuten voor een
// langzame flight te snel of voor een snelle flight te laat zou aanvoelen.
const HERBEVESTIG_DREMPEL_HOLES = 2;

// Dichtstbijzijnde van alle 18×3 checkpoints t.o.v. een gemeten positie — puur een suggestie, zie
// de toelichting hierboven. Geeft null terug als zelfs de dichtstbijzijnde match verder weg ligt dan
// GPS_MAX_AFSTAND_METER (bijv. thuis getest) — de aanroeper behandelt dat hetzelfde als "geen GPS
// beschikbaar", dus geen suggestie i.p.v. een misleidende.
function dichtstbijzijndeCheckpoint(positie) {
  let beste = null;
  for (let hole = 1; hole <= AANTAL_HOLES; hole++) {
    for (const checkpoint of CHECKPOINT_VOLGORDE) {
      const coord = holeCheckpointCoord(hole, checkpoint);
      if (!coord) continue;
      const afstandMeter = gpsAfstandMeter(positie, coord);
      if (!beste || afstandMeter < beste.afstandMeter) beste = { hole, checkpoint, afstandMeter };
    }
  }
  if (beste && beste.afstandMeter > GPS_MAX_AFSTAND_METER) return null;
  return beste;
}

// Eenmalige, foreground GPS-fix. Geeft {lat, lon} terug, of null bij weigering/time-out/een browser
// zonder Geolocation-ondersteuning — de aanroeper (startGpsPositiebepaling) behandelt null exact
// als "geen GPS beschikbaar": de kaart werkt dan verder zoals vandaag, zonder foutmelding.
function haalGpsPositieOp() {
  return new Promise((resolve) => {
    if (!("geolocation" in navigator)) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  });
}

// Start, eenmaal per bezoek aan het trackerscherm (zie de aanroep in render()), de GPS-suggestie:
// zet gpsStatus op "bezig" (renderTracker toont dan de korte toestemmings-uitleg), vraagt een fix
// op, en zet bij succes zowel de hole-stepper als de checkpoint-keuze al op de dichtstbijzijnde
// match. De speler ziet die suggestie in renderTracker (gpsPending) en moet zelf bevestigen of
// aanpassen, zie zelfPositieBevestigenGps(). Loopt synchroon tot de eerste "await": gpsStatus staat
// dus al op "bezig" zodra render() verderop renderTracker(app) aanroept, zonder dat hier zelf al een
// render() nodig is — dat voorkomt een dubbele render bij het openen van het scherm. De guard op
// state.scherm ná de await voorkomt dat een trage/late fix nog een render forceert nadat de speler
// al is uitgelogd of naar het beheerderscherm is gegaan.
async function startGpsPositiebepaling() {
  trackerLocal.gpsStatus = "bezig";
  trackerLocal.gpsSuggestie = null;
  trackerLocal.gpsCheckpointDraft = null;
  trackerLocal.gpsBevestigd = false;
  const positie = await haalGpsPositieOp();
  if (state.scherm !== "tracker") return;
  const suggestie = positie ? dichtstbijzijndeCheckpoint(positie) : null;
  if (!suggestie) {
    // Geen fix, of wel een fix maar te ver van elk checkpoint (zie GPS_MAX_AFSTAND_METER, bijv.
    // thuis getest) — in beide gevallen geen suggestie tonen, kaart werkt als vandaag.
    trackerLocal.gpsStatus = "nietBeschikbaar";
    render();
    return;
  }
  trackerLocal.gpsStatus = "beschikbaar";
  trackerLocal.gpsSuggestie = suggestie;
  trackerLocal.gpsCheckpointDraft = suggestie.checkpoint;
  // suggestie.hole is FYSIEK (dichtstbijzijndeCheckpoint scant alle 18 fysieke holes) — zelfHoleDraft
  // is ronde-relatief, zie rondeIndexVanFysiek().
  trackerLocal.zelfHoleDraft = rondeIndexVanFysiek(state.flight.ronde_type, suggestie.hole);
  render();
}

const TRACKER_VERVERS_MS = 20000;
let trackerIntervalId = null;

// Vloeiend bijgewerkt (elke seconde) i.p.v. pas bij de volgende volledige verversing (20s): alleen
// de breedte van de voortgangsbalk-DOM-node wordt aangepast, geen volledige render() — zie

// flight "de klok stopzet": de Tracker-tab en het flight-detailscherm werden tot nu toe maar op twee
// momenten berekend — bij het wisselen van tab en bij een klik op een flight — en daarna nooit meer,
// in tegenstelling tot het ledenscherm (trackerIntervalId hierboven). Dit verklaarde zowel de
// "bevroren klok" als de afwijkende checkpoint-highlight tussen lid- en beheerderscherm voor

function render() {
  const app = document.getElementById("app");
  const sub = document.getElementById("subline");
  const topbar = document.getElementById("topbar");
  app.innerHTML = "";
  const isAuthScherm = state.scherm === "persoonscode" || state.scherm === "pincode" || state.scherm === "admin_login";
  app.className = "screen" + (state.scherm === "tracker" ? " tracker" : "") + (isAuthScherm ? " auth" : "");

  // Topbar: op het tracker- en beheerderscherm een expliciete "Uitloggen"-knop rechts (v0.7.0 —

  // een ander menu terwijl het in werkelijkheid altijd uitlogde; Kay's feedback, 25 oktober 2026) —
  // en een contextregel in plaats van de generieke ondertitel.
  const bestaandeLogoutbtn = document.getElementById("logoutbtn");
  if (bestaandeLogoutbtn) bestaandeLogoutbtn.remove();

    const logoutBtn = el("button", { class: "logoutbtn", id: "logoutbtn", "aria-label": "Uitloggen", onclick: logout, text: "Uitloggen" });

    sub.textContent = `${state.flight.aantal_spelers}-bal · gestart ${formatTijd(state.flight.starttijd_effectief)}`;
    if (!trackerIntervalId) {
      trackerIntervalId = setInterval(() => {
        if (state.scherm === "tracker") renderTracker(document.getElementById("app"), { stil: true });
      }, TRACKER_VERVERS_MS);
      // Eén keer per bezoek aan dit scherm (trackerIntervalId wordt bij het verlaten weer op null
      // gezet, zie de else-takken hieronder) een GPS-suggestie proberen — zie
      // startGpsPositiebepaling() voor waarom dit hier en niet bij het inloggen gebeurt.
      startGpsPositiebepaling();
    }
    if (adminIntervalId) { clearInterval(adminIntervalId); adminIntervalId = null; }
  } else if (state.scherm === "admin") {
    const logoutBtn = el("button", { class: "logoutbtn", id: "logoutbtn", "aria-label": "Uitloggen", onclick: adminUitloggen, text: "Uitloggen" });
    topbar.appendChild(logoutBtn);
    sub.textContent = "Beheerder";
    if (trackerIntervalId) { clearInterval(trackerIntervalId); trackerIntervalId = null; }
    if (tijdlijnIntervalId) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; }
    if (!adminIntervalId) {
      adminIntervalId = setInterval(() => {
        const inhoud = document.getElementById("admininhoud");
        if (state.scherm === "admin" && adminLocal.tab === "tracker" && inhoud && !adminLocal.flightDetailBezig) {
          vulAdminTrackerTab(inhoud, { stil: true });
        }
      }, TRACKER_VERVERS_MS);
    }
  } else {
    sub.textContent = "Speeltempo-tracker voor leden";
    if (trackerIntervalId) { clearInterval(trackerIntervalId); trackerIntervalId = null; }
    if (tijdlijnIntervalId) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; }
    if (adminIntervalId) { clearInterval(adminIntervalId); adminIntervalId = null; }
  }

  if (state.scherm === "persoonscode") return renderPersoonscode(app);
  if (state.scherm === "pincode") return renderPincode(app);
  if (state.scherm === "nieuwe_pincode") return renderNieuwePincode(app);
  if (state.scherm === "tracker") return renderTracker(app);
  if (state.scherm === "admin_login") return renderAdminLogin(app);
  if (state.scherm === "admin") return renderAdmin(app);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

function meldingNode() {
  if (!state.fout) return null;
  return el("div", { class: "msg err", text: state.fout });
}

// Lidcode-opzoeking tolerant voor spaties (v0.7.0, Kay's feedback: "LIND6" of "LIND 6" moeten allebei
// werken bij het inloggen). Lidcode-formaat volgens Kay en de live Teecontrol-data (zie
// teecontrol-sync/index.ts, "RAPP 1"): vier letters, een spatie, dan een cijfer(s) — Teecontrol levert
// 'm altijd MET die spatie aan en zo staat hij ook in de database (vindPersoonscode doet daar alleen
// trim(), geen spatie-normalisatie). Bewust NIET de invoer blind herschrijven naar dat vaste formaat
// (zou een score van toevallig anders opgebouwde codes kunnen missen) — in plaats daarvan eerst een
// exacte match proberen op precies wat is ingetypt (na trim+uppercase, zoals altijd al gebeurde), en
// pas als die niets oplevert de twee meest waarschijnlijke spatie-varianten alsnog proberen.
async function zoekSpelerOpPersoonscode(ruw) {
  const schoon = ruw.trim().toUpperCase();
  const kandidaten = [schoon];
  const zonderSpaties = schoon.replace(/\s+/g, "");
  if (zonderSpaties !== schoon && !kandidaten.includes(zonderSpaties)) kandidaten.push(zonderSpaties);
  // Spatie invoegen op de grens tussen het letterdeel en het cijferdeel (bugfix 27 oktober 2026,
  // gevonden tijdens Kay's veldtest: "WEL 1" — een lidcode met maar DRIE letters, want gebaseerd op
  // de korte achternaam "Wel" — kon niet inloggen zonder zelf de spatie te typen). De oude aanpak
  // ging uit van een VASTE 4-letter-prefix (zonderSpaties.slice(0,4) + " " + slice(4)) en probeerde
  // die bovendien alleen bij een lengte > 4 — bij "WEL1" (lengte 4) werd deze variant dus nooit
  // geprobeerd. Nu op basis van de werkelijke grens tussen letters en cijfers, ongeacht hun aantal —
  // werkt dus voor elke combinatie (3, 4, 5+ letters).
  const grensMatch = zonderSpaties.match(/^([A-Z]+)(\d+)$/);
  if (grensMatch) {
    const metSpatieOpGrens = grensMatch[1] + " " + grensMatch[2];
    if (!kandidaten.includes(metSpatieOpGrens)) kandidaten.push(metSpatieOpGrens);
  }
  for (const kandidaat of kandidaten) {
    if (!kandidaat) continue;
    const rows = await sb(`spelers?persoonscode=eq.${encodeURIComponent(kandidaat)}&select=*,flights(*)`);
    if (rows && rows.length > 0) return { rows, gebruikteCode: kandidaat };
  }
  return { rows: [], gebruikteCode: schoon };
}
