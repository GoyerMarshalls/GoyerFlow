  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    if (!input.value.trim()) return;
    const btn = document.getElementById("submit-persoonscode");
    btn.disabled = true;
    try {
      const { rows, gebruikteCode: code } = await zoekSpelerOpPersoonscode(input.value);
      if (!rows || rows.length === 0) {
        loggen(code, "login", false);
        state.fout = "Geen geboekte flight gevonden voor deze persoonscode. Probeer het vanaf ongeveer 15 minuten voor je starttijd nog eens, of neem contact op met de caddymaster.";
        render();
        return;
      }
      const speler = rows[0];
      const flight = speler.flights;
      if (flight.uitgestapt) {
        loggen(code, "login", false);
        state.fout = "Deze flight staat als uitgestapt geregistreerd.";
        render();
        return;
      }
      const nu = new Date();
      const venstertijd = new Date(new Date(flight.starttijd_effectief).getTime() - ZICHTBAARHEIDSVENSTER_MINUTEN * 60000);
      if (nu < venstertijd) {
        loggen(code, "login", false);
        const tijdstr = venstertijd.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
        state.fout = `Nog niet beschikbaar — deze flight wordt zichtbaar vanaf ${tijdstr} (15 minuten voor de starttijd).`;
        render();
        return;
      }
      state.speler = speler;
      state.flight = flight;
      state.fout = null;
      if (TIJDELIJK_SKIP_PINCODE_VOOR_VELDTEST) {
        // Veldtest-modus (zie bouwgeschiedenis, 24 oktober 2026): persoonscode alleen is genoeg,
        // geen pincode-scherm en geen verplichte pincode-wijziging. Wel gewoon gelogd als geslaagde
        // login, zodat login_log net als normaal bijhoudt wie er is ingelogd en wanneer.
        loggen(code, "login", true);
        state.scherm = "tracker";
        render();
        return;
      }
      // Bij de eerste keer inloggen is de pincode altijd de vaste standaardwaarde 0000 — die laten
      // invoeren valideert niets (iedereen kent 'm), dus dan gaan we direct door naar het kiezen
      // van een eigen pincode in plaats van eerst 0000 te laten intikken.
      state.scherm = speler.pincode_gewijzigd ? "pincode" : "nieuwe_pincode";
      render();
    } catch (e) {
      state.fout = "Er ging iets mis bij het ophalen van je gegevens. Probeer het zo nog eens.";
      console.error(e);
      render();
    } finally {
      btn.disabled = false;
    }
  };

  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

  app.append(
    el("div", { class: "authheader" }, [
      el("h1", { class: "authtitle", text: "Welkom bij GoyerFlow" }),
      el("p", { class: "authtagline", text: "De Speeltempo-tracker" }),
    ]),
    el("p", { class: "authdesc", text: "Deze app biedt inzicht in het speeltempo van jouw flight, eventueel met suggesties om dat te verbeteren." }),
    ...(TIJDELIJK_SKIP_PINCODE_VOOR_VELDTEST
      ? [el("p", { class: "msg warn", text: "⚠️ Veldtest-modus: de pincode-check is tijdelijk uitgeschakeld. Een lidcode is op zichzelf genoeg om in te loggen." })]
      : []),
    el("label", { text: "Log in met je Goyer Lidcode" }),
    input,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-persoonscode", onclick: submit, text: "Verder" }),
    el("button", { class: "authlink", onclick: toonAdminLogin, text: "Beheerder inlog" })
  );
  input.focus();
}

/* ---- Scherm 2: pincode ---- */
function renderPincode(app) {
  const input = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "••••" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const pin = input.value.trim();
    if (pin.length !== 4) { state.fout = "Vul een pincode van 4 cijfers in."; render(); return; }
    const btn = document.getElementById("submit-pincode");
    btn.disabled = true;
    try {
      if (pin !== state.speler.pincode) {
        loggen(state.speler.persoonscode, "login", false);
        state.fout = "Onjuiste pincode.";
        render();
        return;
      }
      loggen(state.speler.persoonscode, "login", true);
      if (!state.speler.pincode_gewijzigd) {
        state.scherm = "nieuwe_pincode";
      } else {
        state.scherm = "tracker";
      }
      state.fout = null;
      render();
    } finally {
      btn.disabled = false;
    }
  };

  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

  app.append(
    el("div", { class: "authheader" }, [
      el("h1", { class: "authtitle", text: "Welkom bij GoyerFlow" }),
      el("p", { class: "authtagline", text: "De Speeltempo-tracker" }),
    ]),
    el("p", { class: "authwelkom", text: `Welkom, ${state.speler.naam || ""}` }),
    el("label", { text: "Pincode" }),
    input,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-pincode", onclick: submit, text: "Inloggen" }),
    pincodeVergetenLink(state.speler.persoonscode)
  );
  input.focus();
}

// "Pincode vergeten"-link op het pincode-inlogscherm: opent de mailapp van het lid met een
// kant-en-klare mail aan de beheerder, exact zoals Kay de tekst heeft doorgegeven (22/23 oktober
// 2026) — lidcode wordt automatisch ingevuld, "Voornaam Achternaam" blijft een placeholder die het
// lid zelf moet aanpassen (die naam is hier niet los van de volledige naam bekend).
function pincodeVergetenLink(persoonscode) {
  const onderwerp = "GoyerFlow pincode resetten";
  const body = [
    "Beste beheerder,",
    "Ik ben mijn pincode vergeten. Kun je die resetten?",
    "Met vriendelijke groet,",
    "Voornaam Achternaam",
    persoonscode || "Lidcode",
  ].join("\n");
  const href = `mailto:kayvandelinde@gmail.com?subject=${encodeURIComponent(onderwerp)}&body=${encodeURIComponent(body)}`;
  return el("a", { class: "authlink klein", href, text: "Pincode vergeten" });
}

/* ---- Scherm 3: nieuwe pincode (verplicht bij eerste login) ---- */
function renderNieuwePincode(app) {
  const i1 = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "nieuwe pincode" });
  const i2 = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "herhaal" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const p1 = i1.value.trim(), p2 = i2.value.trim();
    if (p1.length !== 4 || !/^\d{4}$/.test(p1)) { state.fout = "Kies een pincode van 4 cijfers."; render(); return; }
    if (p1 !== p2) { state.fout = "De twee pincodes komen niet overeen."; render(); return; }
    if (p1 === "0000") { state.fout = "Kies een andere pincode dan de standaardwaarde 0000."; render(); return; }
    const btn = document.getElementById("submit-nieuwe-pincode");
    btn.disabled = true;
    try {
      await sb(`spelers?id=eq.${state.speler.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        // pincode_ooit_aangemaakt wordt NOOIT meer teruggezet (ook niet door een beheerder-reset,
        // zie resetPincode hieronder) — dat is precies wat de beheerder-ledenlijst gebruikt om te
        // bepalen wie daar ooit in heeft gestaan, zie schema.sql Fase 2b.
        body: JSON.stringify({ pincode: p1, pincode_gewijzigd: true, pincode_ooit_aangemaakt: true }),
      });
      loggen(state.speler.persoonscode, "pincode_wijziging", true);
      state.speler = { ...state.speler, pincode: p1, pincode_gewijzigd: true };
      state.scherm = "tracker";
      state.fout = null;
      render();
    } catch (e) {
      state.fout = "Pincode wijzigen is niet gelukt. Probeer het nog eens.";
      console.error(e);
      render();
    } finally {
      btn.disabled = false;
    }
  };

  app.append(
    el("h1", { text: "Kies je eigen pincode" }),
    el("p", { class: "help", text: "Verplicht bij de eerste keer inloggen. Kies 4 cijfers die je kunt onthouden." }),
    el("label", { text: "Nieuwe pincode" }),
    i1,
    el("label", { text: "Herhaal" }),
    i2,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-nieuwe-pincode", onclick: submit, text: "Pincode instellen" })
  );
  i1.focus();
}

// Herbruikbare opbouw van het spelersoverzicht van een flight: per speler naam + lidcode + lidtype
// op ÉÉN regel (v0.7.0 — stond tot dan op twee regels, Kay's feedback: "lidcode en lidtype achter
// de naam op dezelfde regel") + hcp rechts, gevolgd door de "Gem. handicap flight"-regel. Gebruikt
// door zowel het leden-trackerscherm (de eigen flight, zie renderTracker hieronder) als het admin-
// flight-detailscherm (bouwFlightDetailModal, v0.6.0) — zodat beide exact dezelfde lay-out en hcp-
// gemiddelde tonen, zoals Kay vroeg ("dezelfde lay-out als in de Admin tracker pop-up"). Alle hier
// getoonde spelers zijn per definitie Goyer-leden ("Club lid" is daarom een vaste tekst) — zie
// bouwFlightDetailModal's toelichting hierboven (v0.6.0) voor waarom.
function bouwSpelersoverzicht(spelers) {
  const lijst = spelers || [];
  const spelerrijen = lijst.length === 0
    ? [el("p", { class: "help", text: "Geen spelers gevonden voor deze flight." })]
    : lijst.map((s) => el("div", { class: "spelerrij" }, [
        el("div", { class: "spelernaamrow" }, [
          el("span", { class: "spelernaampil", text: s.naam }),
          el("span", { class: "spelermeta", text: `${s.persoonscode} · Club lid` }),
        ]),
        el("div", { class: "spelerhcp", text: s.hcp != null ? `hcp ${s.hcp}` : "hcp —" }),
      ]));
  const hcps = lijst.map((s) => s.hcp).filter((h) => h !== null && h !== undefined);
  const gemHcp = hcps.length ? Math.round((hcps.reduce((a, b) => a + Number(b), 0) / hcps.length) * 10) / 10 : null;
  const kinderen = [el("div", { class: "spelerlijst" }, spelerrijen)];
  if (gemHcp != null) {
    // Bugfix (27 oktober 2026, Kay akkoord): twee kale document.createTextNode's naast elkaar werden
    // door de flexbox-layout (.gemhcprow heeft justify-content:space-between) als ÉÉN enkel anoniem
    // flex-item behandeld — vandaar "Gem. handicap flight15.9" aan elkaar geplakt, zonder spatie én
    // zonder de bedoelde rechts-uitgelijnde getalwaarde. Elk stuk tekst in een eigen <span> zet ze om
    // in twee echte flex-items, zodat space-between weer werkt zoals bedoeld (label links, getal
    // rechts) — niet alleen een losse spatie toevoegen.
    kinderen.push(el("div", { class: "gemhcprow" }, [
      el("span", { text: "Gem. handicap flight" }),
      el("span", { text: String(gemHcp) }),
    ]));
  }
  return kinderen;
}

// Teecontrol-kleurcodering (v0.14.0, zie schema.sql "Fase 2h") — 1-op-1 overgenomen uit de Marshal
// App (TC_KLEUR_MAP/tcKleur), zelfde hex-waarden. Dit zijn Teecontrol's eigen kleurcodes per speler
// (lidgroep/gasttype), geen GoyerFlow-eigen stijlkeuze — vandaar bewust identiek aan de Marshal App.
const TC_KLEUR_MAP = {
  pink:     { bg: "#fce8e8", fg: "#7a2020" },
  darkBlue: { bg: "#1e3a5f", fg: "#ffffff" },
  beige:    { bg: "#ede0c4", fg: "#5a4020" },
  green:    { bg: "#2d6a4f", fg: "#ffffff" },
  orange:   { bg: "#e07828", fg: "#ffffff" },
  yellow:   { bg: "#e8c030", fg: "#5a4400" },
  gold:     { bg: "#b8880c", fg: "#ffffff" },
};
function tcKleur(kleur) {
  return TC_KLEUR_MAP[kleur] || TC_KLEUR_MAP.pink;
}

// Spelersoverzicht voor BEHEERDER-schermen (v0.14.0, Kay's verzoek 27 oktober 2026 — zie
// bouwgeschiedenis: "anonieme 1-bal" + "waarom geen kleurcodes zoals de Marshal App"). In
// tegenstelling tot bouwSpelersoverzicht() hierboven (die blijft ONGEWIJZIGD, leden-eigen
// trackerscherm, alleen gekoppelde spelers-rijen met persoonscode) toont dit ALLE spelers van de
// flight zoals Teecontrol ze aanlevert — leden én gasten — met Teecontrol's eigen kleur + typelabel
// i.p.v. de vaste tekst "Club lid". Bron: flight.teecontrol_spelers (schema.sql "Fase 2h"), puur
// weergavedata, raakt de login-tabel `spelers` niet. Leeg/null (bv. oude seed-flights, of flights van
// vóór de migratie) valt terug op dezelfde "lus · aantal-bal"-tekst als de Tracker-tab-rijen.
function bouwSpelersoverzichtBeheer(teecontrolSpelers, legeTekst) {
  const lijst = teecontrolSpelers || [];
  const spelerrijen = lijst.length === 0
    ? [el("p", { class: "help", text: legeTekst || "Geen spelers gevonden voor deze flight." })]
    : lijst.map((s) => {
        const kleur = tcKleur(s.kleur);
        return el("div", { class: "spelerrij" }, [
          el("div", { class: "spelernaamrow" }, [
            el("span", { class: "spelernaampil", style: `background:${kleur.bg};color:${kleur.fg}`, text: s.naam }),
            s.type ? el("span", { class: "spelermeta", text: s.type }) : null,
          ].filter(Boolean)),
          el("div", { class: "spelerhcp", text: s.hcp != null ? `hcp ${s.hcp}` : "hcp —" }),
        ]);
      });
  const hcps = lijst.map((s) => s.hcp).filter((h) => h !== null && h !== undefined);
  const gemHcp = hcps.length ? Math.round((hcps.reduce((a, b) => a + Number(b), 0) / hcps.length) * 10) / 10 : null;
  const kinderen = [el("div", { class: "spelerlijst" }, spelerrijen)];
  if (gemHcp != null) {
    kinderen.push(el("div", { class: "gemhcprow" }, [
      el("span", { text: "Gem. handicap flight" }),
      el("span", { text: String(gemHcp) }),
    ]));
  }
  return kinderen;
}

/* ---- Scherm 4: tracker ---- */
async function renderTracker(app, opts = {}) {
  // "stil" = automatische achtergrondverversing (zie TRACKER_VERVERS_MS/trackerIntervalId in
  // render()): geen laad-tekst tonen, en bij een mislukte ophaalactie de bestaande weergave laten
  // staan in plaats van te vervangen door een foutmelding — de speler heeft niets aangeraakt en
  // mag niet merken dat er op de achtergrond iets misging. Bij de eerste, niet-stille load blijft
  // het oude gedrag (laad-tekst, en bij een fout de melding tonen) ongewijzigd.
  const stil = !!opts.stil;
  if (!stil) app.append(el("div", { class: "msg", text: "Bezig met laden…" }));

  let params, flights;
  try {
    [params] = await sb("parameters?select=*&limit=1");
    // spelers(*) (v0.7.0): PostgREST-embed, nodig voor het nieuwe spelersoverzicht bovenaan dit
    // scherm (zie bouwSpelersoverzicht) — haalt de spelers van ALLE flights op deze lus mee (voor/
    // zelf/achter), maar alleen die van "zelf" worden gebruikt; geen aparte losse aanvraag nodig.
    flights = await sb(`flights?lus=eq.${encodeURIComponent(state.flight.lus)}&uitgestapt=eq.false&select=*,spelers(*)&order=starttijd_effectief.asc`);
  } catch (e) {
    console.error(e);
    if (!stil) {
      app.innerHTML = "";
      app.append(el("div", { class: "msg err", text: "Kon de actuele gegevens niet ophalen. Probeer de pagina te verversen." }));
    }
    return;
  }

  const nu = new Date();
  const index = flights.findIndex((f) => f.id === state.flight.id);
  const zelf = flights[index] || state.flight;

  // Blijft PUUR schema-gebaseerd (starttijd_effectief, geen eigen melding) — nodig voor zelfPos
  // hieronder, die bewust tegen het ORIGINELE rondeschema vergelijkt (zie de "op schema"-conclusie
  // verderop), niet tegen een al gemelde/geprojecteerde positie.
  function posVan(flight) {
    const minutenPerHole = rondetijdVoor(params, flight.aantal_spelers, flight.gemiddelde_hcp, flight.ronde_type) / rondeInfo(flight.ronde_type).holesInRonde;
    return { ...verwachtePositie(flight.starttijd_effectief, minutenPerHole, nu, flight.ronde_type), minutenPerHole };
  }

  // Voor de BUUR-flights (voor/achter): als die flight zelf al een positie gemeld heeft — via hun
  // eigen inlog, dezelfde gerapporteerde_hole/checkpoint/tijdstip-velden als bij "zelf" — is dat een
  // veel betrouwbaardere schatting dan de pure schema-aanname, zeker als hun werkelijke tempo van
  // het schema afwijkt. Zelfde aanpak als bij de eigen kaart (projecteerVanafMelding), nu ook
  // toegepast op de buurflights; valt terug op posVan() zolang er nog geen melding van DIE flight
  // is. Bewust NIET gebruikt voor zelfPos (zie hierboven).
  //
  // Uitzondering: als deze flight al eens HANDMATIG gecorrigeerd is (gecorrigeerd=true, via
  // correctieVanVoorMelden/-Achter hieronder), gaat die correctie voor op een eigen melding — een
  // correctie is een bewuste, actuele waarneming van de naaste speler; zonder deze uitzondering zou
  // een (mogelijk verouderde) eigen melding van de buurflight een correctie onzichtbaar maken (de
  // correctie past alleen starttijd_effectief aan, niet de meldingsvelden van de buur).
  function posVanMetMelding(flight) {
    const basis = posVan(flight);
    if (flight.gecorrigeerd) return basis;
    const gemeld = projecteerVanafMelding(flight, basis.minutenPerHole, nu, flight.ronde_type);
    return gemeld ? { ...gemeld, minutenPerHole: basis.minutenPerHole } : basis;
  }

  // Een kandidaat-buurflight die zelf al (vrijwel zeker) klaar is overslaan bij het kiezen van
  // "voor"/"achter" (toegevoegd 27 oktober 2026, Kay's feedback tijdens de veldtest op de baan).
  // Reden: "voor"/"achter" kwamen tot nu toe puur uit de buren-op-starttijd in de lijst, ongeacht of
  // die buur zelf nog speelt. Een flight die is uitgespeeld maar waarvan niemand op "Ronde afgerond"
  // heeft gedrukt (heel gewoon — spelers loggen na afloop lang niet altijd nog even in om dat te
  // bevestigen, zie ook de nieuwe "klaar"-knop in Admin) bleef daardoor voor onbepaalde tijd de
  // voor/achter-plek van zijn startijd-buren innemen, terwijl de ECHTE dichtstbijzijnde nog spelende
  // flight buiten beeld bleef — dat verklaart de verwarrende meldingen tijdens het testen ("deze
  // flight is toch al klaar, hoe kan die dan nog een correctiemelding geven"). Gebruikt dezelfde
  // rondeVoltooid()-berekening als voorRondeVoltooid/achterRondeVoltooid verderop, dus een kandidaat
  // die hier wordt overgeslagen zou toch al als "waarschijnlijk afgerond" zijn getoond — dit zorgt
  // er alleen voor dat zo'n flight niet meer de plek van een echte buur inneemt.
  function kandidaatVoltooid(flight) {
    const pos = posVanMetMelding(flight);
    const metWacht = pasWachttijdToe(pos, flight, pos.minutenPerHole, nu, flight.ronde_type);
    return rondeVoltooid(metWacht, flight.ronde_type);
  }
  let voorIndex = index - 1;
  while (voorIndex >= 0 && kandidaatVoltooid(flights[voorIndex])) voorIndex--;
  const voor = voorIndex >= 0 ? flights[voorIndex] : null;
  let achterIndex = index >= 0 ? index + 1 : flights.length;
  while (achterIndex < flights.length && kandidaatVoltooid(flights[achterIndex])) achterIndex++;
  const achter = index >= 0 && achterIndex < flights.length ? flights[achterIndex] : null;

  const voorPosVoorWacht = voor ? posVanMetMelding(voor) : null;
  const voorPos = voorPosVoorWacht ? pasWachttijdToe(voorPosVoorWacht, voor, voorPosVoorWacht.minutenPerHole, nu, voor.ronde_type) : null;
  const achterPosVoorWacht = achter ? posVanMetMelding(achter) : null;
  const achterPos = achterPosVoorWacht ? pasWachttijdToe(achterPosVoorWacht, achter, achterPosVoorWacht.minutenPerHole, nu, achter.ronde_type) : null;
  const zelfPos = posVan(zelf);
  const zelfRondetijd = rondetijdVoor(params, zelf.aantal_spelers, zelf.gemiddelde_hcp, zelf.ronde_type);

  // Eigen gemelde positie: gedeeld per flight (zelfde rij, dus zichtbaar voor alle spelers van die
  // flight — "laatste melding wint"), opgeslagen in gerapporteerde_hole/gerapporteerd_checkpoint.
  const heeftGekozen = zelf.gerapporteerde_hole != null && zelf.gerapporteerd_checkpoint != null;
  const actueleFractie = heeftGekozen ? (zelf.gerapporteerde_hole - 1) + checkpointFractie(zelf.gerapporteerd_checkpoint) : null;
  const deltaHoles = heeftGekozen ? actueleFractie - zelfPos.fractie : null;
  const conclusie = heeftGekozen ? conclusieVoor(deltaHoles) : null;
  const kaartKleur = conclusie ? conclusie.kleur : "var(--accent)";
  const toonTipsKnop = conclusie && (conclusie.key === "te_langzaam" || conclusie.key === "veel_te_langzaam");

  // Weergavepositie: zonder melding de pure live berekening (zelfPos, vanaf starttijd_effectief).
  // Mét melding: diezelfde melding vooruit geprojecteerd in de tijd (zie projecteerVanafMelding) —
  // zo sluit de weergave na het indrukken van een knop direct aan bij wat er net gemeld is (geen
  // sprong naar een andere hole), en loopt hij daarna vanzelf door. zelfPos zelf blijft ongewijzigd
  // en wordt verderop nog los gebruikt voor de "op schema"-vergelijking (deltaHoles/conclusie),
  // want dat vergelijkt een melding bewust tegen het ORIGINELE, ongecorrigeerde rondeschema.
  const zelfWeergavePosVoorWacht = (heeftGekozen ? projecteerVanafMelding(zelf, zelfPos.minutenPerHole, nu, zelf.ronde_type) : null) ?? zelfPos;
  const zelfWeergavePos = pasWachttijdToe(zelfWeergavePosVoorWacht, zelf, zelfPos.minutenPerHole, nu, zelf.ronde_type);

  // Ronde voltooid: vanaf hier toont elke kaart een eindstatus in plaats van door te blijven
  // rekenen aan een hole die niet bestaat (zie rondeVoltooid()). Voor de eigen kaart op basis van
  // de weergavepositie (dus inclusief een eventuele correctie), niet de ruwe schema-berekening.
  const zelfRondeVoltooid = rondeVoltooid(zelfWeergavePos, zelf.ronde_type);
  const voorRondeVoltooid = voor ? rondeVoltooid(voorPos, voor.ronde_type) : false;
  const achterRondeVoltooid = achter ? rondeVoltooid(achterPos, achter.ronde_type) : false;

  // Herbevestiging na een verouderde melding (Kay's feedback 25 oktober 2026, zie
  // HERBEVESTIG_DREMPEL_HOLES hierboven): zolang de laatste melding vers genoeg is, blijft het
  // bestaande gedrag gewoon (conclusie meteen zichtbaar). Pas als er HERBEVESTIG_DREMPEL_HOLES of
  // meer holes speeltijd (op het EIGEN tempo van de flight) verstreken zijn sinds die melding, wordt
  // de conclusie verborgen tot de speler opnieuw een knop aantikt — zie "Kaart: jouw flight"
  // hieronder. Niet relevant zonder melding (heeftGekozen=false toont toch al geen conclusie) of na
  // een voltooide ronde (geen volgende melding meer te doen).
  const minutenSindsMelding = heeftGekozen && zelf.gerapporteerd_tijdstip
    ? (nu.getTime() - new Date(zelf.gerapporteerd_tijdstip).getTime()) / 60000
    : null;
  const moetOpnieuwBevestigen = heeftGekozen && !zelfRondeVoltooid && minutenSindsMelding != null
    && minutenSindsMelding / zelfPos.minutenPerHole >= HERBEVESTIG_DREMPEL_HOLES;

  // Inhaal-signaal: je eigen melding bereikt of overschrijdt de geschatte positie van de flight
  // voor je (zie scopedocument, "Inhaal-signaal"). Alleen relevant als je al een positie hebt
  // gemeld en er een flight voor je is.
  const loopJeTegenVoorAan = heeftGekozen && voor && !voorRondeVoltooid && actueleFractie >= voorPos.fractie;

  // Spiegelbeeld van loopJeTegenVoorAan: je eigen melding ligt gelijk aan of verder TERUG dan de
  // geschatte (live berekende) positie van de flight achter je — dus volgens de klok zou die
  // flight je al ingehaald moeten hebben. Net als bij de voor-flight is dit geen directe melding
  // over je eigen positie, maar een signaal dat de live-berekende positie van de ACHTER-flight
  // vermoedelijk niet klopt (bijv. een te vroege starttijd_effectief) — vandaar de correctie-optie
  // hieronder, die de starttijd van de achter-flight aanpast, niet jouw eigen melding.
  const loopAchterTegenJouAan = heeftGekozen && achter && !achterRondeVoltooid && actueleFractie <= achterPos.fractie;

  // Doorlaat-knoppen alleen tonen als de twee flights dicht genoeg bij elkaar zitten om een
  // doorlaat realistisch te maken (zie scopedocument "Doorlaat-afstand") — op basis van de
  // weergavepositie (zelfWeergavePos), in checkpoint-stappen (checkpointOrdinaal). checkpointOrdinaal
  // blijft rekenen met het RONDE-RELATIEVE holenummer (correct en wrap-vrij: voor/zelf/achter delen
  // altijd dezelfde lus, dus hetzelfde starthole — zie de rondetype-toelichting bij RONDE_INFO).
  // doorlaatMarge heeft wél het FYSIEKE holenummer nodig (HOLE_PAR is fysiek geïndexeerd) — vandaar
  // fysiekeHole() alleen op die ene plek. Een negatieve afstand (de vooropliggende flight is zelf al
  // ingehaald) toont geen doorlaat — dat is het aparte inhaal-correctiescenario hierboven
  // (loopJeTegenVoorAan).
  const toonVoorDoorlaat = !!voor && !voorRondeVoltooid && !zelfRondeVoltooid && (() => {
    const afstand = checkpointOrdinaal(voorPos.hole, voorPos.checkpoint) - checkpointOrdinaal(zelfWeergavePos.hole, zelfWeergavePos.checkpoint);
    return afstand >= 0 && afstand <= doorlaatMarge(fysiekeHole(voor.ronde_type, voorPos.hole));
  })();
  const toonAchterDoorlaat = !!achter && !achterRondeVoltooid && !zelfRondeVoltooid && (() => {
    const afstand = checkpointOrdinaal(zelfWeergavePos.hole, zelfWeergavePos.checkpoint) - checkpointOrdinaal(achterPos.hole, achterPos.checkpoint);
    return afstand >= 0 && afstand <= doorlaatMarge(fysiekeHole(zelf.ronde_type, zelfWeergavePos.hole));
  })();

  // Draft-waarden van de steppers: volgen de weergavepositie totdat de speler er zelf aan heeft
  // gedraaid (zie nieuweTrackerLocal()). Alleen een druk op een knop (zelfPositieMelden) schrijft
  // iets naar de database.
  const zelfHoleWeergave = trackerLocal.zelfHoleDraft ?? zelfWeergavePos.hole;
  const voorCorrectieHoleWeergave = voor ? (trackerLocal.voorCorrectieHole ?? voorPos.hole) : null;
  const achterCorrectieHoleWeergave = achter ? (trackerLocal.achterCorrectieHole ?? achterPos.hole) : null;

  app.innerHTML = "";

  if (trackerLocal.fout) app.append(el("div", { class: "msg err", text: trackerLocal.fout }));

  /* ---------------------------------------------------------------------------------------
     Kaart: flight voor jou
     --------------------------------------------------------------------------------------- */
  const voorKinderen = [el("div", { class: "eyebrow", text: "Flight voor jou" })];
  if (!voor) {
    voorKinderen.push(el("div", { class: "posline", text: "Geen flight voor jou gevonden op dezelfde lus." }));
  } else if (voorRondeVoltooid) {
    voorKinderen.push(el("div", { class: "posline", text: "Deze flight heeft de ronde waarschijnlijk afgerond." }));
  } else {
    voorKinderen.push(el("div", { class: "posline" }, [
      document.createTextNode("Moet rond de "),
      el("b", { text: CHECKPOINT_LABEL[voorPos.checkpoint] }),
      document.createTextNode(` van hole ${fysiekeHole(voor.ronde_type, voorPos.hole)} zijn.`),
    ]));

    if (loopJeTegenVoorAan) {
      voorKinderen.push(el("div", { class: "correctiewarn", text: "Jouw gemelde positie is gelijk aan of verder dan die van de flight voor jou. Waar bevindt de flight voor jou zich in werkelijkheid?" }));

      const stepMin = el("button", { class: "stepbtn", "aria-label": "Een hole terug", onclick: () => { trackerLocal.voorCorrectieHole = Math.max(1, voorCorrectieHoleWeergave - 1); render(); } }, [chevronSvg("links", "#8A5A1C")]);
      const stepPlus = el("button", { class: "stepbtn", "aria-label": "Een hole verder", onclick: () => { trackerLocal.voorCorrectieHole = Math.min(rondeInfo(voor.ronde_type).holesInRonde, voorCorrectieHoleWeergave + 1); render(); } }, [chevronSvg("rechts", "#8A5A1C")]);
      voorKinderen.push(el("div", { class: "stepperrow" }, [
        stepMin,
        el("div", { class: "steplabel", text: "hole" }),
        el("div", { class: "stepvalue", text: String(fysiekeHole(voor.ronde_type, voorCorrectieHoleWeergave)) }),
        stepPlus,
      ]));

      const markerKnoppen = CHECKPOINT_VOLGORDE.map((key) => {
        const komtOvereen = voorCorrectieHoleWeergave === voorPos.hole && key === voorPos.checkpoint && trackerLocal.voorCorrectieHole === null;
        return el("button", {
          class: "markerbtn",
          style: komtOvereen ? "background:rgba(168,94,28,0.12);border:2px solid #8A5A1C;color:#8A5A1C"
                              : "background:#fff;border:1.5px solid rgba(168,94,28,0.4);color:#8A5A1C",
          onclick: () => correctieVanVoorMelden(key),
          text: CHECKPOINT_KNOPLABEL[key],
        });
      });
      voorKinderen.push(el("div", { class: "markerrow" }, markerKnoppen));

      voorKinderen.push(el("button", { class: "uitgestaptbtn", onclick: markeerVoorUitgestapt, text: "Uitgestapt" }));
    }


    const voorVergrendeld = trackerLocal.voorKnopVergrendeld;
    if (voorVergrendeld) {
      voorKinderen.push(el("button", { class: "doorlaatbtn vergrendeld" }, [
        el("div", { class: "tekst", text: "Doorgelaten? Klik hier." }),
      ]));
      voorKinderen.push(el("div", { class: "gewisseldline", text: "Wachttijd verwerkt — de flight voor je staat even stil, jij speelt gewoon door." }));
    } else if (trackerLocal.voorBevestigen) {
      voorKinderen.push(el("div", { class: "bevestigblok" }, [
        el("div", { class: "bevestigtekst", text: "Weet je het zeker?" }),
        el("div", { class: "bevestigrow" }, [
          el("button", { class: "bevestigbtn annuleren", onclick: () => { trackerLocal.voorBevestigen = false; render(); }, text: "Annuleren" }),
          el("button", { class: "bevestigbtn ja", onclick: () => doorlaatWissel(voor, "voor"), text: "Ja, doorlaten" }),
        ]),
      ]));
    } else if (toonVoorDoorlaat) {
      voorKinderen.push(el("button", {
        class: "doorlaatbtn",
        onclick: () => { trackerLocal.voorBevestigen = true; render(); },
      }, [
        el("div", { class: "tekst", text: "Doorgelaten? Klik hier." }),
      ]));
    }
  }
  const voorCard = el("div", { class: "card" }, voorKinderen);

  /* ---------------------------------------------------------------------------------------
     Kaart: jouw flight (eigen positie melden)
     --------------------------------------------------------------------------------------- */
  const stepMinZelf = el("button", { class: "stepbtn light", "aria-label": "Een hole terug", onclick: () => { trackerLocal.zelfHoleDraft = Math.max(1, zelfHoleWeergave - 1); render(); } }, [chevronSvg("links", "#fff")]);
  const stepPlusZelf = el("button", { class: "stepbtn light", "aria-label": "Een hole verder", onclick: () => { trackerLocal.zelfHoleDraft = Math.min(rondeInfo(zelf.ronde_type).holesInRonde, zelfHoleWeergave + 1); render(); } }, [chevronSvg("rechts", "#fff")]);

  // GPS-suggestie staat "open" (nog niet bevestigd/aangepast deze visit) zolang er een gevonden
  // match is, er nog niet bevestigd is, en de ronde niet al voltooid is (geen hole 19 om naar te
  // suggereren) — zie startGpsPositiebepaling()/nieuweTrackerLocal() voor gpsStatus/gpsBevestigd.
  const gpsPending = trackerLocal.gpsStatus === "beschikbaar" && !trackerLocal.gpsBevestigd && !zelfRondeVoltooid;

  const markerKnoppenZelf = CHECKPOINT_VOLGORDE.map((key) => {
    // Highlight volgt, zolang een GPS-suggestie openstaat, de checkpoint-keuze van die suggestie
    // (gpsCheckpointDraft — alleen aanpasbaar door hier zelf op te tikken, zie onclick hieronder).
    // Zonder openstaande suggestie: de weergavepositie (zelfWeergavePos — na een melding vooruit
    // geprojecteerd vanaf die melding, anders de pure live berekening), puur visueel/informatief.
    // Zodra de speler zelf aan de stepper draait (trackerLocal.zelfHoleDraft wijkt af), volgt de
    // highlight die keuze. Vóór de EERSTE melding (heeftGekozen=false) en zonder GPS-suggestie
    // wordt bewust geen enkele knop vooraf gemarkeerd — de speler moet die allereerste keuze zelf
    // expliciet maken, i.p.v. een voorgestelde positie te zien staan die lijkt op een al-gemaakte
    // keuze.
    const geselecteerd = gpsPending
      ? key === trackerLocal.gpsCheckpointDraft
      : (heeftGekozen && key === zelfWeergavePos.checkpoint && zelfHoleWeergave === zelfWeergavePos.hole);
    return el("button", {
      class: "markerbtn big",
      style: geselecteerd ? "background:#fff;border-color:#fff;color:" + kaartKleur
                           : "background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85)",
      // Met een openstaande GPS-suggestie schrijft een tik NIET meteen naar de database (anders dan
      // het bestaande gedrag) — alleen de draft-checkpoint-keuze wijzigt; de speler moet daarna nog
      // expliciet op "Bevestigen" drukken (zie zelfPositieBevestigenGps hieronder).
      onclick: gpsPending
        ? () => { trackerLocal.gpsCheckpointDraft = key; render(); }
        : () => zelfPositieMelden(key, zelfHoleWeergave),
      text: CHECKPOINT_KNOPLABEL[key],
    });
  });

  const meKinderen = [el("div", {
    class: "eyebrow",
    text: gpsPending
      ? `Je bent op de ${CHECKPOINT_LABEL[trackerLocal.gpsCheckpointDraft]} van hole ${fysiekeHole(zelf.ronde_type, zelfHoleWeergave)}`
      : (heeftGekozen ? "Waar is jouw flight nu?" : "Maak een keuze: waar is jouw flight nu?"),
  })];
  if (gpsPending) {
    // Losse regel i.p.v. aan de eyebrow-tekst vastgeplakt — op een klein scherm liep "...van hole 1
    // — bevestig of pas aan" lelijk af over twee regels middenin de zin.
    meKinderen.push(el("div", { class: "gpssubregel", text: "Bevestig of pas aan" }));
  } else if (moetOpnieuwBevestigen) {
    // Zelfde subregel-stijl hergebruikt (puur visueel identiek aan de GPS-variant hierboven) voor
    // de herbevestig-hint — zie HERBEVESTIG_DREMPEL_HOLES hierboven.
    meKinderen.push(el("div", { class: "gpssubregel", text: "Dit is nog gebaseerd op je laatste melding. Klopt dit nog? Bevestig of pas aan." }));
  }
  if (zelfRondeVoltooid) {
    // Ronde voltooid: er is geen hole 19 om naar te schuiven, dus geen stepper/marker-knoppen meer —
    // alleen een expliciete bevestiging (zelfRondeAfgerond) sluit de ronde daadwerkelijk af en
    // haalt de flight uit de live lijst voor andere spelers.
    meKinderen.push(el("div", { class: "rondeklaartekst", text: `Op basis van jullie starttijd zouden jullie alle ${rondeInfo(zelf.ronde_type).holesInRonde} holes nu gespeeld moeten hebben.` }));
    meKinderen.push(el("button", { class: "rondeafgerondbtn", onclick: zelfRondeAfgerond, text: "Ronde afgerond" }));
  } else {
    // Terwijl de GPS-fix nog loopt: een korte, vaste uitleg waarom de locatie gevraagd wordt (zie
    // het permissie-schot van de browser zelf) — exacte tekst door Kay bevestigd.
    if (trackerLocal.gpsStatus === "bezig") {
      meKinderen.push(el("div", { class: "gpsuitleg", text: "We gebruiken je locatie alleen om je ruwe positie te bepalen, jij bevestigt altijd zelf." }));
    } else if (trackerLocal.gpsStatus === "nietBeschikbaar") {
      // Vroeger hier stil niets — de speler zag geen verschil tussen "geen GPS geprobeerd" en "GPS
      // geprobeerd maar mislukt/geweigerd/geen match binnen bereik". Niet-blokkerend (de kaart werkt
      // gewoon door met de gewone stepper/marker-knoppen eronder), maar wel zichtbaar + een manier om
      // het zonder het scherm te verlaten opnieuw te proberen (bijv. na een nieuwe locatietoestemming
      // of een beter GPS-signaal verderop op de baan).
      meKinderen.push(el("div", { class: "gpsmisluktregel", text: "Locatie ophalen lukte niet — je kunt hieronder gewoon zelf je positie melden." }));
      meKinderen.push(el("button", {
        class: "gpsretrybtn",
        onclick: () => { startGpsPositiebepaling(); render(); },
        text: "Probeer locatie opnieuw",
      }));
    }
    meKinderen.push(
      el("div", { class: "stepperrow big" }, [stepMinZelf, el("div", { class: "stepvalue big", text: String(fysiekeHole(zelf.ronde_type, zelfHoleWeergave)) }), stepPlusZelf]),
      el("div", { class: "markerrow big" }, markerKnoppenZelf)
    );
    if (gpsPending) {
      // Zolang de GPS-suggestie openstaat blijft de rest van de kaart (tijdlijn, conclusie, tips)
      // bewust verborgen — ook als er van eerder vandaag al een melding staat — en verschijnt pas
      // weer ná bevestiging/aanpassing van DEZE visit, zie zelfPositieBevestigenGps.
      meKinderen.push(el("button", { class: "gpsbevestigbtn", style: "color:" + kaartKleur, onclick: zelfPositieBevestigenGps, text: "Bevestigen" }));
    } else if (moetOpnieuwBevestigen) {
      // Herbevestiging na een verouderde melding (Kay's feedback 25 oktober 2026, zie
      // HERBEVESTIG_DREMPEL_HOLES): tijdlijn/conclusie/tips bewust verborgen — die zouden een
      // conclusie trekken op basis van een melding die inmiddels HERBEVESTIG_DREMPEL_HOLES of meer
      // holes oud is, en dus best kan afwijken van de werkelijkheid. De stepper/marker-knoppen staan
      // (hierboven, buiten dit blok) al op de laatst bekende/geprojecteerde positie — de speler hoeft
      // dus, net als bij de GPS-suggestie, maar één tik te geven om een verse melding te doen (of
      // eerst de stepper te corrigeren als die positie niet meer klopt). Zodra dat gebeurt, zet
      // zelfPositieMelden gerapporteerd_tijdstip op nu, waarmee moetOpnieuwBevestigen vanzelf weer
      // false wordt bij de eerstvolgende render — geen aparte "bevestigd deze visit"-vlag nodig.
    } else {
      // Tijdlijn alleen tonen ná de eerste melding (zelfde reden als bij het niet vooraf markeren
      // van een knop: vóór die eerste keuze niets suggereren) en alleen zolang de speler de live
      // positie volgt (geen handmatige stepper-afwijking — anders zou de balk een andere hole tonen
      // dan waar de steppers net naartoe zijn gezet).
      const toonTijdlijn = heeftGekozen && trackerLocal.zelfHoleDraft === null;
      if (toonTijdlijn) {
        const restFractieNu = zelfWeergavePos.fractie - Math.floor(zelfWeergavePos.fractie);
        meKinderen.push(el("div", { class: "tijdlijn" }, [
          el("div", { class: "tijdlijnvak" }, [
            el("div", { class: "tijdlijnvoortgang", id: "zelf-tijdlijn-voortgang", style: `width:${tijdlijnPercentage(restFractieNu)}%` }),
          ]),
        ]));
      }
      if (heeftGekozen) {
        meKinderen.push(el("div", { class: "conclusieline" }, [
          document.createTextNode("Op basis van een start om "),
          el("b", { text: formatTijd(zelf.starttijd_effectief) }),
          document.createTextNode(" en een gemiddelde rondetijd van "),
          el("b", { text: formatDuur(zelfRondetijd) }),
          document.createTextNode(` voor een ${zelf.aantal_spelers}-bal over ${rondeInfo(zelf.ronde_type).holesInRonde} holes zou je nu ongeveer op de `),
          el("b", { text: `${CHECKPOINT_LABEL[zelfPos.checkpoint]} van hole ${fysiekeHole(zelf.ronde_type, zelfPos.hole)}` }),
          document.createTextNode(` moeten zijn. ${conclusie.zin}`),
        ]));
      }
      if (toonTipsKnop) {
        meKinderen.push(el("button", { class: "tipsbtn", style: "color:" + kaartKleur, onclick: () => { trackerLocal.toontTipsPopup = true; render(); }, text: "Tips om sneller te spelen" }));
      }
    }
  }
  const meCard = el("div", { class: "card me", style: "background:" + kaartKleur }, meKinderen);

  /* ---------------------------------------------------------------------------------------
     Kaart: flight achter jou
     --------------------------------------------------------------------------------------- */
  const achterKinderen = [el("div", { class: "eyebrow", text: "Flight achter jou" })];
  if (!achter) {
    achterKinderen.push(el("div", { class: "posline", text: "Geen flight achter jou gevonden op dezelfde lus." }));
  } else if (achterRondeVoltooid) {
    achterKinderen.push(el("div", { class: "posline", text: "Deze flight heeft de ronde waarschijnlijk afgerond." }));
  } else {
    achterKinderen.push(el("div", { class: "posline" }, [
      document.createTextNode("Moet rond de "),
      el("b", { text: CHECKPOINT_LABEL[achterPos.checkpoint] }),
      document.createTextNode(` van hole ${fysiekeHole(achter.ronde_type, achterPos.hole)} zijn.`),
    ]));

    if (loopAchterTegenJouAan) {
      achterKinderen.push(el("div", { class: "correctiewarn", text: "Jouw gemelde positie is gelijk aan of verder terug dan die van de flight achter jou. Waar bevindt de flight achter jou zich in werkelijkheid?" }));

      const stepMinAchter = el("button", { class: "stepbtn", "aria-label": "Een hole terug", onclick: () => { trackerLocal.achterCorrectieHole = Math.max(1, achterCorrectieHoleWeergave - 1); render(); } }, [chevronSvg("links", "#8A5A1C")]);
      const stepPlusAchter = el("button", { class: "stepbtn", "aria-label": "Een hole verder", onclick: () => { trackerLocal.achterCorrectieHole = Math.min(rondeInfo(achter.ronde_type).holesInRonde, achterCorrectieHoleWeergave + 1); render(); } }, [chevronSvg("rechts", "#8A5A1C")]);
      achterKinderen.push(el("div", { class: "stepperrow" }, [
        stepMinAchter,
        el("div", { class: "steplabel", text: "hole" }),
        el("div", { class: "stepvalue", text: String(fysiekeHole(achter.ronde_type, achterCorrectieHoleWeergave)) }),
        stepPlusAchter,
      ]));

      const markerKnoppenAchter = CHECKPOINT_VOLGORDE.map((key) => {
        const komtOvereen = achterCorrectieHoleWeergave === achterPos.hole && key === achterPos.checkpoint && trackerLocal.achterCorrectieHole === null;
        return el("button", {
          class: "markerbtn",
          style: komtOvereen ? "background:rgba(168,94,28,0.12);border:2px solid #8A5A1C;color:#8A5A1C"
                              : "background:#fff;border:1.5px solid rgba(168,94,28,0.4);color:#8A5A1C",
          onclick: () => correctieVanAchterMelden(key),
          text: CHECKPOINT_KNOPLABEL[key],
        });
      });
      achterKinderen.push(el("div", { class: "markerrow" }, markerKnoppenAchter));

      achterKinderen.push(el("button", { class: "uitgestaptbtn", onclick: markeerAchterUitgestapt, text: "Uitgestapt" }));
    }

    const achterVergrendeld = trackerLocal.achterKnopVergrendeld;
    if (achterVergrendeld) {
      achterKinderen.push(el("button", { class: "doorlaatbtn vergrendeld" }, [
        el("div", { class: "tekst", text: "Doorlaten? Klik hier." }),
      ]));
      achterKinderen.push(el("div", { class: "gewisseldline", text: "Wachttijd verwerkt — jij staat even stil, de flight achter je speelt gewoon door." }));
    } else if (trackerLocal.achterBevestigen) {
      achterKinderen.push(el("div", { class: "bevestigblok" }, [
        el("div", { class: "bevestigtekst", text: "Weet je het zeker?" }),
        el("div", { class: "bevestigrow" }, [
          el("button", { class: "bevestigbtn annuleren", onclick: () => { trackerLocal.achterBevestigen = false; render(); }, text: "Annuleren" }),
          el("button", { class: "bevestigbtn ja", onclick: () => doorlaatWissel(achter, "achter"), text: "Ja, doorlaten" }),
        ]),
      ]));
    } else if (toonAchterDoorlaat) {
      achterKinderen.push(el("button", {
        class: "doorlaatbtn",
        onclick: () => { trackerLocal.achterBevestigen = true; render(); },
      }, [
        el("div", { class: "tekst", text: "Doorlaten? Klik hier." }),
      ]));
    }
  }
  const achterCard = el("div", { class: "card" }, achterKinderen);

  // Spelersoverzicht van de EIGEN flight (v0.7.0), net onder de topbar — Kay's verzoek: dezelfde
  // lay-out als de Admin-popup (naam t/m "Gem. handicap flight"), nu ook zichtbaar voor leden zelf.
  const spelersKaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Jouw flight" }),
    ...bouwSpelersoverzicht(zelf.spelers),
  ]);

  app.append(spelersKaart, voorCard, meCard, achterCard);

  // Ready Golf-knop (v0.10.0, Kay's verzoek): altijd zichtbaar onderaan het trackerscherm, niet
  // afhankelijk van de conclusie (in tegenstelling tot de knop "Tips om sneller te spelen" in de
  // "zelf"-kaart, die alleen verschijnt bij te_langzaam/veel_te_langzaam). Opent dezelfde

  app.append(el("button", {
    class: "btn secondary",

  }));

  // Tijdlijn-ticker: elke seconde alleen de breedte van de voortgangsbalk bijwerken (zie
  // tijdlijnPercentage), zonder een volledige render() — zo blijft de balk vloeiend meelopen
  // zonder dat de rest van het scherm elke seconde opnieuw wordt opgebouwd. Wordt bij elke
  // renderTracker-aanroep opnieuw opgezet (en de vorige opgeruimd), omdat de DOM-node dan vervangen is.
  //
  // Uitzondering: zodra de balk zelf terugspringt naar het begin (hole/checkpoint is doorgeschoven
  // — bijv. Green van hole N wordt Afslag van hole N+1), mag de balk niet alleen zelf alvast
  // resetten terwijl het holecijfer en de Afslag/Fairway/Green-highlight nog op de oude waarde
  // blijven staan tot de eerstvolgende volledige ververing (tot TRACKER_VERVERS_MS, dus tot 20s
  // later — precies de "dissonantie" die Kay meldde). Daarom wordt bij zo'n overgang, in plaats
  // van alleen de breedte te zetten, meteen een volledige (stille) renderTracker() gedaan, zodat
  // balk, holecijfer en highlight in dezelfde seconde samen overgaan.
  if (tijdlijnIntervalId) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; }
  if (document.getElementById("zelf-tijdlijn-voortgang")) {
    tijdlijnIntervalId = setInterval(() => {
      const live = document.getElementById("zelf-tijdlijn-voortgang");
      if (!live) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; return; }
      const pos = projecteerVanafMelding(zelf, zelfPos.minutenPerHole, new Date(), zelf.ronde_type);
      if (!pos) return;
      if (pos.hole !== zelfWeergavePos.hole || pos.checkpoint !== zelfWeergavePos.checkpoint) {
        clearInterval(tijdlijnIntervalId);
        tijdlijnIntervalId = null;
        renderTracker(app, { stil: true });
        return;
      }
      const rest = pos.fractie - Math.floor(pos.fractie);
      live.style.width = tijdlijnPercentage(rest) + "%";
    }, 1000);
  }

  if (trackerLocal.toontTipsPopup) {
    app.append(el("div", { class: "tipsoverlay" }, [
      el("div", { class: "tipsmodal" }, [
        el("div", { class: "tipsheader" }, [
          el("div", { class: "tipstitle", text: "Tips om sneller te spelen" }),
          el("button", { class: "tipsclose", "aria-label": "Sluiten", onclick: () => { trackerLocal.toontTipsPopup = false; render(); } }, [
            (() => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width","13"); s.setAttribute("height","13"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none");
              const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d","M6 6l12 12M18 6L6 18"); p.setAttribute("stroke","#6B6558"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round"); s.appendChild(p); return s; })(),
          ]),
        ]),
        ...TIPS.map((t) => el("div", { class: "tipitem" }, [el("div", { class: "tipdot" }), el("div", { class: "tiptekst", text: t })])),
      ]),
    ]));
  }

  /* ---------------------------------------------------------------------------------------
     Schrijfacties
     --------------------------------------------------------------------------------------- */
  async function zelfPositieMelden(checkpoint, hole) {
    if (trackerLocal.bezig) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${zelf.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ gerapporteerde_hole: hole, gerapporteerd_checkpoint: checkpoint, gerapporteerd_tijdstip: new Date().toISOString() }),
      });
      trackerLocal.zelfHoleDraft = null;
      trackerLocal.fout = null;
    } catch (e) {
      trackerLocal.fout = "Melden is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }

  // Bevestiging van een openstaande GPS-suggestie (zie gpsPending in de kaartopbouw hierboven):
  // zet gpsBevestigd vóór de eigenlijke schrijfactie, zodat de suggestie-UI voor de rest van deze
  // visit verborgen blijft, en hergebruikt daarna gewoon zelfPositieMelden() — exact dezelfde
  // schrijfactie als een directe tik zonder GPS.
  async function zelfPositieBevestigenGps() {
    if (!trackerLocal.gpsCheckpointDraft) return;
    trackerLocal.gpsBevestigd = true;
    await zelfPositieMelden(trackerLocal.gpsCheckpointDraft, zelfHoleWeergave);
  }

  // Ronde afgerond (eigen flight): schrijft uitgestapt=true op de eigen rij, zodat deze flight
  // verdwijnt uit de live lijst (dezelfde kolom/filter als "uitgestapt" bij een buurflight — het
  // praktische effect is identiek: niet meer meegenomen als "voor"/"achter" bij andere spelers),
  // en logt daarna direct uit: er is voor jezelf niets meer te tracken na afloop van de ronde.
  async function zelfRondeAfgerond() {
    if (trackerLocal.bezig) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${zelf.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      logout();
    } catch (e) {
      trackerLocal.fout = "Afsluiten van de ronde is niet gelukt. Probeer het nog eens.";
      console.error(e);
      trackerLocal.bezig = false;
      render();
    }
  }

  async function correctieVanVoorMelden(checkpoint) {
    if (trackerLocal.bezig || !voor) return;
    trackerLocal.bezig = true;
    try {
      const doelFractie = (voorCorrectieHoleWeergave - 1) + checkpointFractie(checkpoint);
      const nieuweStartTijdMs = nu.getTime() - doelFractie * voorPos.minutenPerHole * 60000;
      await sb(`flights?id=eq.${voor.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ starttijd_effectief: new Date(nieuweStartTijdMs).toISOString(), gecorrigeerd: true }),
      });
      trackerLocal.voorCorrectieHole = null;
      trackerLocal.fout = null;
    } catch (e) {
      trackerLocal.fout = "Corrigeren is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }

  async function markeerVoorUitgestapt() {
    if (trackerLocal.bezig || !voor) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${voor.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      trackerLocal.voorCorrectieHole = null;

  // Spiegelbeeld van correctieVanVoorMelden/markeerVoorUitgestapt — zelfde mechaniek, maar dan voor
  // de flight ACHTER je (zie loopAchterTegenJouAan hierboven).
  async function correctieVanAchterMelden(checkpoint) {
    if (trackerLocal.bezig || !achter) return;
    trackerLocal.bezig = true;
    try {
      const doelFractie = (achterCorrectieHoleWeergave - 1) + checkpointFractie(checkpoint);
      const nieuweStartTijdMs = nu.getTime() - doelFractie * achterPos.minutenPerHole * 60000;
      await sb(`flights?id=eq.${achter.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ starttijd_effectief: new Date(nieuweStartTijdMs).toISOString(), gecorrigeerd: true }),
      });
      trackerLocal.achterCorrectieHole = null;
      trackerLocal.fout = null;
    } catch (e) {
      trackerLocal.fout = "Corrigeren is niet gelukt. Probeer het nog eens.";

  async function markeerAchterUitgestapt() {
    if (trackerLocal.bezig || !achter) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${achter.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      trackerLocal.achterCorrectieHole = null;
      trackerLocal.fout = null;
    } catch (e) {
      trackerLocal.fout = "Markeren als 'uitgestapt' is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }

  // Generieke doorlaat-wissel (Kay's model, 24 okt 2026 — zie bouwgeschiedenis): de PASSERENDE
  // flight (die doorgelaten wordt) past helemaal niets aan — ze speelt gewoon door op haar eigen
  // tempo, geen kunstmatige sprong. Alle kosten van het inhaalmoment landen bij de flight die
  // DOORLAAT: die staat stil op het checkpoint waar de doorlaat plaatsvindt, precies zo lang als de
  // passerende flight nodig heeft (met HAAR EIGEN tempo) om het volgende checkpoint te spelen (zie
  // duurTotVolgendCheckpoint) — bijvoorbeeld: een doorlaat op de Fairway betekent dat de doorlatende
  // flight twee keer zo lang op de Fairway blijft staan als normaal, omdat de wachttijd ongeveer
  // even lang is als de tijd die de doorlatende flight daar zelf al normaal zou doorbrengen.
  //
  // Opgeslagen als wacht_tot/wacht_hole/wacht_checkpoint op de doorlatende flight (zie
  // pasWachttijdToe hierboven) i.p.v. een directe starttijd_effectief-aanpassing: een simpele
  // tijdverschuiving van het hele schema zou de LIVE weergave tijdens het wachten zelf tijdelijk
  // laten terugspringen naar een eerder checkpoint (wiskundig onvermijdelijk bij één rechte lijn
  // door één ankerpunt) voordat hij weer bij de juiste positie uitkomt — met een los wacht_tot-
  // ankerpunt blijft de kaart tijdens het hele wachten gewoon het juiste checkpoint tonen.
  //
  // kant "voor": de buurflight (voor) laat zelf door — buur wacht, zelf (de passerende partij)
  // wordt niet aangepast. kant "achter": zelf laat de buurflight (achter) door — zelf wacht, buur
  // (de passerende partij) wordt niet aangepast. voorPos/achterPos/zelfWeergavePos komen uit de
  // buitenste renderTracker-scope en reflecteren dus ook een eventuele eigen melding/correctie/
  // eerdere wachttijd.
  async function doorlaatWissel(buur, kant) {
    if (trackerLocal.bezig || trackerLocal[`${kant}KnopVergrendeld`]) return;
    trackerLocal.bezig = true;
    trackerLocal[`${kant}Bevestigen`] = false; // bevestigingsblok sluiten, ongeacht de uitkomst
    const wachtendeFlight = kant === "voor" ? buur : zelf;
    const wachtendePos = kant === "voor" ? voorPos : zelfWeergavePos;
    const passerendePos = kant === "voor" ? zelfWeergavePos : achterPos;
    // minutenPerHole apart opgevraagd (i.p.v. passerendePos.minutenPerHole): projecteerVanafMelding
    // (gebruikt door zelfWeergavePos zodra er al een eigen melding is) geeft dat veld niet terug —
    // zelfPos/achterPos hebben het altijd (zie posVan), en het tempo hangt sowieso alleen af van
    // flightgrootte/hcp, nooit van de gemelde positie.
    const passerendeMinutenPerHole = kant === "voor" ? zelfPos.minutenPerHole : achterPos.minutenPerHole;
    const passerendeFlight = kant === "voor" ? zelf : buur;
    const wachtMinuten = duurTotVolgendCheckpoint(passerendePos.hole, passerendePos.checkpoint, passerendeMinutenPerHole, passerendeFlight.ronde_type);
    const wachtTot = new Date(nu.getTime() + wachtMinuten * 60000).toISOString();
    try {
      await sb(`flights?id=eq.${wachtendeFlight.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ wacht_tot: wachtTot, wacht_hole: wachtendePos.hole, wacht_checkpoint: wachtendePos.checkpoint }),
      });
      trackerLocal[`${kant}KnopVergrendeld`] = true;
      trackerLocal.fout = null;
      setTimeout(() => { trackerLocal[`${kant}KnopVergrendeld`] = false; render(); }, 4000);
    } catch (e) {
      trackerLocal.fout = "Doorlaten is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }
}
