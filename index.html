/* ============================================================================================
   App-state en navigatie
   ============================================================================================ */
const state = { scherm: "persoonscode", speler: null, flight: null, fout: null, bericht: null };

// Lokale, niet-opgeslagen UI-staat voor het trackerscherm: de draft-hole-waarde van de eigen
// stepper, voordat die als melding bevestigd wordt. Wordt bij uitloggen gereset.
// (28 oktober 2026, sparsessie: de voor/achter-zichtbaarheid, de correctiewaarschuwing en de hele
// doorlaat-functionaliteit zijn op Kay's verzoek verwijderd — zie APP_VERSIE-changelog hieronder en
// de bouwgeschiedenis. Dit object bevatte daarvoor ook voorKnopVergrendeld/achterKnopVergrendeld/
// voorBevestigen/achterBevestigen/voorCorrectieHole/achterCorrectieHole.)
function nieuweTrackerLocal() {
  return {
    zelfHoleDraft: null,       // null = volg de live berekende verwachte hole
    toontTipsPopup: false,
    bezig: false,              // voorkomt dubbele schrijfacties tijdens een lopende Supabase-call
    // GPS-ondersteunde check-in (zie startGpsPositiebepaling/renderTracker): "onbekend" = nog geen
    // poging deze visit, "bezig" = fix aangevraagd (toont de toestemmings-uitleg), "beschikbaar" =
    // suggestie klaar (gpsSuggestie/gpsCheckpointDraft gevuld, wacht op bevestigen/aanpassen),
    // "nietBeschikbaar" = weigering/time-out/geen ondersteuning (kaart werkt als voorheen).
    gpsStatus: "onbekend",
    gpsSuggestie: null,        // { hole, checkpoint, afstandMeter } van de laatst gevonden match
    gpsCheckpointDraft: null,  // checkpoint-keuze binnen de GPS-suggestie, vóór bevestiging
    gpsBevestigd: false,       // true zodra deze visit al bevestigd/aangepast is — verbergt de
                                // suggestie-UI daarna voor de rest van dit bezoek
    // Gat-signaal met de startbuur (v0.17.0, zie evalueerGatMetStartbuur/STARTBUUR_MAX_VERSCHIL_
    // MINUTEN hieronder in index.html) — wordt opnieuw bepaald bij elke eigen melding, niet
    // automatisch/periodiek herberekend.
    gatVraagTonen: false,      // true = toont de "klopt dat?"-vraag na een net gemeld gat van 1+ hole
    gatResultaat: null,        // null | "achter" | "opschema" — het antwoord-resultaat, tot de volgende melding
  };
}
let trackerLocal = nieuweTrackerLocal();

// Lokale, niet-opgeslagen UI-staat voor het beheerderscherm (tab-keuze, open/dicht van de
// ledenlijst, formuliervelden voor wachtwoord-wijzigen en de parameters-aanpassing). Wordt bij
// uitloggen gereset. Geen wachtwoord/sessie-token hierin — de admin-login zelf is bewust niet
// persistent (geen localStorage-vlag): elke keer dat de app opnieuw geopend wordt, moet het
// beheerderswachtwoord opnieuw ingevoerd worden, net als bij de leden-pincode.
function nieuwAdminLocal() {
  return {
    tab: "tracker",              // "tracker" | "baanflow" | "parameters" | "admin"
    geopendLid: null,            // id van het opengeklapte lid in de ledenlijst (Admin-tab)
    resetBezig: false,
    resetSucces: null,           // id van het lid waarvoor een pincode-reset net gelukt is
    wachtwoordOud: "", wachtwoordNieuw: "", wachtwoordHerhaal: "",
    wachtwoordFout: null, wachtwoordSucces: false, wachtwoordBezig: false,
    paramFout: null, paramBezig: false,
    analyseResultaat: null,      // gevuld na klik op "Analyseer huidige flights"
    // Flight-detailscherm (v0.6.0): id van de flight waarvan de popup openstaat (null = dicht),
    // plus de draft-hole-waarde van de stepper daarin en bezig/fout-status voor de meldactie —
    // zelfde patroon als trackerLocal.zelfHoleDraft/bezig/fout, maar los daarvan omdat dit de
    // beheerder is die een WILLEKEURIGE flight meldt, niet de ingelogde speler zijn eigen flight.
    flightDetailId: null,
    flightDetailHoleDraft: null,
    flightDetailBezig: false,
    flightDetailFout: null,
  };
}
let adminLocal = nieuwAdminLocal();

// Auto-ververs: zolang het trackerscherm open staat, wordt de weergave periodiek stil opnieuw
// berekend (en de flights opnieuw opgehaald), zodat de verwachte positie — en welke Afslag/
// Fairway/Green-knop live gemarkeerd is — vanzelf meebeweegt met de klok, zonder dat de speler
// iets hoeft aan te raken. Een druk op een knop blijft de ENIGE manier om een echte melding op
// te slaan; de automatische highlight is puur informatief. 20 seconden is een eerste inschatting
// — makkelijk aan te passen (TRACKER_VERVERS_MS hieronder) als dat te vaak/te traag blijkt.
const TRACKER_VERVERS_MS = 20000;
let trackerIntervalId = null;

// Vloeiend bijgewerkt (elke seconde) i.p.v. pas bij de volgende volledige verversing (20s): alleen
// de breedte van de voortgangsbalk-DOM-node wordt aangepast, geen volledige render() — zie
// renderTracker()'s opbouw van de "tijdlijn" onder de Afslag/Fairway/Green-knoppen.
let tijdlijnIntervalId = null;

// v0.7.1 — Kay meldde (25 okt 2026, met screenshot) dat het beheerderscherm na het openen van een
// flight "de klok stopzet": de Tracker-tab en het flight-detailscherm werden tot nu toe maar op twee
// momenten berekend — bij het wisselen van tab en bij een klik op een flight — en daarna nooit meer,
// in tegenstelling tot het ledenscherm (trackerIntervalId hierboven). Dit verklaarde zowel de
// "bevroren klok" als de afwijkende checkpoint-highlight tussen lid- en beheerderscherm voor
// dezelfde flight. Zelfde ververscadans (TRACKER_VERVERS_MS) als het ledenscherm, alleen actief
// terwijl state.scherm === "admin" én de Tracker-subtab geopend is — zie render() en
// vulAdminTrackerTab().
let adminIntervalId = null;

function render() {
  const app = document.getElementById("app");
  const sub = document.getElementById("subline");
  const topbar = document.getElementById("topbar");
  app.innerHTML = "";
  const isAuthScherm = state.scherm === "persoonscode" || state.scherm === "pincode" || state.scherm === "admin_login";
  app.className = "screen" + (state.scherm === "tracker" ? " tracker" : "") + (isAuthScherm ? " auth" : "");
  topbar.classList.toggle("compact", isAuthScherm);

  // Topbar: op het tracker- en beheerderscherm een expliciete "Uitloggen"-knop rechts (v0.7.0 —
  // vervangt het linker-pijltje van v0.2.0-v0.6.0, dat de suggestie wekte dat je "terug" kon naar
  // een ander menu terwijl het in werkelijkheid altijd uitlogde; Kay's feedback, 25 oktober 2026) —
  // en een contextregel in plaats van de generieke ondertitel.
  const bestaandeLogoutbtn = document.getElementById("logoutbtn");
  if (bestaandeLogoutbtn) bestaandeLogoutbtn.remove();
  // v0.20.5 (Kay's verzoek, screenshot): de topbar-subline (direct onder "GoyerFlow") toont nu
  // ALTIJD versie-informatie, ongeacht scherm — voorheen toonde de tracker-/beheerderstak hier nog
  // "#-bal · gestart ##:##" resp. "Beheerder", wat sinds v0.20.4 (de nieuwe kop boven het
  // spelersoverzicht) een onbedoelde dubbeling gaf op het trackerscherm. Eén plek, één soort
  // informatie, verderop in deze functie niet meer per scherm overschreven.
  // v0.20.6 (Kay's verzoek, screenshot van v0.20.5): kortere "v0.20.5"-vorm i.p.v. "GoyerFlow versie
  // 0.20.5" (het woord "GoyerFlow" staat al als titel erboven) — en de losse versiebadge rechtsboven
  // (naast "Uitloggen") is vervallen, dat was de tweede, ongewenste plek met versie-info (zie
  // aanname 3 bij v0.20.0: "zeg het als je liever één van de twee weghaalt" — dit is dat antwoord).
  sub.textContent = `v${APP_VERSIE}`;
  if (state.scherm === "tracker" && state.flight) {
    const logoutBtn = el("button", { class: "logoutbtn", id: "logoutbtn", "aria-label": "Uitloggen", onclick: logout, text: "Uitloggen" });
    topbar.appendChild(logoutBtn);
    if (!trackerIntervalId) {
      trackerIntervalId = setInterval(() => {
        if (state.scherm === "tracker") renderTracker(document.getElementById("app"), { stil: true });
      }, TRACKER_VERVERS_MS);
      // Eén keer per bezoek aan dit scherm (trackerIntervalId wordt bij het verlaten weer op null
      // gezet, zie de else-takken hieronder) een GPS-suggestie proberen — zie
      // startGpsPositiebepaling() voor waarom dit hier en niet bij het inloggen gebeurt.
      startGpsPositiebepaling();
    }
    if (adminIntervalId) { clearInterval(adminIntervalId); adminIntervalId = null; }
  } else if (state.scherm === "admin") {
    const logoutBtn = el("button", { class: "logoutbtn", id: "logoutbtn", "aria-label": "Uitloggen", onclick: adminUitloggen, text: "Uitloggen" });
    topbar.appendChild(logoutBtn);
    if (trackerIntervalId) { clearInterval(trackerIntervalId); trackerIntervalId = null; }
    if (tijdlijnIntervalId) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; }
    if (!adminIntervalId) {
      adminIntervalId = setInterval(() => {
        const inhoud = document.getElementById("admininhoud");
        if (state.scherm !== "admin" || !inhoud || adminLocal.flightDetailBezig) return;
        // v0.21.7: Baan Flow ververst zich voortaan op dezelfde cadans als de Tracker-tab — beide
        // tonen dezelfde live posities, alleen anders weergegeven.
        if (adminLocal.tab === "tracker") vulAdminTrackerTab(inhoud, { stil: true });
        else if (adminLocal.tab === "baanflow") vulAdminBaanFlowTab(inhoud, { stil: true });
      }, TRACKER_VERVERS_MS);
    }
  } else {
    if (trackerIntervalId) { clearInterval(trackerIntervalId); trackerIntervalId = null; }
    if (tijdlijnIntervalId) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; }
    if (adminIntervalId) { clearInterval(adminIntervalId); adminIntervalId = null; }
  }

  if (state.scherm === "persoonscode") return renderPersoonscode(app);
  if (state.scherm === "pincode") return renderPincode(app);
  if (state.scherm === "nieuwe_pincode") return renderNieuwePincode(app);
  if (state.scherm === "tracker") return renderTracker(app);
  if (state.scherm === "admin_login") return renderAdminLogin(app);
  if (state.scherm === "admin") return renderAdmin(app);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) node.appendChild(c);
  return node;
}

function meldingNode() {
  if (!state.fout) return null;
  return el("div", { class: "msg err", text: state.fout });
}

// Lidcode-opzoeking tolerant voor spaties (v0.7.0, Kay's feedback: "LIND6" of "LIND 6" moeten allebei
// werken bij het inloggen). Lidcode-formaat volgens Kay en de live Teecontrol-data (zie
// teecontrol-sync/index.ts, "RAPP 1"): vier letters, een spatie, dan een cijfer(s) — Teecontrol levert
// 'm altijd MET die spatie aan en zo staat hij ook in de database (vindPersoonscode doet daar alleen
// trim(), geen spatie-normalisatie). Bewust NIET de invoer blind herschrijven naar dat vaste formaat
// (zou een score van toevallig anders opgebouwde codes kunnen missen) — in plaats daarvan eerst een
// exacte match proberen op precies wat is ingetypt (na trim+uppercase, zoals altijd al gebeurde), en
// pas als die niets oplevert de twee meest waarschijnlijke spatie-varianten alsnog proberen.
async function zoekSpelerOpPersoonscode(ruw) {
  const schoon = ruw.trim().toUpperCase();
  const kandidaten = [schoon];
  const zonderSpaties = schoon.replace(/\s+/g, "");
  if (zonderSpaties !== schoon && !kandidaten.includes(zonderSpaties)) kandidaten.push(zonderSpaties);
  // Spatie invoegen op de grens tussen het letterdeel en het cijferdeel (bugfix 27 oktober 2026,
  // gevonden tijdens Kay's veldtest: "WEL 1" — een lidcode met maar DRIE letters, want gebaseerd op
  // de korte achternaam "Wel" — kon niet inloggen zonder zelf de spatie te typen). De oude aanpak
  // ging uit van een VASTE 4-letter-prefix (zonderSpaties.slice(0,4) + " " + slice(4)) en probeerde
  // die bovendien alleen bij een lengte > 4 — bij "WEL1" (lengte 4) werd deze variant dus nooit
  // geprobeerd. Nu op basis van de werkelijke grens tussen letters en cijfers, ongeacht hun aantal —
  // werkt dus voor elke combinatie (3, 4, 5+ letters).
  const grensMatch = zonderSpaties.match(/^([A-Z]+)(\d+)$/);
  if (grensMatch) {
    const metSpatieOpGrens = grensMatch[1] + " " + grensMatch[2];
    if (!kandidaten.includes(metSpatieOpGrens)) kandidaten.push(metSpatieOpGrens);
  }
  for (const kandidaat of kandidaten) {
    if (!kandidaat) continue;
    const rows = await sb(`spelers?persoonscode=eq.${encodeURIComponent(kandidaat)}&select=*,flights(*)`);
    if (rows && rows.length > 0) return { rows, gebruikteCode: kandidaat };
  }
  return { rows: [], gebruikteCode: schoon };
}

/* ---- Scherm 1: persoonscode ---- */
function renderPersoonscode(app) {
  const input = el("input", { type: "text", id: "persoonscode", inputmode: "text", placeholder: "bv. 1234", maxlength: "12" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    if (!input.value.trim()) return;
    const btn = document.getElementById("submit-persoonscode");
    btn.disabled = true;
    try {
      const { rows, gebruikteCode: code } = await zoekSpelerOpPersoonscode(input.value);
      if (!rows || rows.length === 0) {
        loggen(code, "login", false);
        state.fout = "Geen geboekte flight gevonden voor deze persoonscode. Probeer het vanaf ongeveer 15 minuten voor je starttijd nog eens, of neem contact op met de caddymaster.";
        render();
        return;
      }
      const speler = rows[0];
      const flight = speler.flights;
      if (flight.uitgestapt) {
        loggen(code, "login", false);
        state.fout = "Deze flight staat als uitgestapt geregistreerd.";
        render();
        return;
      }
      const nu = new Date();
      const venstertijd = new Date(new Date(flight.starttijd_effectief).getTime() - ZICHTBAARHEIDSVENSTER_MINUTEN * 60000);
      if (nu < venstertijd) {
        loggen(code, "login", false);
        const tijdstr = venstertijd.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
        state.fout = `Nog niet beschikbaar — deze flight wordt zichtbaar vanaf ${tijdstr} (15 minuten voor de starttijd).`;
        render();
        return;
      }
      state.speler = speler;
      state.flight = flight;
      state.fout = null;
      if (TIJDELIJK_SKIP_PINCODE_VOOR_VELDTEST) {
        // Veldtest-modus (zie bouwgeschiedenis, 24 oktober 2026): persoonscode alleen is genoeg,
        // geen pincode-scherm en geen verplichte pincode-wijziging. Wel gewoon gelogd als geslaagde
        // login, zodat login_log net als normaal bijhoudt wie er is ingelogd en wanneer.
        loggen(code, "login", true);
        state.scherm = "tracker";
        render();
        return;
      }
      // Bij de eerste keer inloggen is de pincode altijd de vaste standaardwaarde 0000 — die laten
      // invoeren valideert niets (iedereen kent 'm), dus dan gaan we direct door naar het kiezen
      // van een eigen pincode in plaats van eerst 0000 te laten intikken.
      state.scherm = speler.pincode_gewijzigd ? "pincode" : "nieuwe_pincode";
      render();
    } catch (e) {
      state.fout = "Er ging iets mis bij het ophalen van je gegevens. Probeer het zo nog eens.";
      console.error(e);
      render();
    } finally {
      btn.disabled = false;
    }
  };

  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

  app.append(
    el("div", { class: "authheader" }, [
      el("h1", { class: "authtitle", text: "Welkom bij GoyerFlow" }),
      el("p", { class: "authtagline", text: "De Speeltempo-tracker" }),
    ]),
    el("p", { class: "authdesc", text: "Deze app biedt inzicht in het speeltempo van jouw flight, eventueel met suggesties om dat te verbeteren." }),
    ...(TIJDELIJK_SKIP_PINCODE_VOOR_VELDTEST
      ? [el("p", { class: "msg warn", text: "⚠️ Veldtest-modus: de pincode-check is tijdelijk uitgeschakeld. Een lidcode is op zichzelf genoeg om in te loggen." })]
      : []),
    el("label", { text: "Log in met je Goyer Lidcode" }),
    input,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-persoonscode", onclick: submit, text: "Verder" }),
    el("button", { class: "authlink", onclick: toonAdminLogin, text: "Beheerder inlog" })
  );
  input.focus();
}

/* ---- Scherm 2: pincode ---- */
function renderPincode(app) {
  const input = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "••••" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const pin = input.value.trim();
    if (pin.length !== 4) { state.fout = "Vul een pincode van 4 cijfers in."; render(); return; }
    const btn = document.getElementById("submit-pincode");
    btn.disabled = true;
    try {
      if (pin !== state.speler.pincode) {
        loggen(state.speler.persoonscode, "login", false);
        state.fout = "Onjuiste pincode.";
        render();
        return;
      }
      loggen(state.speler.persoonscode, "login", true);
      if (!state.speler.pincode_gewijzigd) {
        state.scherm = "nieuwe_pincode";
      } else {
        state.scherm = "tracker";
      }
      state.fout = null;
      render();
    } finally {
      btn.disabled = false;
    }
  };

  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

  app.append(
    el("div", { class: "authheader" }, [
      el("h1", { class: "authtitle", text: "Welkom bij GoyerFlow" }),
      el("p", { class: "authtagline", text: "De Speeltempo-tracker" }),
    ]),
    el("p", { class: "authwelkom", text: `Welkom, ${state.speler.naam || ""}` }),
    el("label", { text: "Pincode" }),
    input,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-pincode", onclick: submit, text: "Inloggen" }),
    pincodeVergetenLink(state.speler.persoonscode)
  );
  input.focus();
}

// "Pincode vergeten"-link op het pincode-inlogscherm: opent de mailapp van het lid met een
// kant-en-klare mail aan de beheerder, exact zoals Kay de tekst heeft doorgegeven (22/23 oktober
// 2026) — lidcode wordt automatisch ingevuld, "Voornaam Achternaam" blijft een placeholder die het
// lid zelf moet aanpassen (die naam is hier niet los van de volledige naam bekend).
function pincodeVergetenLink(persoonscode) {
  const onderwerp = "GoyerFlow pincode resetten";
  const body = [
    "Beste beheerder,",
    "Ik ben mijn pincode vergeten. Kun je die resetten?",
    "Met vriendelijke groet,",
    "Voornaam Achternaam",
    persoonscode || "Lidcode",
  ].join("\n");
  const href = `mailto:kayvandelinde@gmail.com?subject=${encodeURIComponent(onderwerp)}&body=${encodeURIComponent(body)}`;
  return el("a", { class: "authlink klein", href, text: "Pincode vergeten" });
}

/* ---- Scherm 3: nieuwe pincode (verplicht bij eerste login) ---- */
function renderNieuwePincode(app) {
  const i1 = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "nieuwe pincode" });
  const i2 = el("input", { type: "password", inputmode: "numeric", maxlength: "4", placeholder: "herhaal" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const p1 = i1.value.trim(), p2 = i2.value.trim();
    if (p1.length !== 4 || !/^\d{4}$/.test(p1)) { state.fout = "Kies een pincode van 4 cijfers."; render(); return; }
    if (p1 !== p2) { state.fout = "De twee pincodes komen niet overeen."; render(); return; }
    if (p1 === "0000") { state.fout = "Kies een andere pincode dan de standaardwaarde 0000."; render(); return; }
    const btn = document.getElementById("submit-nieuwe-pincode");
    btn.disabled = true;
    try {
      await sb(`spelers?id=eq.${state.speler.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        // pincode_ooit_aangemaakt wordt NOOIT meer teruggezet (ook niet door een beheerder-reset,
        // zie resetPincode hieronder) — dat is precies wat de beheerder-ledenlijst gebruikt om te
        // bepalen wie daar ooit in heeft gestaan, zie schema.sql Fase 2b.
        body: JSON.stringify({ pincode: p1, pincode_gewijzigd: true, pincode_ooit_aangemaakt: true }),
      });
      loggen(state.speler.persoonscode, "pincode_wijziging", true);
      state.speler = { ...state.speler, pincode: p1, pincode_gewijzigd: true };
      state.scherm = "tracker";
      state.fout = null;
      render();
    } catch (e) {
      state.fout = "Pincode wijzigen is niet gelukt. Probeer het nog eens.";
      console.error(e);
      render();
    } finally {
      btn.disabled = false;
    }
  };

  app.append(
    el("h1", { text: "Kies je eigen pincode" }),
    el("p", { class: "help", text: "Verplicht bij de eerste keer inloggen. Kies 4 cijfers die je kunt onthouden." }),
    el("label", { text: "Nieuwe pincode" }),
    i1,
    el("label", { text: "Herhaal" }),
    i2,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-nieuwe-pincode", onclick: submit, text: "Pincode instellen" })
  );
  i1.focus();
}

// Herbruikbare opbouw van het spelersoverzicht van een flight, voor het LEDEN-EIGEN trackerscherm
// ("Jouw flight", renderTracker hieronder) — sinds v0.14.0 niet meer gedeeld met de beheerderskant
// (die heeft z'n eigen bouwSpelersoverzichtBeheer hieronder, incl. lidcode/typelabel, want een
// beheerder mag dat wél zien). Oorspronkelijk (v0.7.0) stond hier ook lidcode + "Club lid" naast
// elke naam ("dezelfde lay-out als in de Admin tracker pop-up") — v0.14.4: Kay vroeg dit voor de
// leden-eigen weergave weer weg te halen ("Alleen naam en handicap"), zodat een ingelogde speler
// niet de lidcodes van zijn medespelers te zien krijgt. Toont nu alleen naam + hcp.
// v0.20.0 (Kay's verzoek 28 oktober 2026): de "Gem. handicap flight"-regel is vervangen door een
// "Streeftijd"-regel ("Streeftijd {holesInRonde} holes maximaal {Xu YY}") — handicap is sinds
// v0.19.x geen factor meer in de rondetijd-berekening, dus een gemiddelde handicap tonen had geen
// functie meer. `bereik`/`holesInRonde` komen nu van de aanroeper (renderTracker), i.p.v. hier zelf
// uit de spelerslijst afgeleid (dat kon ook niet: hcp van medespelers zegt niets meer over de
// streeftijd).
function bouwSpelersoverzicht(spelers, bereik, holesInRonde) {
  const lijst = spelers || [];
  const spelerrijen = lijst.length === 0
    ? [el("p", { class: "help", text: "Geen spelers gevonden voor deze flight." })]
    : lijst.map((s) => el("div", { class: "spelerrij" }, [
        el("div", { class: "spelernaamrow" }, [
          el("span", { class: "spelernaampil", text: s.naam }),
        ]),
        el("div", { class: "spelerhcp", text: s.hcp != null ? `hcp ${s.hcp}` : "hcp —" }),
      ]));
  const kinderen = [el("div", { class: "spelerlijst" }, spelerrijen)];
  if (bereik != null) {
    // Bugfix (27 oktober 2026, Kay akkoord): twee kale document.createTextNode's naast elkaar werden
    // door de flexbox-layout (.streeftijdrow heeft justify-content:space-between) als ÉÉN enkel
    // anoniem flex-item behandeld — vandaar aan elkaar geplakte tekst zonder spatie. Elk stuk tekst
    // in een eigen <span> zet ze om in twee echte flex-items, zodat space-between weer werkt zoals
    // bedoeld (label links, getal rechts) — niet alleen een losse spatie toevoegen.
    kinderen.push(el("div", { class: "streeftijdrow" }, [
      el("span", { text: `Streeftijd ${holesInRonde} holes` }),
      el("span", { text: `maximaal ${formatUurMinWoorden(bereik.max)}` }),
    ]));
  }
  return kinderen;
}

// Teecontrol-kleurcodering (v0.14.0, zie schema.sql "Fase 2h") — 1-op-1 overgenomen uit de Marshal
// App (TC_KLEUR_MAP/tcKleur), zelfde hex-waarden. Dit zijn Teecontrol's eigen kleurcodes per speler
// (lidgroep/gasttype), geen GoyerFlow-eigen stijlkeuze — vandaar bewust identiek aan de Marshal App.
const TC_KLEUR_MAP = {
  pink:     { bg: "#fce8e8", fg: "#7a2020" },
  darkBlue: { bg: "#1e3a5f", fg: "#ffffff" },
  beige:    { bg: "#ede0c4", fg: "#5a4020" },
  green:    { bg: "#2d6a4f", fg: "#ffffff" },
  orange:   { bg: "#e07828", fg: "#ffffff" },
  yellow:   { bg: "#e8c030", fg: "#5a4400" },
  gold:     { bg: "#b8880c", fg: "#ffffff" },
};
function tcKleur(kleur) {
  return TC_KLEUR_MAP[kleur] || TC_KLEUR_MAP.pink;
}

// Spelersoverzicht voor BEHEERDER-schermen (v0.14.0, Kay's verzoek 27 oktober 2026 — zie
// bouwgeschiedenis: "anonieme 1-bal" + "waarom geen kleurcodes zoals de Marshal App"). In
// tegenstelling tot bouwSpelersoverzicht() hierboven (die blijft ONGEWIJZIGD, leden-eigen
// trackerscherm, alleen gekoppelde spelers-rijen met persoonscode) toont dit ALLE spelers van de
// flight zoals Teecontrol ze aanlevert — leden én gasten — met Teecontrol's eigen kleur + typelabel
// i.p.v. de vaste tekst "Club lid". Bron: flight.teecontrol_spelers (schema.sql "Fase 2h"), puur
// weergavedata, raakt de login-tabel `spelers` niet. Leeg/null (bv. oude seed-flights, of flights van
// vóór de migratie) valt terug op dezelfde "lus · aantal-bal"-tekst als de Tracker-tab-rijen.
// v0.14.3: de lidcode (persoonscode) viel bij de v0.14.0-herbouw onbedoeld weg uit de metaregel
// (alleen het typelabel bleef over) — Kay merkte dit op ("je hebt de lidcodes weggehaald in Beheer
// view"). Nu staan lidcode én typelabel weer allebei (gescheiden door " · "), met de lidcode zoals
// voorheen vooraan; voor gasten (geen persoonscode) blijft alleen het typelabel over, ongewijzigd.
// v0.20.0: "Gem. handicap flight" vervangen door dezelfde "Streeftijd"-regel als bouwSpelersoverzicht
// hierboven (handicap is geen factor meer in de rondetijd-berekening) — `bereik`/`holesInRonde` komen
// nu van de aanroeper (bouwFlightDetailModal).
function bouwSpelersoverzichtBeheer(teecontrolSpelers, legeTekst, bereik, holesInRonde) {
  const lijst = teecontrolSpelers || [];
  const spelerrijen = lijst.length === 0
    ? [el("p", { class: "help", text: legeTekst || "Geen spelers gevonden voor deze flight." })]
    : lijst.map((s) => {
        const kleur = tcKleur(s.kleur);
        // v0.14.3: lidcode (persoonscode) was hier stilletjes verdwenen t.o.v. de oude
        // bouwSpelersoverzicht() — Kay merkte op dat beheerders die in deze weergave misten. Nu
        // weer getoond, samen met (niet i.p.v.) het Teecontrol-typelabel: `s.persoonscode` is voor
        // leden al aanwezig in teecontrol_spelers (zie GoyerSpeler in teecontrol-sync/index.ts), en
        // is null voor gasten — dus voor gasten blijft alleen het typelabel over, precies zoals
        // voorheen.
        const metaDelen = [s.persoonscode, s.type].filter(Boolean);
        return el("div", { class: "spelerrij" }, [
          el("div", { class: "spelernaamrow" }, [
            el("span", { class: "spelernaampil", style: `background:${kleur.bg};color:${kleur.fg}`, text: s.naam }),
            metaDelen.length ? el("span", { class: "spelermeta", text: metaDelen.join(" · ") }) : null,
          ].filter(Boolean)),
          el("div", { class: "spelerhcp", text: s.hcp != null ? `hcp ${s.hcp}` : "hcp —" }),
        ]);
      });
  const kinderen = [el("div", { class: "spelerlijst" }, spelerrijen)];
  if (bereik != null) {
    kinderen.push(el("div", { class: "streeftijdrow" }, [
      el("span", { text: `Streeftijd ${holesInRonde} holes` }),
      el("span", { text: `maximaal ${formatUurMin(bereik.max)}` }),
    ]));
  }
  return kinderen;
}

// GPS-icoontje (v0.17.0, herbouwd v0.20.5): altijd zichtbaar zodra de ronde gestart is, los van de
// overige gpsPending/moetOpnieuwBevestigen-teksten hieronder. v0.20.5 (Kay's verzoek: "ik wil alleen
// GPS icoontje" i.p.v. de vroegere statuspil met tekst): nog maar twee zichtbare toestanden — "aan"
// (wit, zodra er een fix is/wordt gezocht of al bevestigd — kortom, GPS is niet mislukt) en "uit"
// (rood, gpsStatus === "nietBeschikbaar"). "onbekend" (het zeer korte moment vóór de allereerste fix,
// zie startGpsPositiebepaling()) telt mee als "aan" — in de praktijk wordt renderTracker pas
// aangeroepen nadat gpsStatus al op "bezig" is gezet. Klikbaar in de "uit"-stand om opnieuw te
// proberen — dezelfde functionaliteit als de weggehaalde "Probeer locatie opnieuw"-knop, nu zonder
// zichtbare tekst.
function bouwGpsIcoon() {
  const uit = trackerLocal.gpsStatus === "nietBeschikbaar";
  const kleur = uit ? "#D9483C" : "#fff";
  const icoon = el("div", {
    class: "gpsicoon",
    style: uit ? "cursor:pointer" : "",
    "aria-label": uit ? "GPS niet beschikbaar — tik om opnieuw te proberen" : "GPS actief",
  }, [gpsPinSvg(kleur, true)]);
  if (uit) icoon.addEventListener("click", () => { startGpsPositiebepaling(); render(); });
  return icoon;
}

/* ---- Scherm 4: tracker ---- */
async function renderTracker(app, opts = {}) {
  // "stil" = automatische achtergrondverversing (zie TRACKER_VERVERS_MS/trackerIntervalId in
  // render()): geen laad-tekst tonen, en bij een mislukte ophaalactie de bestaande weergave laten
  // staan in plaats van te vervangen door een foutmelding — de speler heeft niets aangeraakt en
  // mag niet merken dat er op de achtergrond iets misging. Bij de eerste, niet-stille load blijft
  // het oude gedrag (laad-tekst, en bij een fout de melding tonen) ongewijzigd.
  const stil = !!opts.stil;
  if (!stil) app.append(el("div", { class: "msg", text: "Bezig met laden…" }));

  let params, flights;
  try {
    [params] = await sb("parameters?select=*&limit=1");
    // spelers(*) (v0.7.0): PostgREST-embed, nodig voor het nieuwe spelersoverzicht bovenaan dit
    // scherm (zie bouwSpelersoverzicht) — haalt de spelers van ALLE flights op deze lus mee (voor/
    // zelf/achter), maar alleen die van "zelf" worden gebruikt; geen aparte losse aanvraag nodig.
    flights = await sb(`flights?lus=eq.${encodeURIComponent(state.flight.lus)}&uitgestapt=eq.false&select=*,spelers(*)&order=starttijd_effectief.asc`);
  } catch (e) {
    console.error(e);
    if (!stil) {
      app.innerHTML = "";
      app.append(el("div", { class: "msg err", text: "Kon de actuele gegevens niet ophalen. Probeer de pagina te verversen." }));
    }
    return;
  }

  const nu = new Date();
  const index = flights.findIndex((f) => f.id === state.flight.id);
  const zelf = flights[index] || state.flight;

  // Blijft PUUR schema-gebaseerd (starttijd_effectief, geen eigen melding) — nodig voor zelfPos
  // hieronder, die bewust tegen het ORIGINELE rondeschema vergelijkt (zie de "op schema"-conclusie
  // verderop), niet tegen een al gemelde/geprojecteerde positie.
  function posVan(flight) {
    const minutenPerHole = rondetijdBereikVoor(params, flight.aantal_spelers, flight.ronde_type).max / rondeInfo(flight.ronde_type).holesInRonde;
    return { ...verwachtePositie(flight.starttijd_effectief, minutenPerHole, nu, flight.ronde_type), minutenPerHole };
  }

  // (28 oktober 2026, sparsessie: dit scherm toonde hier voorheen ook de geschatte positie van de
  // flight VOOR en ACHTER de eigen flight — posVanMetMelding/kandidaatVoltooid/voor/achter/voorPos/
  // achterPos — als basis voor de inhaal-correctiewaarschuwing en de doorlaat-knoppen. Kay's
  // besluit: dat kan allemaal weg. Spelers (en Marshals) die hun eigen positie checken en melden
  // lossen het "inhalen"-probleem zelf al op; een flight die een paar keer heeft doorgelaten en
  // daardoor flink achter schema loopt, is gewoon een waarheid, geen fout om te "corrigeren" — zie
  // de bouwgeschiedenis voor de volledige afweging. Dit scherm toont voortaan alleen nog waar JOUW
  // eigen flight is, voor inzicht in je eigen speeltempo.)
  const zelfPos = posVan(zelf);
  const zelfBereik = rondetijdBereikVoor(params, zelf.aantal_spelers, zelf.ronde_type);

  // (v0.16.0, bugfix na de testronde van 28 oktober 2026): verwachtePositie() kent geen "nog niet
  // begonnen"-status — vóór starttijd_effectief levert de formule een negatieve fractie op die
  // alsnog wordt omgezet naar een ogenschijnlijk geldige hole/checkpoint (bv. "fairway van hole 1"
  // ruim vóór de start). Kay liep hier tegenaan tijdens het testen ("Mijn starttijd is 11.52. Dus ik
  // zou melding verwachten: op basis starttijd afslag hole 1. Of zelfs: U start om 11.52") — vanaf
  // hier expliciet apart behandeld, zie het gebruik hieronder.
  const nogNietGestart = nu.getTime() < new Date(zelf.starttijd_effectief).getTime();

  // Eigen gemelde positie: gedeeld per flight (zelfde rij, dus zichtbaar voor alle spelers van die
  // flight — "laatste melding wint"), opgeslagen in gerapporteerde_hole/gerapporteerd_checkpoint.
  const heeftGekozen = zelf.gerapporteerde_hole != null && zelf.gerapporteerd_checkpoint != null;
  const actueleFractie = heeftGekozen ? (zelf.gerapporteerde_hole - 1) + checkpointFractie(zelf.gerapporteerd_checkpoint) : null;
  // v0.18.0: conclusieVoor() rekent nu in minuten i.p.v. holes — hier omgezet met het eigen tempo
  // (zelfPos.minutenPerHole) van deze flight, zie de toelichting bij conclusieVoor().
  const deltaMinuten = heeftGekozen ? (actueleFractie - zelfPos.fractie) * zelfPos.minutenPerHole : null;
  const conclusie = heeftGekozen ? conclusieVoor(deltaMinuten) : null;
  const kaartKleur = conclusie ? conclusie.kleur : "var(--accent)";
  // v0.21.4: de nieuwe "voor_schema"-band (zie conclusieVoor()) mag de "Tips om sneller te
  // spelen"-knop niet laten verschijnen — alleen nog bij echt achterlopen.
  const toonTipsKnop = conclusie && (conclusie.key === "achter" || conclusie.key === "ver_achter");

  // Weergavepositie: zonder melding de pure live berekening (zelfPos, vanaf starttijd_effectief).
  // Mét melding: diezelfde melding vooruit geprojecteerd in de tijd (zie projecteerVanafMelding) —
  // zo sluit de weergave na het indrukken van een knop direct aan bij wat er net gemeld is (geen
  // sprong naar een andere hole), en loopt hij daarna vanzelf door. zelfPos zelf blijft ongewijzigd
  // en wordt verderop nog los gebruikt voor de "op schema"-vergelijking (deltaHoles/conclusie),
  // want dat vergelijkt een melding bewust tegen het ORIGINELE, ongecorrigeerde rondeschema.
  const zelfWeergavePos = (heeftGekozen ? projecteerVanafMelding(zelf, zelfPos.minutenPerHole, nu, zelf.ronde_type) : null) ?? zelfPos;

  // Ronde voltooid: vanaf hier toont de kaart een eindstatus in plaats van door te blijven rekenen
  // aan een hole die niet bestaat (zie rondeVoltooid()). Op basis van de weergavepositie (dus
  // inclusief een eventuele melding), niet de ruwe schema-berekening.
  //
  // (v0.16.0, bugfix na de testronde van 28 oktober 2026): bewust ALLEEN "voltooid" als er al een
  // eigen melding ligt (heeftGekozen). Zonder die voorwaarde viel een flight die nog nooit gemeld
  // had, maar waarvan de PURE schema-tijd al voorbij het verwachte eindtijdstip was, terug op
  // zelfPos en werd dan — onterecht — meteen als voltooid getoond: geen stepper, geen manier om de
  // werkelijke (nog niet voltooide) positie alsnog te melden, alleen de "Ronde afgerond"-
  // bevestiging. Kay liep hier tijdens het testen tegenaan ("niet afgerond. Hoe corrigeer ik dat??",
  // bevestigd met een flight die om 15:51 al "klaar" toonde maar pas om 16:05 echt klaar was) —
  // zonder eerste melding is er simpelweg geen enkel bewijs dat de ronde al voorbij is, dus nu
  // altijd eerst de normale stepper tonen totdat de speler zelf meldt.
  const zelfRondeVoltooid = heeftGekozen && rondeVoltooid(zelfWeergavePos, zelf.ronde_type);

  // Herbevestiging na een verouderde melding (Kay's feedback 25 oktober 2026, zie
  // HERBEVESTIG_DREMPEL_HOLES hierboven): zolang de laatste melding vers genoeg is, blijft het
  // bestaande gedrag gewoon (conclusie meteen zichtbaar). Pas als er HERBEVESTIG_DREMPEL_HOLES of
  // meer holes speeltijd (op het EIGEN tempo van de flight) verstreken zijn sinds die melding, wordt
  // de conclusie verborgen tot de speler opnieuw een knop aantikt — zie "Kaart: jouw flight"
  // hieronder. Niet relevant zonder melding (heeftGekozen=false toont toch al geen conclusie) of na
  // een voltooide ronde (geen volgende melding meer te doen).
  const minutenSindsMelding = heeftGekozen && zelf.gerapporteerd_tijdstip
    ? (nu.getTime() - new Date(zelf.gerapporteerd_tijdstip).getTime()) / 60000
    : null;
  const moetOpnieuwBevestigen = heeftGekozen && !zelfRondeVoltooid && minutenSindsMelding != null
    && minutenSindsMelding / zelfPos.minutenPerHole >= HERBEVESTIG_DREMPEL_HOLES;

  // Draft-waarde van de stepper: volgt de weergavepositie totdat de speler er zelf aan heeft
  // gedraaid (zie nieuweTrackerLocal()). Alleen een druk op een knop (zelfPositieMelden) schrijft
  // iets naar de database.
  const zelfHoleWeergave = trackerLocal.zelfHoleDraft ?? zelfWeergavePos.hole;

  app.innerHTML = "";

  if (trackerLocal.fout) app.append(el("div", { class: "msg err", text: trackerLocal.fout }));

  /* ---------------------------------------------------------------------------------------
     Kaart: jouw flight (eigen positie melden)
     --------------------------------------------------------------------------------------- */
  const stepMinZelf = el("button", { class: "stepbtn light", "aria-label": "Een hole terug", onclick: () => { trackerLocal.zelfHoleDraft = Math.max(1, zelfHoleWeergave - 1); render(); } }, [chevronSvg("links", "#fff")]);
  const stepPlusZelf = el("button", { class: "stepbtn light", "aria-label": "Een hole verder", onclick: () => { trackerLocal.zelfHoleDraft = Math.min(rondeInfo(zelf.ronde_type).holesInRonde, zelfHoleWeergave + 1); render(); } }, [chevronSvg("rechts", "#fff")]);

  // GPS-suggestie staat "open" (nog niet bevestigd/aangepast deze visit) zolang er een gevonden
  // match is, er nog niet bevestigd is, en de ronde niet al voltooid is (geen hole 19 om naar te
  // suggereren) — zie startGpsPositiebepaling()/nieuweTrackerLocal() voor gpsStatus/gpsBevestigd.
  const gpsPending = !nogNietGestart && trackerLocal.gpsStatus === "beschikbaar" && !trackerLocal.gpsBevestigd && !zelfRondeVoltooid;

  const markerKnoppenZelf = CHECKPOINT_VOLGORDE.map((key) => {
    // Highlight volgt, zolang een GPS-suggestie openstaat, de checkpoint-keuze van die suggestie
    // (gpsCheckpointDraft — alleen aanpasbaar door hier zelf op te tikken, zie onclick hieronder).
    // Zonder openstaande suggestie: de weergavepositie (zelfWeergavePos — na een melding vooruit
    // geprojecteerd vanaf die melding, anders de pure live berekening), puur visueel/informatief.
    // Zodra de speler zelf aan de stepper draait (trackerLocal.zelfHoleDraft wijkt af), volgt de
    // highlight die keuze. Vóór de EERSTE melding (heeftGekozen=false) en zonder GPS-suggestie
    // wordt bewust geen enkele knop vooraf gemarkeerd — de speler moet die allereerste keuze zelf
    // expliciet maken, i.p.v. een voorgestelde positie te zien staan die lijkt op een al-gemaakte
    // keuze.
    const geselecteerd = gpsPending
      ? key === trackerLocal.gpsCheckpointDraft
      : (heeftGekozen && key === zelfWeergavePos.checkpoint && zelfHoleWeergave === zelfWeergavePos.hole);
    return el("button", {
      class: "markerbtn big",
      style: geselecteerd ? "background:#fff;border-color:#fff;color:" + kaartKleur
                           : "background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85)",
      // Met een openstaande GPS-suggestie schrijft een tik NIET meteen naar de database (anders dan
      // het bestaande gedrag) — alleen de draft-checkpoint-keuze wijzigt; de speler moet daarna nog
      // expliciet op "Bevestigen" drukken (zie zelfPositieBevestigenGps hieronder).
      onclick: gpsPending
        ? () => { trackerLocal.gpsCheckpointDraft = key; render(); }
        : () => zelfPositieMelden(key, zelfHoleWeergave),
      text: CHECKPOINT_KNOPLABEL[key],
    });
  });

  // (v0.16.0) Vóór de starttijd krijgt de kaart een eigen, sterk vereenvoudigde inhoud — zie
  // nogNietGestart hierboven. Geen eyebrow-tekstkeuze/subregel-logica (gpsPending/moetOpnieuwBe-
  // vestigen) nodig in dat geval: die gaan allemaal over een lopende ronde.
  // v0.20.5 (Kay's verzoek, screenshot): titel links uitgelijnd (was gecentreerd, zie .card.me
  // .eyebrow), GPS-icoontje ernaast rechts op dezelfde regel i.p.v. een losse statuspil eronder.
  const eyebrowTekst = nogNietGestart
    ? "Nog niet gestart"
    : gpsPending
      ? `Je bent op de ${CHECKPOINT_LABEL[trackerLocal.gpsCheckpointDraft]} van hole ${fysiekeHole(zelf.ronde_type, zelfHoleWeergave)}`
      : (heeftGekozen ? "Waar is jouw flight nu?" : "Maak een keuze: waar is jouw flight nu?");
  const meKinderen = [el("div", { class: "eyebrowrow" }, [
    el("div", { class: "eyebrow", style: "margin-bottom:0;text-align:left", text: eyebrowTekst }),
    ...(!nogNietGestart ? [bouwGpsIcoon()] : []),
  ])];
  if (nogNietGestart) {
    meKinderen.push(el("div", { class: "rondeklaartekst", text: `Deze flight start om ${formatTijd(zelf.starttijd_effectief)}. Kom daarna terug om je positie te melden.` }));
  } else if (gpsPending) {
    // Losse regel i.p.v. aan de eyebrow-tekst vastgeplakt — op een klein scherm liep "...van hole 1
    // — bevestig of pas aan" lelijk af over twee regels middenin de zin.
    meKinderen.push(el("div", { class: "gpssubregel", text: "Bevestig of pas aan" }));
  } else if (moetOpnieuwBevestigen) {
    // Zelfde subregel-stijl hergebruikt (puur visueel identiek aan de GPS-variant hierboven) voor
    // de herbevestig-hint — zie HERBEVESTIG_DREMPEL_HOLES hierboven.
    meKinderen.push(el("div", { class: "gpssubregel", text: "Dit is nog gebaseerd op je laatste melding. Klopt dit nog? Bevestig of pas aan." }));
  }
  // v0.21.3 (Kay's verzoek, screenshot): de vaste hint "Dit is je laatste melding — pas aan als dit
  // niet meer klopt." (v0.16.0, hierboven tot nu toe de `heeftGekozen`-tak) is weggehaald — Kay wil
  // die tekst niet meer zien. De `moetOpnieuwBevestigen`-hint hierboven (een ANDERE, inhoudelijk
  // afwijkende hint — alleen zichtbaar als de melding verouderd is) blijft gewoon staan.
  if (nogNietGestart) {
    // Niets verder: geen stepper, geen conclusie, geen "ronde afgerond"-knop vóór de start.
  } else if (zelfRondeVoltooid) {
    // Ronde voltooid: er is geen hole 19 om naar te schuiven, dus geen stepper/marker-knoppen meer —
    // alleen een expliciete bevestiging (zelfRondeAfgerond) sluit de ronde daadwerkelijk af en
    // haalt de flight uit de live lijst voor andere spelers.
    meKinderen.push(el("div", { class: "rondeklaartekst", text: `Op basis van jullie starttijd zouden jullie alle ${rondeInfo(zelf.ronde_type).holesInRonde} holes nu gespeeld moeten hebben.` }));
    meKinderen.push(el("button", { class: "rondeafgerondbtn", onclick: zelfRondeAfgerond, text: "Ronde afgerond" }));
  } else {
    // v0.20.5: de vroegere "We gebruiken je locatie..."-uitleg (gpsStatus "bezig") en de
    // "Locatie ophalen lukte niet..."-tekst + "Probeer locatie opnieuw"-knop (gpsStatus
    // "nietBeschikbaar") zijn vervallen — die status is nu puur zichtbaar via het icoontje
    // hierboven (bouwGpsIcoon), dat in de "uit"-stand ook meteen de retry-functie overneemt.
    meKinderen.push(
      el("div", { class: "stepperrow big" }, [stepMinZelf, el("div", { class: "stepvalue big", text: String(fysiekeHole(zelf.ronde_type, zelfHoleWeergave)) }), stepPlusZelf]),
      el("div", { class: "markerrow big" }, markerKnoppenZelf)
    );
    if (gpsPending) {
      // Zolang de GPS-suggestie openstaat blijft de rest van de kaart (tijdlijn, conclusie, tips)
      // bewust verborgen — ook als er van eerder vandaag al een melding staat — en verschijnt pas
      // weer ná bevestiging/aanpassing van DEZE visit, zie zelfPositieBevestigenGps.
      meKinderen.push(el("button", { class: "gpsbevestigbtn", style: "color:" + kaartKleur, onclick: zelfPositieBevestigenGps, text: "Bevestigen" }));
    } else if (moetOpnieuwBevestigen) {
      // Herbevestiging na een verouderde melding (Kay's feedback 25 oktober 2026, zie
      // HERBEVESTIG_DREMPEL_HOLES): tijdlijn/conclusie/tips bewust verborgen — die zouden een
      // conclusie trekken op basis van een melding die inmiddels HERBEVESTIG_DREMPEL_HOLES of meer
      // holes oud is, en dus best kan afwijken van de werkelijkheid. De stepper/marker-knoppen staan
      // (hierboven, buiten dit blok) al op de laatst bekende/geprojecteerde positie — de speler hoeft
      // dus, net als bij de GPS-suggestie, maar één tik te geven om een verse melding te doen (of
      // eerst de stepper te corrigeren als die positie niet meer klopt). Zodra dat gebeurt, zet
      // zelfPositieMelden gerapporteerd_tijdstip op nu, waarmee moetOpnieuwBevestigen vanzelf weer
      // false wordt bij de eerstvolgende render — geen aparte "bevestigd deze visit"-vlag nodig.
    } else {
      // (v0.17.0) Gat-signaal met de startbuur (zie evalueerGatMetStartbuur) — staat los van de
      // tijdlijn/conclusie hieronder, een losse vraag die alleen verschijnt direct na een eigen
      // melding die een gat van 1+ hole oplevert met de flight vlak voor je. Puur een tekstmelding;
      // "Nee" wist de vraag zonder verder gevolg, "Ja" toont een vaste vervolgtekst tot de volgende
      // melding (zie gatResultaat hierboven).
      if (trackerLocal.gatVraagTonen) {
        meKinderen.push(el("div", { class: "gatvraagblok" }, [
          // v0.21.3: verkort naar "Lijkt dat er gat is met flight voor je. Klopt dat?"
          // v0.21.4 (Kay's verzoek, screenshot): opnieuw aangepast naar Kay's eigen formulering.
          el("div", { class: "gatvraagtekst", text: "Het lijkt dat er een gat is met de flight voor je. Klopt dat?" }),
          el("div", { class: "gatvraagrow" }, [
            el("button", {
              class: "gatvraagbtn nee",
              onclick: () => { trackerLocal.gatVraagTonen = false; trackerLocal.gatResultaat = null; render(); },
              text: "Nee",
            }),
            el("button", {
              class: "gatvraagbtn ja",
              onclick: () => {
                trackerLocal.gatVraagTonen = false;
                // v0.21.4: expliciet op "achter"/"ver_achter" controleren i.p.v. "alles wat niet
                // op_schema is" — anders zou de nieuwe "voor_schema"-band (vooruitlopen) hier
                // onterecht ook "Probeer aansluiting..." tonen.
                trackerLocal.gatResultaat = (conclusie && (conclusie.key === "achter" || conclusie.key === "ver_achter")) ? "achter" : "opschema";
                render();
              },
              text: "Ja",
            }),
          ]),
        ]));
      } else if (trackerLocal.gatResultaat === "achter") {
        // v0.21.4 (Kay's verzoek): deze vervolgtekst nu vetgedrukt.
        meKinderen.push(el("div", { class: "gatresultaat" }, [el("b", { text: "Probeer aansluiting te vinden met de flight voor je." })]));
      } else if (trackerLocal.gatResultaat === "opschema") {
        meKinderen.push(el("div", { class: "gatresultaat", text: "Geen zorgen, jij ligt zelf op schema." }));
      }

      // Tijdlijn alleen tonen ná de eerste melding (zelfde reden als bij het niet vooraf markeren
      // van een knop: vóór die eerste keuze niets suggereren) en alleen zolang de speler de live
      // positie volgt (geen handmatige stepper-afwijking — anders zou de balk een andere hole tonen
      // dan waar de steppers net naartoe zijn gezet).
      const toonTijdlijn = heeftGekozen && trackerLocal.zelfHoleDraft === null;
      if (toonTijdlijn) {
        const restFractieNu = zelfWeergavePos.fractie - Math.floor(zelfWeergavePos.fractie);
        meKinderen.push(el("div", { class: "tijdlijn" }, [
          el("div", { class: "tijdlijnvak" }, [
            el("div", { class: "tijdlijnvoortgang", id: "zelf-tijdlijn-voortgang", style: `width:${tijdlijnPercentage(restFractieNu)}%` }),
          ]),
        ]));
      }
      // v0.20.0 (Kay's verzoek 28 oktober 2026): "een gemiddelde rondetijd van X" vervangen door
      // "een streeftijd tussen minimaal X en maximaal Y" — past bij het nieuwe min/max-bereikmodel
      // (rondetijdBereikVoor(), zie de bouwgeschiedenis) i.p.v. één berekend gemiddelde.
      // v0.21.3 (Kay's verzoek, screenshot): verder verkort naar "...en een streeftijd van maximaal
      // Y zou je..." — het minimale getal wordt niet meer apart genoemd (het staat nog wel in de
      // param-/preview-schermen, alleen niet meer in deze lopende zin). Het resultaat ("Dus ...")
      // staat nog steeds zelf ook vet, via conclusie.resultaatTekst.
      if (heeftGekozen) {
        meKinderen.push(el("div", { class: "conclusieline" }, [
          document.createTextNode("Op basis van een start om "),
          el("b", { text: formatTijd(zelf.starttijd_effectief) }),
          document.createTextNode(" en een streeftijd van maximaal "),
          el("b", { text: formatUurMinWoorden(zelfBereik.max) }),
          document.createTextNode(" zou je nu ongeveer op de "),
          el("b", { text: `${CHECKPOINT_LABEL[zelfPos.checkpoint]} van hole ${fysiekeHole(zelf.ronde_type, zelfPos.hole)}` }),
          document.createTextNode(" moeten zijn. Dus "),
          el("b", { text: conclusie.resultaatTekst }),
          document.createTextNode("."),
        ]));
      }
      if (toonTipsKnop) {
        meKinderen.push(el("button", { class: "tipsbtn", style: "color:" + kaartKleur, onclick: () => { trackerLocal.toontTipsPopup = true; render(); }, text: "Tips om sneller te spelen" }));
      }
    }
  }
  const meCard = el("div", { class: "card me", style: "background:" + kaartKleur }, meKinderen);

  // Spelersoverzicht van de EIGEN flight (v0.7.0), net onder de topbar — Kay's verzoek: dezelfde
  // lay-out als de Admin-popup (naam t/m de Streeftijd-regel), nu ook zichtbaar voor leden zelf.
  const spelersKaart = el("div", { class: "card" }, [
    // v0.20.4 (Kay's verzoek, screenshot): de eyebrow-tekst "Jouw flight" werd door de .eyebrow-CSS
    // (text-transform:uppercase) als "JOUW FLIGHT" getoond — bleek bij navraag abusievelijk nooit
    // vervangen te zijn (een eerdere bouwgeschiedenis-notitie zei ten onrechte dat dit al gebeurd
    // was, zonder dat tegen de broncode te verifiëren). Nu dezelfde "#-bal · gestart ##:##"-tekst en
    // -stijl (.sub, zelfde class als de topbar-subline) als boven in de topbar staat.
    el("div", { class: "sub", style: "margin-bottom:8px", text: `${zelf.aantal_spelers}-bal · gestart ${formatTijd(zelf.starttijd_effectief)}` }),
    ...bouwSpelersoverzicht(zelf.spelers, zelfBereik, rondeInfo(zelf.ronde_type).holesInRonde),
  ]);

  app.append(spelersKaart, meCard);

  // Ready Golf-knop (v0.10.0, Kay's verzoek): altijd zichtbaar onderaan het trackerscherm, niet
  // afhankelijk van de conclusie (in tegenstelling tot de knop "Tips om sneller te spelen" in de
  // "zelf"-kaart, die alleen verschijnt bij te_langzaam/veel_te_langzaam). Opent dezelfde
  // tips-popup met dezelfde TIPS-lijst — geen apart tweede tips-overzicht.
  app.append(el("button", {
    class: "btn secondary",
    onclick: () => { trackerLocal.toontTipsPopup = true; render(); },
    text: "Ready Golf",
  }));

  // Tijdlijn-ticker: elke seconde alleen de breedte van de voortgangsbalk bijwerken (zie
  // tijdlijnPercentage), zonder een volledige render() — zo blijft de balk vloeiend meelopen
  // zonder dat de rest van het scherm elke seconde opnieuw wordt opgebouwd. Wordt bij elke
  // renderTracker-aanroep opnieuw opgezet (en de vorige opgeruimd), omdat de DOM-node dan vervangen is.
  //
  // Uitzondering: zodra de balk zelf terugspringt naar het begin (hole/checkpoint is doorgeschoven
  // — bijv. Green van hole N wordt Afslag van hole N+1), mag de balk niet alleen zelf alvast
  // resetten terwijl het holecijfer en de Afslag/Fairway/Green-highlight nog op de oude waarde
  // blijven staan tot de eerstvolgende volledige ververing (tot TRACKER_VERVERS_MS, dus tot 20s
  // later — precies de "dissonantie" die Kay meldde). Daarom wordt bij zo'n overgang, in plaats
  // van alleen de breedte te zetten, meteen een volledige (stille) renderTracker() gedaan, zodat
  // balk, holecijfer en highlight in dezelfde seconde samen overgaan.
  if (tijdlijnIntervalId) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; }
  if (document.getElementById("zelf-tijdlijn-voortgang")) {
    tijdlijnIntervalId = setInterval(() => {
      const live = document.getElementById("zelf-tijdlijn-voortgang");
      if (!live) { clearInterval(tijdlijnIntervalId); tijdlijnIntervalId = null; return; }
      const pos = projecteerVanafMelding(zelf, zelfPos.minutenPerHole, new Date(), zelf.ronde_type);
      if (!pos) return;
      if (pos.hole !== zelfWeergavePos.hole || pos.checkpoint !== zelfWeergavePos.checkpoint) {
        clearInterval(tijdlijnIntervalId);
        tijdlijnIntervalId = null;
        renderTracker(app, { stil: true });
        return;
      }
      const rest = pos.fractie - Math.floor(pos.fractie);
      live.style.width = tijdlijnPercentage(rest) + "%";
    }, 1000);
  }

  if (trackerLocal.toontTipsPopup) {
    app.append(el("div", { class: "tipsoverlay" }, [
      el("div", { class: "tipsmodal" }, [
        el("div", { class: "tipsheader" }, [
          el("div", { class: "tipstitle", text: "Tips om sneller te spelen" }),
          el("button", { class: "tipsclose", "aria-label": "Sluiten", onclick: () => { trackerLocal.toontTipsPopup = false; render(); } }, [
            (() => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width","13"); s.setAttribute("height","13"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none");
              const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d","M6 6l12 12M18 6L6 18"); p.setAttribute("stroke","#6B6558"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round"); s.appendChild(p); return s; })(),
          ]),
        ]),
        ...TIPS.map((t) => el("div", { class: "tipitem" }, [el("div", { class: "tipdot" }), el("div", { class: "tiptekst", text: t })])),
      ]),
    ]));
  }

  /* ---------------------------------------------------------------------------------------
     Schrijfacties
     --------------------------------------------------------------------------------------- */
  // (v0.17.0, Kay's verzoek 28 oktober 2026): signaleert — zuiver als tekstmelding, geen eigen
  // actie — wanneer een VERSE eigen melding een gat van 1 hole of meer oplevert met de flight die
  // volgens de startlijst direct voor je is gestart (binnen STARTBUUR_MAX_VERSCHIL_MINUTEN, zie
  // hierboven). Bewust alleen bij een eigen melding, niet automatisch/periodiek herberekend — zie
  // Kay's eigen formulering ("Melding gat 1+ hole alleen na eigen positiebepaling, niet
  // automatisch") en de drie antwoorden op de verduidelijkende vragen (28 okt 2026): puur een
  // tekstmelding (geen actie/bevestiging) en bij "Nee" simpelweg niets (geen vervolgactie).
  function evalueerGatMetStartbuur(nieuweHole, nieuwCheckpoint) {
    trackerLocal.gatVraagTonen = false;
    trackerLocal.gatResultaat = null;
    if (index <= 0) return; // geen flight voor je op deze lus
    const buur = flights[index - 1];
    const verschilMinuten = (new Date(zelf.starttijd_effectief).getTime() - new Date(buur.starttijd_effectief).getTime()) / 60000;
    if (verschilMinuten > STARTBUUR_MAX_VERSCHIL_MINUTEN) return; // startte te veel eerder — geen aanname over een gat
    const buurPosSchema = posVan(buur);
    const buurPos = projecteerVanafMelding(buur, buurPosSchema.minutenPerHole, nu, buur.ronde_type) ?? buurPosSchema;
    const eigenFractie = (nieuweHole - 1) + checkpointFractie(nieuwCheckpoint);
    const gat = buurPos.fractie - eigenFractie;
    if (gat >= 1.0) trackerLocal.gatVraagTonen = true;
  }

  async function zelfPositieMelden(checkpoint, hole) {
    if (trackerLocal.bezig) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${zelf.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ gerapporteerde_hole: hole, gerapporteerd_checkpoint: checkpoint, gerapporteerd_tijdstip: new Date().toISOString() }),
      });
      trackerLocal.zelfHoleDraft = null;
      trackerLocal.fout = null;
      evalueerGatMetStartbuur(hole, checkpoint);
    } catch (e) {
      trackerLocal.fout = "Melden is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      trackerLocal.bezig = false;
      render();
    }
  }

  // Bevestiging van een openstaande GPS-suggestie (zie gpsPending in de kaartopbouw hierboven):
  // zet gpsBevestigd vóór de eigenlijke schrijfactie, zodat de suggestie-UI voor de rest van deze
  // visit verborgen blijft, en hergebruikt daarna gewoon zelfPositieMelden() — exact dezelfde
  // schrijfactie als een directe tik zonder GPS.
  async function zelfPositieBevestigenGps() {
    if (!trackerLocal.gpsCheckpointDraft) return;
    trackerLocal.gpsBevestigd = true;
    await zelfPositieMelden(trackerLocal.gpsCheckpointDraft, zelfHoleWeergave);
  }

  // Ronde afgerond (eigen flight): schrijft uitgestapt=true op de eigen rij, zodat deze flight
  // verdwijnt uit de live lijst (dezelfde kolom/filter als "uitgestapt" bij een buurflight — het
  // praktische effect is identiek: niet meer meegenomen als "voor"/"achter" bij andere spelers),
  // en logt daarna direct uit: er is voor jezelf niets meer te tracken na afloop van de ronde.
  async function zelfRondeAfgerond() {
    if (trackerLocal.bezig) return;
    trackerLocal.bezig = true;
    try {
      await sb(`flights?id=eq.${zelf.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      logout();
    } catch (e) {
      trackerLocal.fout = "Afsluiten van de ronde is niet gelukt. Probeer het nog eens.";
      console.error(e);
      trackerLocal.bezig = false;
      render();
    }
  }

  // (28 oktober 2026, sparsessie: correctieVanVoorMelden/markeerVoorUitgestapt/
  // correctieVanAchterMelden/markeerAchterUitgestapt/doorlaatWissel zijn hier verwijderd samen met
  // de voor/achter-kaarten die ze aanstuurden — zie de bouwgeschiedenis.)
}

/* ---- Beheerder-inlogscherm (wachtwoord-only, geen persoonscode) ---- */
function renderAdminLogin(app) {
  const input = el("input", { type: "password", inputmode: "text", maxlength: "32", placeholder: "Wachtwoord" });
  const err = meldingNode();

  const submit = async () => {
    state.fout = null;
    const wachtwoord = input.value;
    if (!wachtwoord) return;
    const btn = document.getElementById("submit-admin-login");
    btn.disabled = true;
    try {
      const [params] = await sb("parameters?select=admin_wachtwoord&limit=1");
      const huidigWachtwoord = (params && params.admin_wachtwoord) || "GF2026";
      if (wachtwoord !== huidigWachtwoord) {
        state.fout = "Onjuist wachtwoord.";
        render();
        return;
      }
      adminLocal = nieuwAdminLocal();
      state.scherm = "admin";
      state.fout = null;
      render();
    } catch (e) {
      state.fout = "Inloggen is niet gelukt. Probeer het zo nog eens.";
      console.error(e);
      render();
    } finally {
      btn.disabled = false;
    }
  };

  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") submit(); });

  app.append(
    el("div", { class: "authheader" }, [
      el("h1", { class: "authtitle", text: "Beheerder inlog" }),
      el("p", { class: "authtagline", text: "GoyerFlow" }),
    ]),
    el("p", { class: "authdesc", text: "Alleen voor de caddymaster/beheerder van GoyerFlow." }),
    el("label", { text: "Wachtwoord" }),
    input,
    ...(err ? [err] : []),
    el("button", { class: "btn", id: "submit-admin-login", onclick: submit, text: "Inloggen" }),
    el("button", { class: "authlink", onclick: () => { state.scherm = "persoonscode"; state.fout = null; render(); }, text: "Terug naar leden-inlog" })
  );
  input.focus();
}

/* ---- Tab: Tracker — overzicht van ALLE flights (niet relatief t.o.v. voor/achter, in
   tegenstelling tot het leden-trackerscherm: als beheerder heb je al het totaaloverzicht nodig,
   geen "flight voor/achter jou"-redenering — zie Kay's toelichting bij deze fase). ---- */
// Berekent dezelfde live positie/conclusie-set als renderTracker's "zelf"-kaart, maar dan voor een
// WILLEKEURIGE flight (niet per se de ingelogde speler) — hergebruikt door zowel de Tracker-tab-
// rijen als het flight-detailscherm, zodat beide altijd exact dezelfde cijfers tonen.
function berekenFlightPositie(flight, params, nu) {
  const minutenPerHole = rondetijdBereikVoor(params, flight.aantal_spelers, flight.ronde_type).max / rondeInfo(flight.ronde_type).holesInRonde;
  const zelfPos = verwachtePositie(flight.starttijd_effectief, minutenPerHole, nu, flight.ronde_type);
  const heeftMelding = flight.gerapporteerde_hole != null && flight.gerapporteerd_checkpoint != null;
  // (28 oktober 2026: pasWachttijdToe is hier verwijderd — de doorlaat-functionaliteit (en dus het
  // wacht_tot-mechanisme) bestaat niet meer, zie de bouwgeschiedenis.)
  const weergave = (heeftMelding ? projecteerVanafMelding(flight, minutenPerHole, nu, flight.ronde_type) : null) ?? zelfPos;
  const voltooid = rondeVoltooid(weergave, flight.ronde_type);
  let conclusie = null;
  if (heeftMelding && !voltooid) {
    const actueleFractie = (flight.gerapporteerde_hole - 1) + checkpointFractie(flight.gerapporteerd_checkpoint);
    // v0.18.0: conclusieVoor() rekent in minuten — zie de toelichting bij renderTracker's gebruik.
    conclusie = conclusieVoor((actueleFractie - zelfPos.fractie) * minutenPerHole);
  }
  const gestartNog = nu.getTime() < new Date(flight.starttijd_effectief).getTime();
  return { flight, minutenPerHole, zelfPos, weergave, voltooid, heeftMelding, conclusie, gestartNog };
}

// Achternaam uit een volledige naam: laatste woord, geen tussenvoegsel-detectie (dus bij
// bijv. "Diederik Zeeuw van der Laan" komt er "Laan" uit, niet "Zeeuw van der Laan") — een
// benadering, niet gegarandeerd correct voor elke naam. Gedeeld door flightTitel() hieronder en
// vulAdminTrackerTab's spelerspillen (v0.21.5).
function achternaamVan(naam) {
  return naam.trim().split(/\s+/).pop();
}

// Titel voor het flight-detailscherm, naar het voorbeeld van de Marshal App ("Wekking + 2
// spelers"): achternaam van de eerste speler + aantal overigen. Een benadering, geen
// gegarandeerde 1-op-1 match met hoe de Marshal App dit precies bepaalt (die broncode is niet in
// deze sessie beschikbaar) — bij één speler gewoon de volledige naam.
function flightTitel(spelers) {
  if (!spelers || spelers.length === 0) return "Flight";
  if (spelers.length === 1) return spelers[0].naam;
  const achternaam = achternaamVan(spelers[0].naam);
  const rest = spelers.length - 1;
  return `${achternaam} + ${rest} speler${rest === 1 ? "" : "s"}`;
}

// Selectie + sortering van de Tracker-tab (v0.11.0, Kay's verzoek 27 oktober 2026: "zoals we het in
// de Marshal App deden"). Eerst de daadwerkelijke Marshal App-broncode gelezen (renderTracker() in
// "Marshal App.html") i.p.v. te gokken — dit is een 1-op-1 vertaling van die logica naar GoyerFlow's
// eigen datamodel:
// - ACTIEF: de flight is gestart, en nog niet meer dan ACTIEF_GRACE_MIN minuten voorbij de
//   maximale streeftijd (rondetijdBereikVoor().max) — zo blijft een net afgeronde flight nog even
//   zichtbaar, in plaats van voor altijd in de lijst te blijven staan tot iemand 'm handmatig op
//   "Uitgestapt" zet.
// - AANKOMEND: de flight start over hoogstens AANKOMEND_VENSTER_MIN minuten (en is nog niet gestart).
// Een flight die in geen van beide vensters valt (te ver in de toekomst, of allang voorbij de
// grace-periode) wordt niet getoond — dit is de kernwijziging t.o.v. voorheen, toen ELKE
// niet-uitgestapte flight altijd zichtbaar bleef, ongeacht hoe ver in de toekomst de starttijd lag.
const AANKOMEND_VENSTER_MIN = 16; // zelfde venster als de Marshal App ("binnen 16 minuten")
const ACTIEF_GRACE_MIN = 30; // zelfde grace-periode als de Marshal App

function trackerIsActief(positie, params, nu) {
  if (positie.gestartNog) return false;
  const verstrekenMin = (nu.getTime() - new Date(positie.flight.starttijd_effectief).getTime()) / 60000;
  const rondetijdMax = rondetijdBereikVoor(params, positie.flight.aantal_spelers, positie.flight.ronde_type).max;
  return verstrekenMin < rondetijdMax + ACTIEF_GRACE_MIN;
}
function trackerIsAankomend(flight, nu) {
  const resterendMin = (new Date(flight.starttijd_effectief).getTime() - nu.getTime()) / 60000;
  return resterendMin > 0 && resterendMin <= AANKOMEND_VENSTER_MIN;
}
// Sorteersleutel: voor een actieve flight het FYSIEKE holenummer waar hij nu zou moeten zijn (zodat
// een H1- en een H10-ronde gewoon door elkaar heen op fysieke positie staan); voor een aankomende
// flight het fysieke starthole (1 of 10 — rechtstreeks uit RONDE_INFO, GEEN aparte "sortHole"-functie
// nodig zoals in de Marshal App, want GoyerFlow had deze 1-vs-10-kennis al voor de holenummering).
function trackerSortHole(positie, aankomend) {
  if (aankomend) return rondeInfo(positie.flight.ronde_type).startHole;
  return fysiekeHole(positie.flight.ronde_type, positie.weergave.hole);
}
function trackerSelecteerEnSorteer(allePosities, params, nu) {
  const items = [];
  for (const positie of allePosities) {
    if (trackerIsActief(positie, params, nu)) items.push({ positie, aankomend: false });
    else if (trackerIsAankomend(positie.flight, nu)) items.push({ positie, aankomend: true });
  }
  items.sort((a, b) => {
    const ha = trackerSortHole(a.positie, a.aankomend);
    const hb = trackerSortHole(b.positie, b.aankomend);
    if (ha !== hb) return ha - hb;
    // Op dezelfde hole: aankomende flights altijd boven actieve.
    if (a.aankomend !== b.aankomend) return a.aankomend ? -1 : 1;
    const ta = new Date(a.positie.flight.starttijd_effectief).getTime();
    const tb = new Date(b.positie.flight.starttijd_effectief).getTime();
    // Beide aankomend: laatste start bovenaan, eerstvolgende onderaan (dichter bij "nu").
    if (a.aankomend && b.aankomend) return tb - ta;
    // Beide actief (niet aankomend): nog spelende flights boven al afgeronde flights op dezelfde
    // hole (Kay's feedback 27 oktober 2026, testronde op de baan — door de kale starttijd-sortering
    // kon een net afgeronde flight boven een nog spelende flight op dezelfde hole staan, verwarrend
    // bij het scannen van de lijst). Geldt alleen binnen dezelfde hole — zie trackerSortHole
    // hierboven, die een afgeronde flight al op zijn laatste (fysieke) hole vastzet.
    if (a.positie.voltooid !== b.positie.voltooid) return a.positie.voltooid ? 1 : -1;
    // Beide actief: gewone sortering op starttijd.
    return ta - tb;
  });
  return items.map((i) => i.positie);
}

async function vulAdminTrackerTab(inhoud, opts = {}) {
  // "stil" = automatische achtergrondverversing door adminIntervalId (v0.7.1, zie render()) — zelfde
  // aanpak als renderTracker's "stil"-modus: bij een mislukte ophaalactie de bestaande weergave laten
  // staan i.p.v. te vervangen door een foutmelding (de beheerder heeft niets aangeraakt). Bij de
  // eerste, niet-stille load (tabwissel of initiële render) blijft het oude gedrag — gooi de fout
  // door zodat renderAdmin()'s bestaande catch-blok de foutmelding toont — ongewijzigd.
  const stil = !!opts.stil;
  let params, flights;
  try {
    [params] = await sb("parameters?select=*&limit=1");
    // spelers(*) : PostgREST-embed via de bestaande spelers.flight_id-foreignkey — haalt per flight
    // meteen de bijbehorende spelersrijen mee in één aanvraag, i.p.v. een aparte fetch per flight.
    flights = await sb("flights?uitgestapt=eq.false&select=*,spelers(*)&order=starttijd_effectief.asc");
  } catch (e) {
    console.error(e);
    if (!stil) throw e;
    return;
  }
  inhoud.innerHTML = "";

  const nu = new Date();
  // Alle posities blijven berekend (nodig voor het flight-detailscherm hieronder, óók als die
  // specifieke flight inmiddels buiten het actief/aankomend-venster is gevallen terwijl de
  // beheerder 'm open had staan) — alleen de KAART-lijst wordt tot het venster beperkt.
  const allePosities = flights.map((flight) => berekenFlightPositie(flight, params, nu));
  const rijen = trackerSelecteerEnSorteer(allePosities, params, nu);

  const kaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Flights nu en binnenkort" }),
    rijen.length === 0
      ? el("p", { class: "help", text: "Geen actieve of binnenkort startende flights gevonden." })
      : el("div", {}, rijen.map(({ flight, weergave, voltooid, heeftMelding, conclusie, gestartNog }) => {
          const kleur = voltooid ? "#9B9585" : gestartNog ? "#B9B2A0" : (conclusie ? conclusie.kleur : "var(--blue)");
          const statustekst = voltooid ? "Ronde voltooid"
            : gestartNog ? `start om ${formatTijd(flight.starttijd_effectief)}`
            : (conclusie ? conclusie.label : "nog geen melding");
          const bolTekst = voltooid ? "✓" : gestartNog ? formatTijd(flight.starttijd_effectief) : String(fysiekeHole(flight.ronde_type, weergave.hole));
          const restFractie = weergave.fractie - Math.floor(weergave.fractie);
          const voortgangPct = voltooid ? 100 : gestartNog ? 0 : tijdlijnPercentage(restFractie);
          // v0.14.0: beheerder-weergave toont de VOLLEDIGE Teecontrol-spelerslijst (leden én gasten,
          // met Teecontrol's eigen kleur) i.p.v. alleen de gekoppelde (leden-only) spelers-rijen — zie
          // bouwSpelersoverzichtBeheer hierboven voor de toelichting/aanleiding.
          const spelersVanFlight = flight.teecontrol_spelers || [];

          const rij = el("div", { class: "flightrij" }, [
            el("div", { class: "flightbol", style: `background:${kleur}`, text: bolTekst }),
            el("div", { class: "flightinfo" }, [
              flight.toernooi_naam ? el("div", { class: "flighttoernooi", text: `🏆 ${flight.toernooi_naam}` }) : null,
              spelersVanFlight.length === 0
                ? el("div", { class: "flightnaampillen" }, [el("span", { class: "flightnaampil", text: `${flight.lus} · ${flight.aantal_spelers}-bal` })])
                : el("div", { class: "flightnaampillen" }, spelersVanFlight.map((s) => {
                    const spelerKleur = tcKleur(s.kleur);
                    // v0.21.5: alleen achternaam in dit overzicht (zie achternaamVan hierboven) —
                    // de flight-detailpopup (bouwSpelersoverzichtBeheer) toont nog steeds s.naam
                    // volledig, bewust ongewijzigd.
                    return el("span", { class: "flightnaampil", style: `background:${spelerKleur.bg};color:${spelerKleur.fg}`, text: achternaamVan(s.naam) });
                  })),
              el("div", { class: "flightmeta" }, [
                clockSvg("#9A9385"),
                // v0.14.1: was formatTijd(nu) — toonde het moment van renderen, dus op elke rij
                // hetzelfde en dus nooit onderscheidend (Kay merkte dit op: "die tijd is altijd de
                // huidige tijd"). De Marshal App's eigen renderFlightItem/renderFlightItemAankomend
                // koppelt het klokicoon altijd aan f.starttijd (🕐 ${f.starttijd}), nooit aan "nu" —
                // hier dus gecorrigeerd naar het GoyerFlow-equivalent: flight.starttijd_effectief.
                document.createTextNode(` ${formatTijd(flight.starttijd_effectief)}  ·  Hole ${fysiekeHole(flight.ronde_type, weergave.hole)}/${rondeInfo(flight.ronde_type).holesInRonde}  ·  ${statustekst}`),
              ]),
              el("div", { class: "flightprogressvak" }, [
                el("div", { class: "flightprogressvoortgang", style: `width:${voortgangPct}%;background:${kleur}` }),
              ]),
            ].filter(Boolean)),
          ]);
          rij.addEventListener("click", () => {
            adminLocal.flightDetailId = flight.id;
            adminLocal.flightDetailHoleDraft = null;
            adminLocal.flightDetailFout = null;
            render();
          });
          return rij;
        })),
  ]);
  inhoud.append(kaart);

  if (adminLocal.flightDetailId != null) {
    const geselecteerd = allePosities.find((r) => r.flight.id === adminLocal.flightDetailId);
    if (geselecteerd) inhoud.append(bouwFlightDetailModal(geselecteerd, params, nu));
  }
}

/* ---- Tab: Baan Flow — flights gevisualiseerd op de baankaart (v0.21.7). Zie de uitgebreide
   toelichting in de changelog hierboven (APP_VERSIE-blok) voor de volledige aanleiding/afweging;
   kort samengevat: hergebruikt berekenFlightPositie() 1-op-1 (zelfde twee signalen als de Tracker-
   tab), toont alleen flights die daadwerkelijk op de baan lopen, en plot ze op hun werkelijke
   fairwaypad (BAANFLOW_HOLE_PATHS/baanflowPuntVoor) i.p.v. een rechte lijn. ---- */
function baanflowIsZichtbaar(positie) {
  // Niet "aankomend" (nog niet gestart, staat nog niet op de baan) en niet "voltooid" (klaar,
  // hoort niet meer "in de baan" zoals Kay het vroeg) — bewust een andere selectie dan
  // trackerSelecteerEnSorteer's actief/aankomend-venster, dat is een lijst-overzicht met een eigen
  // "binnenkort"-nut; deze kaart toont uitsluitend wat er nu daadwerkelijk op het gras loopt.
  return !positie.gestartNog && !positie.voltooid;
}

/* ---- Volledig scherm voor de Baan Flow-kaart (v0.21.8) ---------------------------------------
   Kay's verzoek: de kaart op een iPad/laptop/desktop/extern scherm groot kunnen zetten. Gebouwd op
   de browser-eigen Fullscreen API, rechtstreeks op #baanflowCard (niet op <body>/#app) zodat de
   rest van het beheerscherm (tabbalk, topbar) verborgen blijft terwijl de kaart het hele scherm
   vult. Ondersteuning: prima op iPad/laptop/desktop/een extern scherm (Safari 16.4+ ook op iPad
   zonder prefix, Chrome/Firefox/Edge al jaren) — maar Safari op een iPhone ondersteunt de
   Fullscreen API niet voor gewone elementen (alleen <video>), dus daar wordt de knop bewust niet
   getoond (baanflowFullscreenOndersteund) i.p.v. een knop die daar stil niets zou doen.
   BELANGRIJKE KANTTEKENING: zodra de flight-detailpopup wordt geopend (klik op een marker) of de
   beheerder van tab wisselt, herbouwt render() het hele beheerscherm — dat verwijdert #baanflowCard
   uit de DOM, en een browser sluit fullscreen automatisch af zodra het fullscreen-element uit de
   DOM verdwijnt. Fullscreen stopt dus bij een marker-klik/tabwissel; dat is bewust zo gelaten (geen
   kleine aanpassing, render() zou daarvoor moeten stoppen met #admininhoud steeds opnieuw te
   bouwen) en geen probleem voor het hoofdgebruik (de kaart op een extern scherm laten staan, zonder
   erop te klikken). Wat WEL moest worden opgelost: de stille 20-seconden-achtergrondverversing
   (adminIntervalId) roept vulAdminBaanFlowTab ook aan terwijl de beheerder gewoon op de Baan
   Flow-tab blijft kijken — als die elke keer de hele kaart-node zou vervangen (zoals voorheen via
   inhoud.innerHTML=""), zou fullscreen daardoor elke 20 seconden zichzelf afsluiten, precies tijdens
   het enige scenario waarvoor deze knop bedoeld is. Zie de in-place-update hieronder in
   vulAdminBaanFlowTab: zolang #baanflowCard het huidige fullscreen-element is, wordt alleen de
   inhoud ervan vervangen, niet de node zelf. */
function baanflowFullscreenOndersteund() {
  return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
}
function baanflowFullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function baanflowIsFullscreen() {
  return baanflowFullscreenElement() === document.getElementById("baanflowCard");
}
function baanflowToggleFullscreen() {
  const kaartEl = document.getElementById("baanflowCard");
  if (!kaartEl) return;
  if (baanflowIsFullscreen()) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else if (kaartEl.requestFullscreen) {
    kaartEl.requestFullscreen();
  } else if (kaartEl.webkitRequestFullscreen) {
    kaartEl.webkitRequestFullscreen();
  }
}
function baanflowFullscreenKnopBijwerken() {
  const btn = document.getElementById("baanflowFsBtn");
  if (!btn) return;
  const actief = baanflowIsFullscreen();
  btn.innerHTML = "";
  btn.appendChild(fullscreenSvg("currentColor", actief));
  btn.appendChild(document.createTextNode(actief ? " Scherm verlaten" : " Volledig scherm"));
  btn.title = actief ? "Volledig scherm verlaten" : "Kaart op volledig scherm tonen";
}
let baanflowFsListenerAangesloten = false;
function baanflowAttachFullscreenListener() {
  if (baanflowFsListenerAangesloten) return;
  baanflowFsListenerAangesloten = true;
  document.addEventListener("fullscreenchange", baanflowFullscreenKnopBijwerken);
  document.addEventListener("webkitfullscreenchange", baanflowFullscreenKnopBijwerken);
}

    const marker = el("div", {
      class: "baanflowmarker" + (heeftMelding ? "" : " geschat"),
      style: `left:${punt.xPct}%;top:${punt.yPct}%;background:${kleur}`,
      title: `${flightTitel(flight.teecontrol_spelers || [])} · Hole ${fysiek} · ${statusTekst}`,
