  const legenda = el("div", { class: "baanflowlegenda" }, [
    el("span", { class: "baanflowlegendaitem" }, [
      el("span", { class: "baanflowlegendadot", style: "background:var(--blue)" }),
      document.createTextNode("Voor op schema"),
    ]),
    el("span", { class: "baanflowlegendaitem" }, [
      el("span", { class: "baanflowlegendadot", style: "background:var(--accent)" }),
      document.createTextNode("Op schema"),
    ]),
    el("span", { class: "baanflowlegendaitem" }, [
      el("span", { class: "baanflowlegendadot", style: "background:var(--warn)" }),
      document.createTextNode("Achter"),
    ]),
    el("span", { class: "baanflowlegendaitem" }, [
      el("span", { class: "baanflowlegendadot", style: "background:var(--err)" }),
      document.createTextNode("Ver achter"),
    ]),
    el("span", { class: "baanflowlegendaitem" }, [
      el("span", { class: "baanflowlegendaring" }),
      document.createTextNode("Bevestigde melding"),
    ]),
    el("span", { class: "baanflowlegendaitem" }, [
      el("span", { class: "baanflowlegendaring gestippeld" }),
      document.createTextNode("Tijdschatting"),
    ]),
  ]);

  const kaartInhoud = [
    el("div", { class: "baanflowheader" }, [
      el("div", { class: "eyebrow", text: "Baan Flow — flights nu op de baan" }),
      baanflowFullscreenOndersteund()
        ? el("button", {
            id: "baanflowFsBtn", class: "baanflowfsbtn", type: "button",
            onclick: baanflowToggleFullscreen,
            text: "Volledig scherm", // placeholder, baanflowFullscreenKnopBijwerken() zet de echte inhoud (icoon+label)
          })
        : null,
    ].filter(Boolean)),
    zichtbaar.length === 0
      ? el("p", { class: "help", text: "Geen flights op dit moment op de baan." })
      : null,
    el("div", { class: "baanflowkaartwrap" }, [
      el("img", { class: "baanflowkaart", src: `data:image/webp;base64,${BAANFLOW_MAP_B64}`, alt: "North Course" }),
      ...markers,
    ]),
    legenda,
  ].filter(Boolean);

  // v0.21.8: als #baanflowCard op dit moment het browser-fullscreen-element is, mag die node niet
  // vervangen worden (zie de toelichting boven baanflowFullscreenOndersteund hierboven) — dan wordt
  // alleen de inhoud ervan vernieuwd. Anders (het normale geval) gewoon de hele kaart vervangen,
  // zoals voorheen.
  const bestaandeKaart = document.getElementById("baanflowCard");
  if (bestaandeKaart && baanflowFullscreenElement() === bestaandeKaart) {
    bestaandeKaart.innerHTML = "";
    kaartInhoud.forEach((n) => bestaandeKaart.appendChild(n));
  } else {
    inhoud.innerHTML = "";
    inhoud.append(el("div", { id: "baanflowCard", class: "card" }, kaartInhoud));
  }
  baanflowFullscreenKnopBijwerken();

  if (adminLocal.flightDetailId != null) {
    const geselecteerd = allePosities.find((r) => r.flight.id === adminLocal.flightDetailId);
    if (geselecteerd) inhoud.append(bouwFlightDetailModal(geselecteerd, params, nu));
  }
}

/* ---- Flight-detailscherm (popup, v0.6.0) -------------------------------------------------------
   Bij klik op een flight in de Tracker-tab: spelersoverzicht (naam/type/hcp + gem. hcp, naar het
   voorbeeld van de Marshal App-popup) plus GoyerFlow's eigen "waar is deze flight nu"-weergave voor
   UITSLUITEND deze flight (geen voor/achter-kaarten, dat hoort bij het leden-trackerscherm, niet bij
   dit overzicht). "Verplaatsen" = de beheerder meldt de positie namens de flight, exact dezelfde
   hole-stepper + Afslag/Fairway/Green-knoppen en schrijfactie (gerapporteerde_hole/checkpoint/
   tijdstip) als een speler op zijn eigen kaart gebruikt — bevestigd met Kay, 25 oktober 2026.
   Spelersoverzicht (v0.14.0, zie bouwSpelersoverzichtBeheer hierboven): toont ALLE spelers zoals
   Teecontrol ze aanlevert — leden én gasten, met Teecontrol's eigen kleur/typelabel — niet langer
   beperkt tot alleen gekoppelde leden-rijen zoals vóór v0.14.0 ("Club lid" was toen een vaste tekst
   omdat gasten structureel ontbraken; dat gold specifiek voor déze beheerder-weergave, niet voor de
   spelers-tabel zelf, die nog steeds uitsluitend leden met een persoonscode bevat — zie schema.sql
   "Fase 2h"). -------------------------------------------------------------------------------------- */
function bouwFlightDetailModal(positie, params, nu) {
  const { flight, weergave, voltooid, heeftMelding, conclusie, minutenPerHole } = positie;
  const spelers = flight.teecontrol_spelers || [];

  const sluiten = () => { adminLocal.flightDetailId = null; adminLocal.flightDetailFout = null; render(); };

  // v0.20.0: eenmalig berekend, hergebruikt door zowel de Streeftijd-regel in het spelersoverzicht
  // hieronder als de infotekst-na-positie-melding verderop in deze functie.
  const bereikFlight = rondetijdBereikVoor(params, flight.aantal_spelers, flight.ronde_type);

  // Spelersoverzicht + "Streeftijd" (v0.14.0, tekst herschreven in v0.20.0): zie
  // bouwSpelersoverzichtBeheer hierboven — ALLE Teecontrol-spelers van deze flight, niet (meer) de
  // gedeelde bouwSpelersoverzicht() die het leden-eigen trackerscherm nog wel gebruikt.
  const spelersoverzicht = bouwSpelersoverzichtBeheer(spelers, `${flight.lus} · ${flight.aantal_spelers}-bal`, bereikFlight, rondeInfo(flight.ronde_type).holesInRonde);

  // Eigen flight-kaart (v0.6.0): zelfde opbouw/schrijflogica als renderTracker's "zelf"-kaart,
  // hier hergebruikt voor een door de beheerder gekozen flight i.p.v. de ingelogde speler. Draft-
  // waarde van de stepper staat in adminLocal.flightDetailHoleDraft (los van trackerLocal, zie
  // nieuwAdminLocal()).
  const holeWeergave = adminLocal.flightDetailHoleDraft ?? weergave.hole;
  const kaartKleur = voltooid ? "var(--accent)" : (conclusie ? conclusie.kleur : "var(--accent)");

  // Flight handmatig klaarmelden (toegevoegd 27 oktober 2026, Kay's feedback tijdens de veldtest:
  // "zie geen knop in admin om flight klaar te kiezen"). Zelfde schrijfactie als de speler-eigen
  // "Ronde afgerond"-knop (zie zelfRondeAfgerond in renderTracker: uitgestapt=true), nu ook
  // beschikbaar voor de beheerder — nodig omdat spelers na afloop lang niet altijd nog even inloggen
  // om dat zelf te bevestigen, waardoor een allang uitgespeelde flight anders voor onbepaalde tijd
  // in de lijst (en als "voor"/"achter"-buur van anderen, zie trackerSelecteerEnSorteer/de voor-
  // achterselectie hierboven) kan blijven staan.
  async function adminMarkeerAlsKlaar() {
    if (adminLocal.flightDetailBezig) return;
    adminLocal.flightDetailBezig = true;
    try {
      await sb(`flights?id=eq.${flight.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      adminLocal.flightDetailBezig = false;
      sluiten();
    } catch (e) {
      adminLocal.flightDetailFout = "Klaarmelden is niet gelukt. Probeer het nog eens.";
      console.error(e);
      adminLocal.flightDetailBezig = false;
      render();
    }
  }

  async function adminPositieMelden(checkpoint, hole) {
    if (adminLocal.flightDetailBezig) return;
    adminLocal.flightDetailBezig = true;
    try {
      await sb(`flights?id=eq.${flight.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ gerapporteerde_hole: hole, gerapporteerd_checkpoint: checkpoint, gerapporteerd_tijdstip: new Date().toISOString() }),
      });
      adminLocal.flightDetailHoleDraft = null;
      adminLocal.flightDetailFout = null;
    } catch (e) {
      adminLocal.flightDetailFout = "Verplaatsen is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      adminLocal.flightDetailBezig = false;
      render();
    }
  }

  const stepMin = el("button", { class: "stepbtn light", "aria-label": "Een hole terug", onclick: () => { adminLocal.flightDetailHoleDraft = Math.max(1, holeWeergave - 1); render(); } }, [chevronSvg("links", "#fff")]);
  const stepPlus = el("button", { class: "stepbtn light", "aria-label": "Een hole verder", onclick: () => { adminLocal.flightDetailHoleDraft = Math.min(rondeInfo(flight.ronde_type).holesInRonde, holeWeergave + 1); render(); } }, [chevronSvg("rechts", "#fff")]);
  const markerKnoppen = CHECKPOINT_VOLGORDE.map((key) => {
    const geselecteerd = heeftMelding && key === weergave.checkpoint && holeWeergave === weergave.hole;
    return el("button", {
      class: "markerbtn big",
      style: geselecteerd ? "background:#fff;border-color:#fff;color:" + kaartKleur
                           : "background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85)",
      onclick: () => adminPositieMelden(key, holeWeergave),
      text: CHECKPOINT_KNOPLABEL[key],
    });
  });

  // v0.14.2: stepper/marker-knoppen staan voortaan ALTIJD, ook als voltooid===true (Kay's "Test
  // afgerond"-observatie: een flight die het systeem als "waarschijnlijk afgerond" beoordeelt — puur
  // op basis van verstreken tijd, zonder dat er ooit een melding is geweest, zie rondeVoltooid()/
  // berekenFlightPositie hierboven — gaf de beheerder voorheen geen enkele manier om dat te
  // corrigeren als het niet klopte: de stepper/marker-rij verdween volledig zodra voltooid=true).
  // Een melding via adminPositieMelden hieronder zet gerapporteerde_hole/-checkpoint/-tijdstip, dus
  // de volgende render gaat via projecteerVanafMelding() i.p.v. de pure schema-berekening — als de
  // gemelde positie niet ook alweer voorbij de laatste hole ligt, vervalt voltooid daarmee vanzelf.
  const eigenKinderen = [el("div", {
    class: "eyebrow",
    text: voltooid
      ? "Ronde waarschijnlijk afgerond — klopt dit niet? Corrigeer de positie hieronder."
      : (heeftMelding ? "Waar is deze flight nu?" : "Maak een keuze: waar is deze flight nu?"),
  })];
  eigenKinderen.push(
    el("div", { class: "stepperrow big" }, [stepMin, el("div", { class: "stepvalue big", text: String(fysiekeHole(flight.ronde_type, holeWeergave)) }), stepPlus]),
    el("div", { class: "markerrow big" }, markerKnoppen)
  );
  if (heeftMelding && !voltooid) {
    const restFractieNu = weergave.fractie - Math.floor(weergave.fractie);
    eigenKinderen.push(el("div", { class: "tijdlijn" }, [
      el("div", { class: "tijdlijnvak" }, [
        el("div", { class: "tijdlijnvoortgang", style: `width:${tijdlijnPercentage(restFractieNu)}%` }),
      ]),
    ]));
    // v0.20.0: zelfde "minimaal/maximaal"-herschrijving als de ledenkaart (renderTracker) — zie de
    // bouwgeschiedenis. conclusie kan hier null zijn (nog geen melding/berekenbare conclusie), dus
    // het laatste stuk ("Dus ...") blijft dan weg, net als voorheen. bereikFlight is al hierboven
    // (bij het spelersoverzicht) berekend.
    // v0.21.3: zelfde verkorting als de ledenkaart ("een streeftijd van maximaal Y" i.p.v. "tussen
    // minimaal X en maximaal Y") — niet apart door Kay gevraagd voor dit scherm, maar toegepast voor
    // consistentie met de ledenkaart, net als bij elke eerdere tekstwijziging aan deze regel (zie de
    // bouwgeschiedenis bij v0.20.0/v0.20.3). Zeg het als je dit scherm liever ongemoeid had gelaten.
    eigenKinderen.push(el("div", { class: "conclusieline" }, [
      document.createTextNode("Op basis van een start om "),
      el("b", { text: formatTijd(flight.starttijd_effectief) }),
      document.createTextNode(" en een streeftijd van maximaal "),
      el("b", { text: formatUurMin(bereikFlight.max) }),
      document.createTextNode(" zou deze flight nu ongeveer op de "),
      el("b", { text: `${CHECKPOINT_LABEL[positie.zelfPos.checkpoint]} van hole ${fysiekeHole(flight.ronde_type, positie.zelfPos.hole)}` }),
      document.createTextNode(" moeten zijn."),
      ...(conclusie ? [document.createTextNode(" Dus "), el("b", { text: conclusie.resultaatTekst }), document.createTextNode(".")] : []),
    ]));
  }
  if (adminLocal.flightDetailFout) eigenKinderen.push(el("div", { class: "msg err", text: adminLocal.flightDetailFout }));
  const eigenKaart = el("div", { class: "card me detaileigenkaart", style: "background:" + kaartKleur }, eigenKinderen);

  const modal = el("div", { class: "detailoverlay" }, [
    el("div", { class: "detailmodal" }, [
      el("div", { class: "detailheader" }, [
        el("div", {}, [
          el("div", { class: "detailtitle", text: flightTitel(spelers) }),
          el("div", { class: "detailsub", text: `Start ${formatTijd(flight.starttijd_effectief)} · Hole ${fysiekeHole(flight.ronde_type, weergave.hole)} · ${rondeInfo(flight.ronde_type).holesInRonde} holes` }),
          flight.toernooi_naam ? el("div", { class: "detailtoernooi", text: `🏆 ${flight.toernooi_naam}` }) : null,
        ].filter(Boolean)),
        el("button", { class: "detailclose", "aria-label": "Sluiten", onclick: sluiten }, [
          (() => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width","13"); s.setAttribute("height","13"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none");
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d","M6 6l12 12M18 6L6 18"); p.setAttribute("stroke","#6B6558"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round"); s.appendChild(p); return s; })(),
        ]),
      ]),
      ...spelersoverzicht,
      eigenKaart,
      el("button", {
        class: "btn secondary",
        style: "margin-top:12px",
        onclick: adminMarkeerAlsKlaar,
        text: adminLocal.flightDetailBezig ? "Bezig…" : "Flight klaarmelden",
      }),
    ].filter(Boolean)),
  ]);
  return modal;
}

/* ---- Tab: Parameters — checkpointtijden bewerken + "analyse"-functie. LET OP: de analyse hier is
   bewust een lichte momentopname van de NU actieve flights, geen echte historische calibratie
   zoals de Marshal App (die rekent op basis van een meetlogboek dat GoyerFlow nog niet heeft — zie
   schema.sql Fase 2b en de toelichting in de chat). ---- */
async function vulAdminParametersTab(inhoud) {
  const [params] = await sb("parameters?select=*&limit=1");
  inhoud.innerHTML = "";

  // v0.20.0 (Kay's verzoek 28 oktober 2026): het per-hole-type-model (checkpointtijd + hcp-/
  // flightgrootte-correctie per par-type, v0.18.0-v0.19.5) bleek te indirect — Kay wilde alleen de
  // UITKOMST sturen, niet de per-hole bouwstenen. Vervangen door drie rechtstreeks ingevulde
  // bereiken (min + max, in minuten) per flight-grootte.
  // v0.21.0: een eigen set voor 9 holes toegevoegd (schema.sql "Fase 2l"), aanvankelijk NAAST een
  // losse 18-holes-set.
  // v0.21.1 (Kay's verzoek, screenshot van v0.21.0): "Alleen de drie rijen streeftijd 9 holes zijn
  // noodzakelijk. De streeftijden 18 holes zijn het dubbele daarvan." De 18-holes-invoervelden
  // (bal{n}_min/max_minuten, zonder "_9h"-suffix) zijn uit de UI gehaald — de 9-holes-velden zijn nu
  // de ENIGE bron. Zie de herschreven rondetijdBereikVoor() hieronder: 18 holes = 9-holes-waarde × 2.
  const iBal2Min9 = el("input", { class: "paraminput", type: "number", step: "1", value: params.bal2_min_minuten_9h });
  const iBal2Max9 = el("input", { class: "paraminput", type: "number", step: "1", value: params.bal2_max_minuten_9h });
  const iBal3Min9 = el("input", { class: "paraminput", type: "number", step: "1", value: params.bal3_min_minuten_9h });
  const iBal3Max9 = el("input", { class: "paraminput", type: "number", step: "1", value: params.bal3_max_minuten_9h });
  const iBal4Min9 = el("input", { class: "paraminput", type: "number", step: "1", value: params.bal4_min_minuten_9h });
  const iBal4Max9 = el("input", { class: "paraminput", type: "number", step: "1", value: params.bal4_max_minuten_9h });

  // v0.21.6: per-hole streeftijd voor 4-bal — 18 losse velden (bal4_h1_minuten..bal4_h18_minuten,
  // migratie los aangeleverd). Startwaarden hieronder zijn Kay's eigen berekening (vaste basistijd
  // + rest naar gevolgde holelengte uit de North Course-KML) — alleen gebruikt als de kolom in de
  // database nog leeg is (vóór de migratie/eerste PATCH), daarna leidend is wat er in `parameters`
  // staat.
  const BAL4_PER_HOLE_DEFAULT = [12, 10, 14, 17, 8, 14, 17, 15, 13, 13, 10, 12, 17, 10, 14, 14, 16, 14];
  const iBal4Holes = BAL4_PER_HOLE_DEFAULT.map((def, i) =>
    el("input", { class: "paraminput", type: "number", step: "1", value: params[`bal4_h${i + 1}_minuten`] ?? def }));

  const alleVelden = [iBal2Min9, iBal2Max9, iBal3Min9, iBal3Max9, iBal4Min9, iBal4Max9, ...iBal4Holes];

  // v0.19.4 (Kay's verzoek): de "Opslaan"-knop grijs/niet-klikbaar zodra de waarden overeenkomen met
  // wat net geladen/opgeslagen is, en weer actief zodra een van de parametervelden wijzigt. Omdat
  // vulAdminParametersTab() sowieso opnieuw draait (via render()) ná elke opslagpoging — mét een
  // verse fetch van de huidige database-waarden — hoeft dit geen apart "is dit gewijzigd t.o.v. wat
  // is opgeslagen"-vergelijking te zijn: elke keer dat deze functie opnieuw draait staan de velden
  // per definitie gelijk aan wat net geladen is, dus de knop mag dan simpelweg disabled starten.
  const markeerGewijzigd = () => { opslaanBtn.disabled = false; };
  alleVelden.forEach((input) => input.addEventListener("input", markeerGewijzigd));

  // v0.21.6: 4 kolommen (H1-H9 label+veld, H10-H18 label+veld) — grid-auto-flow vult gewoon 4
  // cellen per rij, dus dit levert precies de kolomindeling op die Kay aangaf.
  const bal4HoleGrid = el("div", { class: "holeparamgrid" },
    Array.from({ length: 9 }, (_, i) => [
      el("div", { class: "holelabel", text: `H${i + 1}` }), iBal4Holes[i],
      el("div", { class: "holelabel", text: `H${i + 10}` }), iBal4Holes[i + 9],
    ]).flat());

  // v0.19.0 (Kay's verzoek): korte uitleg-popup bij de parameterkeuzes — zelfde modal-opzet als de
  // tips-popup (.tipsoverlay/.tipsmodal), bewust NIET via render() geopend/gesloten (dat zou de
  // Parameters-tab opnieuw ophalen en eventuele niet-opgeslagen invoer in de velden hierboven
  // verliezen) — puur een los DOM-element toegevoegd/verwijderd.
  const toonVerantwoording = () => {
    const sluiten = () => overlay.remove();
    const overlay = el("div", { class: "tipsoverlay" }, [
      el("div", { class: "tipsmodal" }, [
        el("div", { class: "tipsheader" }, [
          el("div", { class: "tipstitle", text: "Verantwoording parameters" }),
          el("button", { class: "tipsclose", "aria-label": "Sluiten", onclick: sluiten }, [
            (() => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width","13"); s.setAttribute("height","13"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none");
              const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d","M6 6l12 12M18 6L6 18"); p.setAttribute("stroke","#6B6558"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round"); s.appendChild(p); return s; })(),
          ]),
        ]),
        el("div", { class: "verantwoordingtekst" }, VERANTWOORDING_PARAMETERS.map((tekst) => el("p", { text: tekst }))),
      ]),
    ]);
    document.body.appendChild(overlay);
  };

  const opslaan = async () => {
    adminLocal.paramFout = null;
    // v0.21.1: alleen nog de zes 9-holes-velden — zie schema.sql "Fase 2l". De oude 18-holes-
    // kolommen (bal{n}_min/max_minuten, zonder "_9h") worden niet meer vanuit de UI geschreven;
    // 18 holes is nu overal het dubbele van deze zes waarden (rondetijdBereikVoor()).
    const nieuw = {
      bal2_min_minuten_9h: parseFloat(iBal2Min9.value),
      bal2_max_minuten_9h: parseFloat(iBal2Max9.value),
      bal3_min_minuten_9h: parseFloat(iBal3Min9.value),
      bal3_max_minuten_9h: parseFloat(iBal3Max9.value),
      bal4_min_minuten_9h: parseFloat(iBal4Min9.value),
      bal4_max_minuten_9h: parseFloat(iBal4Max9.value),
      // v0.21.6: de 18 per-hole 4-bal-velden horen in dezelfde PATCH mee, anders raakt de knop-
      // disabled-status (die over alle alleVelden gaat) uit de pas met wat er echt is opgeslagen.
      ...Object.fromEntries(iBal4Holes.map((input, i) => [`bal4_h${i + 1}_minuten`, parseFloat(input.value)])),
    };
    if (Object.values(nieuw).some((v) => Number.isNaN(v) || v < 0)) {
      adminLocal.paramFout = "Vul voor elk veld een geldig, niet-negatief getal in.";
      render();
      return;
    }
    // v0.20.0: nieuwe check zonder directe tegenhanger in het oude model — maximaal mag niet KLEINER
    // zijn dan minimaal, anders is het geen geldig bereik.
    // v0.21.1: nu alleen nog de drie 9-holes-paren (18 holes is afgeleid, dus automatisch ook
    // geldig zodra 9 holes het is).
    // v0.21.2 (Kay's verzoek, screenshot): max === min moet wél kunnen — een vaste streeftijd (geen
    // bandbreedte) is een legitieme keuze, bv. min 120/max 120. Was `<=` (sloot gelijke waarden ten
    // onrechte uit), nu `<`.
    if (nieuw.bal2_max_minuten_9h < nieuw.bal2_min_minuten_9h || nieuw.bal3_max_minuten_9h < nieuw.bal3_min_minuten_9h || nieuw.bal4_max_minuten_9h < nieuw.bal4_min_minuten_9h) {
      adminLocal.paramFout = "Maximaal mag niet kleiner zijn dan minimaal, voor elke flight-grootte.";
      render();
      return;
    }
    adminLocal.paramBezig = true;
    render();
    try {
      await sb(`parameters?id=eq.${params.id}`, {
        method: "PATCH", prefer: "return=minimal",
        body: JSON.stringify({ ...nieuw, updated_at: new Date().toISOString() }),
      });
      // v0.19.4: expliciet disablen i.p.v. uitsluitend op de her-render (via render(), die de hele
      // tab opnieuw opbouwt) vertrouwen — zo klopt de knopstatus ook los van render()-timing. Bij een
      // fout blijft de knop bewust actief, zodat Kay kan herproberen zonder opnieuw te hoeven typen.
      opslaanBtn.disabled = true;
    } catch (e) {
      adminLocal.paramFout = "Opslaan is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      adminLocal.paramBezig = false;
      render();
    }
  };

  const fout = adminLocal.paramFout ? el("div", { class: "paramfout", text: adminLocal.paramFout }) : null;

  // v0.19.4 (Kay's verzoek): geen "Opgeslagen."-tekst meer — de knop zelf (grijs/niet-klikbaar na
  // opslaan, zie markeerGewijzigd hierboven) laat nu zien dat de huidige waarden al opgeslagen zijn.
  const opslaanBtn = el("button", { class: "btn", onclick: opslaan, text: adminLocal.paramBezig ? "Bezig…" : "Opslaan" });
  opslaanBtn.disabled = true;

  // v0.21.0 (Kay's verzoek, "STREEFTIJDEN 9 HOLES en vervolgens wat er nu al staat"): een los
  // bouwblokje voor een rij-paar (eyebrow + drie paramrows).
  // v0.21.1: de 18-holes-sectie die hier ook mee gebouwd werd, is vervallen (zie opmerking bij
  // rondetijdBereikVoor()) — deze helper bouwt nu alleen nog de ene 9-holes-sectie, maar blijft
  // een functie (i.p.v. inline) voor als er later weer een tweede sectie bij moet.
  const maakStreeftijdenSectie = (titel, min2, max2, min3, max3, min4, max4, eersteSectie) => [
    el("div", { class: "eyebrow", style: eersteSectie ? "" : "margin-top:14px", text: titel }),
    el("div", { class: "paramrow" }, [
      el("div", { class: "paramlabel", text: "2-bal (minuten)" }),
      el("div", { class: "paramminmax" }, [
        el("div", { class: "paramminmaxgroup" }, [el("span", { class: "paramminmaxlabel", text: "min" }), min2]),
        el("div", { class: "paramminmaxgroup" }, [el("span", { class: "paramminmaxlabel", text: "max" }), max2]),
      ]),
    ]),
    el("div", { class: "paramrow" }, [
      el("div", { class: "paramlabel", text: "3-bal (minuten)" }),
      el("div", { class: "paramminmax" }, [
        el("div", { class: "paramminmaxgroup" }, [el("span", { class: "paramminmaxlabel", text: "min" }), min3]),
        el("div", { class: "paramminmaxgroup" }, [el("span", { class: "paramminmaxlabel", text: "max" }), max3]),
      ]),
    ]),
    el("div", { class: "paramrow" }, [
      el("div", { class: "paramlabel", text: "4-bal (minuten)" }),
      el("div", { class: "paramminmax" }, [
        el("div", { class: "paramminmaxgroup" }, [el("span", { class: "paramminmaxlabel", text: "min" }), min4]),
        el("div", { class: "paramminmaxgroup" }, [el("span", { class: "paramminmaxlabel", text: "max" }), max4]),
      ]),
    ]),
  ];

  const paramKaart = el("div", { class: "card" }, [
    ...maakStreeftijdenSectie("Streeftijden — 9 holes", iBal2Min9, iBal2Max9, iBal3Min9, iBal3Max9, iBal4Min9, iBal4Max9, true),
    el("div", { class: "eyebrow", style: "margin-top:14px", text: "4-bal — streeftijd per hole (minuten)" }),
    bal4HoleGrid,
    ...(fout ? [fout] : []),
    el("button", { class: "btn secondary", style: "margin-top:12px", onclick: toonVerantwoording, text: "Verantwoording" }),
    opslaanBtn,
  ]);

  const analyseBtn = el("button", { class: "btn secondary", text: "📊 Analyseer huidige flights" });
  const analyseResultaatNode = el("div", { id: "analyseresultaat" });

  analyseBtn.addEventListener("click", async () => {
    analyseBtn.disabled = true;
    analyseBtn.textContent = "Bezig…";
    analyseResultaatNode.innerHTML = "";
    try {
      const alleFlights = await sb("flights?uitgestapt=eq.false&select=*");
      const metMelding = alleFlights.filter((f) => f.gerapporteerde_hole != null && f.gerapporteerd_checkpoint != null);
      const nu = new Date();
      // v0.18.0: hergebruikt conclusieVoor() zelf (i.p.v. een eigen losse drempel-check) zodat deze
      // telling altijd exact dezelfde minuten-banden hanteert als de rest van de app.
      // v0.21.4: vierde teller (voorSchema) toegevoegd voor de nieuwe "voor_schema"-band — zonder
      // deze zou een vooruitlopende flight hier onterecht als "ver achter" meetellen (de oude
      // else-tak ving alles op wat niet "op_schema"/"achter" was).
      let opSchema = 0, voorSchema = 0, achter = 0, verAchter = 0, somAfwijkingMin = 0;
      for (const flight of metMelding) {
        const minutenPerHole = rondetijdBereikVoor(params, flight.aantal_spelers, flight.ronde_type).max / rondeInfo(flight.ronde_type).holesInRonde;
        const zelfPos = verwachtePositie(flight.starttijd_effectief, minutenPerHole, nu, flight.ronde_type);
        const actueleFractie = (flight.gerapporteerde_hole - 1) + checkpointFractie(flight.gerapporteerd_checkpoint);
        const deltaMinuten = (actueleFractie - zelfPos.fractie) * minutenPerHole;
        somAfwijkingMin += deltaMinuten;
        const key = conclusieVoor(deltaMinuten).key;
        if (key === "op_schema") opSchema++;
        else if (key === "voor_schema") voorSchema++;
        else if (key === "achter") achter++;
        else verAchter++;
      }
      const totaal = metMelding.length;
      analyseResultaatNode.append(el("div", {
        class: "analyseresultaat",
        text: totaal === 0
          ? "Geen flights met een actuele melding gevonden — nog geen data om te analyseren."
          : `${totaal} flight(s) met een melding: ${opSchema} op schema, ${voorSchema} voor op schema, ${achter} achter, ${verAchter} ver achter. Gemiddelde afwijking: ${Math.round(somAfwijkingMin / totaal)} minuten (negatief = gemiddeld achter op schema).`,
      }));
    } catch (e) {
      analyseResultaatNode.append(el("div", { class: "paramfout", text: "Analyse is niet gelukt. Probeer het nog eens." }));
      console.error(e);
    } finally {
      analyseBtn.disabled = false;
      analyseBtn.textContent = "📊 Analyseer huidige flights";
    }
  });

  const analyseKaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Analyse" }),
    el("p", { class: "help", text: "Momentopname van de nu actieve flights — geen historische calibratie (GoyerFlow bewaart nog geen meetlogboek zoals de Marshal App; zie toelichting in de chat)." }),
    analyseBtn,
    analyseResultaatNode,
  ]);

  inhoud.append(paramKaart, analyseKaart);
}

/* ---- Tab: Admin — ledenlijst met pincode-reset + beheerderswachtwoord wijzigen ---- */
async function vulAdminLedenTab(inhoud) {
  const leden = await sb("spelers?pincode_ooit_aangemaakt=eq.true&select=*,flights(*)&order=naam.asc");
  inhoud.innerHTML = "";

  const ledenKaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Leden — pincode resetten" }),
    el("p", { class: "help", text: "Alle leden die ooit zelf een pincode hebben gekozen. Resetten dwingt bij de volgende login een nieuwe keuze af." }),
    leden.length === 0
      ? el("p", { class: "help", text: "Nog geen leden gevonden." })
      : el("div", { class: "ledenlijst" }, leden.flatMap((lid) => renderLidRij(lid))),
  ]);

  inhoud.append(ledenKaart, bouwWachtwoordKaart());
}

function renderLidRij(lid) {
  const open = adminLocal.geopendLid === lid.id;
  const rij = el("div", { class: "ledenrij" + (open ? " open" : "") }, [
    el("div", {}, [
      el("div", { class: "ledennaam", text: lid.naam }),
      el("div", { class: "ledensub", text: `${lid.persoonscode}` + (lid.flights ? ` · ${lid.flights.lus}` : "") }),
    ]),
    el("div", { text: open ? "▾" : "▸" }),
  ]);
  rij.addEventListener("click", () => {
    adminLocal.geopendLid = open ? null : lid.id;
    adminLocal.resetSucces = null;
    render();
  });

  const nodes = [rij];
  if (open) {
    const succes = adminLocal.resetSucces === lid.id
      ? el("div", { class: "okmsg", text: "Pincode gereset — bij de volgende login moet een nieuwe pincode gekozen worden." })
      : null;
    const resetBtn = el("button", { class: "resetbtn", text: adminLocal.resetBezig ? "Bezig…" : "Pincode resetten" });
    resetBtn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      if (!confirm(`Pincode van ${lid.naam} resetten? De speler moet bij de volgende login zelf een nieuwe pincode kiezen.`)) return;
      adminLocal.resetBezig = true;
      render();
      try {
        await sb(`spelers?id=eq.${lid.id}`, {
          method: "PATCH", prefer: "return=minimal",
          body: JSON.stringify({ pincode: "0000", pincode_gewijzigd: false }),
        });
        adminLocal.resetSucces = lid.id;
      } catch (e) {
        alert("Pincode resetten is niet gelukt. Probeer het nog eens.");
        console.error(e);
      } finally {
        adminLocal.resetBezig = false;
        render();
      }
    });
    nodes.push(el("div", { class: "ledendetail" }, [...(succes ? [succes] : []), resetBtn]));
  }
  return nodes;
}

function bouwWachtwoordKaart() {
  const iOud = el("input", { type: "password", placeholder: "Huidig wachtwoord" });
  const iNieuw = el("input", { type: "password", placeholder: "Nieuw wachtwoord" });
  const iHerhaal = el("input", { type: "password", placeholder: "Herhaal nieuw wachtwoord" });

  const opslaan = async () => {
    adminLocal.wachtwoordFout = null;
    adminLocal.wachtwoordSucces = false;
    const oud = iOud.value, nieuw = iNieuw.value, herhaal = iHerhaal.value;
    if (nieuw.length < 4) { adminLocal.wachtwoordFout = "Kies een nieuw wachtwoord van minstens 4 tekens."; render(); return; }
    if (nieuw !== herhaal) { adminLocal.wachtwoordFout = "De twee nieuwe wachtwoorden komen niet overeen."; render(); return; }
    adminLocal.wachtwoordBezig = true;
    render();
    try {
      const [params] = await sb("parameters?select=id,admin_wachtwoord&limit=1");
      const huidig = (params && params.admin_wachtwoord) || "GF2026";
      if (oud !== huidig) {
        adminLocal.wachtwoordFout = "Huidig wachtwoord is onjuist.";
        return;
      }
      await sb(`parameters?id=eq.${params.id}`, {
        method: "PATCH", prefer: "return=minimal",
        body: JSON.stringify({ admin_wachtwoord: nieuw }),
      });
      adminLocal.wachtwoordSucces = true;
    } catch (e) {
      adminLocal.wachtwoordFout = "Wijzigen is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      adminLocal.wachtwoordBezig = false;
      render();
    }
  };

  const fout = adminLocal.wachtwoordFout ? el("div", { class: "msg err", text: adminLocal.wachtwoordFout }) : null;
  const succes = adminLocal.wachtwoordSucces ? el("div", { class: "okmsg", text: "Wachtwoord gewijzigd." }) : null;

  return el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Beheerderswachtwoord wijzigen" }),
    el("label", { text: "Huidig wachtwoord" }), iOud,
    el("label", { text: "Nieuw wachtwoord" }), iNieuw,
    el("label", { text: "Herhaal nieuw wachtwoord" }), iHerhaal,
    ...(fout ? [fout] : []),
    ...(succes ? [succes] : []),
    el("button", { class: "btn", onclick: opslaan, text: adminLocal.wachtwoordBezig ? "Bezig…" : "Wachtwoord wijzigen" }),
  ]);
}

function logout() {
  state.scherm = "persoonscode";
  state.speler = null;
  state.flight = null;
  state.fout = null;
  trackerLocal = nieuweTrackerLocal();
  render();
}

render();
</script>
