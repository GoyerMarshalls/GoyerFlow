/* ---- Tab: Tracker — overzicht van ALLE flights (niet relatief t.o.v. voor/achter, in
   tegenstelling tot het leden-trackerscherm: als beheerder heb je al het totaaloverzicht nodig,
   geen "flight voor/achter jou"-redenering — zie Kay's toelichting bij deze fase). ---- */
// Berekent dezelfde live positie/conclusie-set als renderTracker's "zelf"-kaart, maar dan voor een
// WILLEKEURIGE flight (niet per se de ingelogde speler) — hergebruikt door zowel de Tracker-tab-
// rijen als het flight-detailscherm, zodat beide altijd exact dezelfde cijfers tonen.
function berekenFlightPositie(flight, params, nu) {
  const minutenPerHole = rondetijdVoor(params, flight.aantal_spelers, flight.gemiddelde_hcp, flight.ronde_type) / rondeInfo(flight.ronde_type).holesInRonde;
  const zelfPos = verwachtePositie(flight.starttijd_effectief, minutenPerHole, nu, flight.ronde_type);
  const heeftMelding = flight.gerapporteerde_hole != null && flight.gerapporteerd_checkpoint != null;
  const weergaveVoorWacht = (heeftMelding ? projecteerVanafMelding(flight, minutenPerHole, nu, flight.ronde_type) : null) ?? zelfPos;
  const weergave = pasWachttijdToe(weergaveVoorWacht, flight, minutenPerHole, nu, flight.ronde_type);
  const voltooid = rondeVoltooid(weergave, flight.ronde_type);
  let conclusie = null;
  if (heeftMelding && !voltooid) {
    const actueleFractie = (flight.gerapporteerde_hole - 1) + checkpointFractie(flight.gerapporteerd_checkpoint);
    conclusie = conclusieVoor(actueleFractie - zelfPos.fractie);
  }
  const gestartNog = nu.getTime() < new Date(flight.starttijd_effectief).getTime();
  return { flight, minutenPerHole, zelfPos, weergave, voltooid, heeftMelding, conclusie, gestartNog };
}

// Titel voor het flight-detailscherm, naar het voorbeeld van de Marshal App ("Wekking + 2
// spelers"): achternaam (laatste woord van de naam) van de eerste speler + aantal overigen. Een
// benadering, geen gegarandeerde 1-op-1 match met hoe de Marshal App dit precies bepaalt (die
// broncode is niet in deze sessie beschikbaar) — bij één speler gewoon de volledige naam.
function flightTitel(spelers) {
  if (!spelers || spelers.length === 0) return "Flight";
  if (spelers.length === 1) return spelers[0].naam;
  const achternaam = spelers[0].naam.trim().split(/\s+/).pop();
  const rest = spelers.length - 1;
  return `${achternaam} + ${rest} speler${rest === 1 ? "" : "s"}`;
}

// Selectie + sortering van de Tracker-tab (v0.11.0, Kay's verzoek 27 oktober 2026: "zoals we het in
// de Marshal App deden"). Eerst de daadwerkelijke Marshal App-broncode gelezen (renderTracker() in
// "Marshal App.html") i.p.v. te gokken — dit is een 1-op-1 vertaling van die logica naar GoyerFlow's
// eigen datamodel:
// - ACTIEF: de flight is gestart, en nog niet meer dan ACTIEF_GRACE_MIN minuten voorbij de
//   verwachte rondetijd (rondetijdVoor()) — zo blijft een net afgeronde flight nog even zichtbaar,
//   in plaats van voor altijd in de lijst te blijven staan tot iemand 'm handmatig op "Uitgestapt" zet.
// - AANKOMEND: de flight start over hoogstens AANKOMEND_VENSTER_MIN minuten (en is nog niet gestart).
// Een flight die in geen van beide vensters valt (te ver in de toekomst, of allang voorbij de
// grace-periode) wordt niet getoond — dit is de kernwijziging t.o.v. voorheen, toen ELKE
// niet-uitgestapte flight altijd zichtbaar bleef, ongeacht hoe ver in de toekomst de starttijd lag.
const AANKOMEND_VENSTER_MIN = 16; // zelfde venster als de Marshal App ("binnen 16 minuten")
const ACTIEF_GRACE_MIN = 30; // zelfde grace-periode als de Marshal App

function trackerIsActief(positie, params, nu) {
  if (positie.gestartNog) return false;
  const verstrekenMin = (nu.getTime() - new Date(positie.flight.starttijd_effectief).getTime()) / 60000;
  const rondetijdMin = rondetijdVoor(params, positie.flight.aantal_spelers, positie.flight.gemiddelde_hcp, positie.flight.ronde_type);
  return verstrekenMin < rondetijdMin + ACTIEF_GRACE_MIN;
}
function trackerIsAankomend(flight, nu) {
  const resterendMin = (new Date(flight.starttijd_effectief).getTime() - nu.getTime()) / 60000;
  return resterendMin > 0 && resterendMin <= AANKOMEND_VENSTER_MIN;
}
// Sorteersleutel: voor een actieve flight het FYSIEKE holenummer waar hij nu zou moeten zijn (zodat
// een H1- en een H10-ronde gewoon door elkaar heen op fysieke positie staan); voor een aankomende
// flight het fysieke starthole (1 of 10 — rechtstreeks uit RONDE_INFO, GEEN aparte "sortHole"-functie
// nodig zoals in de Marshal App, want GoyerFlow had deze 1-vs-10-kennis al voor de holenummering).
function trackerSortHole(positie, aankomend) {
  if (aankomend) return rondeInfo(positie.flight.ronde_type).startHole;
  return fysiekeHole(positie.flight.ronde_type, positie.weergave.hole);
}
function trackerSelecteerEnSorteer(allePosities, params, nu) {
  const items = [];
  for (const positie of allePosities) {
    if (trackerIsActief(positie, params, nu)) items.push({ positie, aankomend: false });
    else if (trackerIsAankomend(positie.flight, nu)) items.push({ positie, aankomend: true });
  }
  items.sort((a, b) => {
    const ha = trackerSortHole(a.positie, a.aankomend);
    const hb = trackerSortHole(b.positie, b.aankomend);
    if (ha !== hb) return ha - hb;
    // Op dezelfde hole: aankomende flights altijd boven actieve.
    if (a.aankomend !== b.aankomend) return a.aankomend ? -1 : 1;
    const ta = new Date(a.positie.flight.starttijd_effectief).getTime();
    const tb = new Date(b.positie.flight.starttijd_effectief).getTime();
    // Beide aankomend: laatste start bovenaan, eerstvolgende onderaan (dichter bij "nu").
    if (a.aankomend && b.aankomend) return tb - ta;
    // Beide actief (niet aankomend): nog spelende flights boven al afgeronde flights op dezelfde
    // hole (Kay's feedback 27 oktober 2026, testronde op de baan — door de kale starttijd-sortering
    // kon een net afgeronde flight boven een nog spelende flight op dezelfde hole staan, verwarrend
    // bij het scannen van de lijst). Geldt alleen binnen dezelfde hole — zie trackerSortHole
    // hierboven, die een afgeronde flight al op zijn laatste (fysieke) hole vastzet.
    if (a.positie.voltooid !== b.positie.voltooid) return a.positie.voltooid ? 1 : -1;
    // Beide actief: gewone sortering op starttijd.
    return ta - tb;
  });
  return items.map((i) => i.positie);
}

async function vulAdminTrackerTab(inhoud, opts = {}) {
  // "stil" = automatische achtergrondverversing door adminIntervalId (v0.7.1, zie render()) — zelfde
  // aanpak als renderTracker's "stil"-modus: bij een mislukte ophaalactie de bestaande weergave laten
  // staan i.p.v. te vervangen door een foutmelding (de beheerder heeft niets aangeraakt). Bij de
  // eerste, niet-stille load (tabwissel of initiële render) blijft het oude gedrag — gooi de fout
  // door zodat renderAdmin()'s bestaande catch-blok de foutmelding toont — ongewijzigd.
  const stil = !!opts.stil;
  let params, flights;
  try {
    [params] = await sb("parameters?select=*&limit=1");
    // spelers(*) : PostgREST-embed via de bestaande spelers.flight_id-foreignkey — haalt per flight
    // meteen de bijbehorende spelersrijen mee in één aanvraag, i.p.v. een aparte fetch per flight.
    flights = await sb("flights?uitgestapt=eq.false&select=*,spelers(*)&order=starttijd_effectief.asc");
  } catch (e) {
    console.error(e);
    if (!stil) throw e;
    return;
  }
  inhoud.innerHTML = "";

  const nu = new Date();
  // Alle posities blijven berekend (nodig voor het flight-detailscherm hieronder, óók als die
  // specifieke flight inmiddels buiten het actief/aankomend-venster is gevallen terwijl de
  // beheerder 'm open had staan) — alleen de KAART-lijst wordt tot het venster beperkt.
  const allePosities = flights.map((flight) => berekenFlightPositie(flight, params, nu));
  const rijen = trackerSelecteerEnSorteer(allePosities, params, nu);

  const kaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Flights nu en binnenkort" }),
    rijen.length === 0
      ? el("p", { class: "help", text: "Geen actieve of binnenkort startende flights gevonden." })
      : el("div", {}, rijen.map(({ flight, weergave, voltooid, heeftMelding, conclusie, gestartNog }) => {
          const kleur = voltooid ? "#9B9585" : gestartNog ? "#B9B2A0" : (conclusie ? conclusie.kleur : "var(--blue)");
          const statustekst = voltooid ? "Ronde voltooid"
            : gestartNog ? `start om ${formatTijd(flight.starttijd_effectief)}`
            : (conclusie ? conclusie.label : "nog geen melding");
          const bolTekst = voltooid ? "✓" : gestartNog ? formatTijd(flight.starttijd_effectief) : String(fysiekeHole(flight.ronde_type, weergave.hole));
          const restFractie = weergave.fractie - Math.floor(weergave.fractie);
          const voortgangPct = voltooid ? 100 : gestartNog ? 0 : tijdlijnPercentage(restFractie);
          // v0.14.0: beheerder-weergave toont de VOLLEDIGE Teecontrol-spelerslijst (leden én gasten,
          // met Teecontrol's eigen kleur) i.p.v. alleen de gekoppelde (leden-only) spelers-rijen — zie
          // bouwSpelersoverzichtBeheer hierboven voor de toelichting/aanleiding.
          const spelersVanFlight = flight.teecontrol_spelers || [];

          const rij = el("div", { class: "flightrij" }, [
            el("div", { class: "flightbol", style: `background:${kleur}`, text: bolTekst }),
            el("div", { class: "flightinfo" }, [
              flight.toernooi_naam ? el("div", { class: "flighttoernooi", text: `🏆 ${flight.toernooi_naam}` }) : null,
              spelersVanFlight.length === 0
                ? el("div", { class: "flightnaampillen" }, [el("span", { class: "flightnaampil", text: `${flight.lus} · ${flight.aantal_spelers}-bal` })])
                : el("div", { class: "flightnaampillen" }, spelersVanFlight.map((s) => {
                    const spelerKleur = tcKleur(s.kleur);
                    return el("span", { class: "flightnaampil", style: `background:${spelerKleur.bg};color:${spelerKleur.fg}`, text: s.naam });
                  })),
              el("div", { class: "flightmeta" }, [
                clockSvg("#9A9385"),
                // v0.14.1: was formatTijd(nu) — toonde het moment van renderen, dus op elke rij
                // hetzelfde en dus nooit onderscheidend (Kay merkte dit op: "die tijd is altijd de
                // huidige tijd"). De Marshal App's eigen renderFlightItem/renderFlightItemAankomend
                // koppelt het klokicoon altijd aan f.starttijd (🕐 ${f.starttijd}), nooit aan "nu" —
                // hier dus gecorrigeerd naar het GoyerFlow-equivalent: flight.starttijd_effectief.
                document.createTextNode(` ${formatTijd(flight.starttijd_effectief)}  ·  Hole ${fysiekeHole(flight.ronde_type, weergave.hole)}/${rondeInfo(flight.ronde_type).holesInRonde}  ·  ${statustekst}`),
              ]),
              el("div", { class: "flightprogressvak" }, [
                el("div", { class: "flightprogressvoortgang", style: `width:${voortgangPct}%;background:${kleur}` }),
              ]),
            ].filter(Boolean)),
          ]);
          rij.addEventListener("click", () => {
            adminLocal.flightDetailId = flight.id;
            adminLocal.flightDetailHoleDraft = null;
            adminLocal.flightDetailFout = null;
            render();
          });
          return rij;
        })),
  ]);
  inhoud.append(kaart);

  if (adminLocal.flightDetailId != null) {
    const geselecteerd = allePosities.find((r) => r.flight.id === adminLocal.flightDetailId);
    if (geselecteerd) inhoud.append(bouwFlightDetailModal(geselecteerd, params, nu));
  }
}

/* ---- Flight-detailscherm (popup, v0.6.0) -------------------------------------------------------
   Bij klik op een flight in de Tracker-tab: spelersoverzicht (naam/type/hcp + gem. hcp, naar het
   voorbeeld van de Marshal App-popup) plus GoyerFlow's eigen "waar is deze flight nu"-weergave voor
   UITSLUITEND deze flight (geen voor/achter-kaarten, dat hoort bij het leden-trackerscherm, niet bij
   dit overzicht). "Verplaatsen" = de beheerder meldt de positie namens de flight, exact dezelfde
   hole-stepper + Afslag/Fairway/Green-knoppen en schrijfactie (gerapporteerde_hole/checkpoint/
   tijdstip) als een speler op zijn eigen kaart gebruikt — bevestigd met Kay, 25 oktober 2026.
   Spelersoverzicht (v0.14.0, zie bouwSpelersoverzichtBeheer hierboven): toont ALLE spelers zoals
   Teecontrol ze aanlevert — leden én gasten, met Teecontrol's eigen kleur/typelabel — niet langer
   beperkt tot alleen gekoppelde leden-rijen zoals vóór v0.14.0 ("Club lid" was toen een vaste tekst
   omdat gasten structureel ontbraken; dat gold specifiek voor déze beheerder-weergave, niet voor de
   spelers-tabel zelf, die nog steeds uitsluitend leden met een persoonscode bevat — zie schema.sql
   "Fase 2h"). -------------------------------------------------------------------------------------- */
function bouwFlightDetailModal(positie, params, nu) {
  const { flight, weergave, voltooid, heeftMelding, conclusie, minutenPerHole } = positie;
  const spelers = flight.teecontrol_spelers || [];

  const sluiten = () => { adminLocal.flightDetailId = null; adminLocal.flightDetailFout = null; render(); };

  // Spelersoverzicht + "Gem. handicap flight" (v0.14.0): zie bouwSpelersoverzichtBeheer hierboven —
  // ALLE Teecontrol-spelers van deze flight, niet (meer) de gedeelde bouwSpelersoverzicht() die het
  // leden-eigen trackerscherm nog wel gebruikt.
  const spelersoverzicht = bouwSpelersoverzichtBeheer(spelers, `${flight.lus} · ${flight.aantal_spelers}-bal`);

  // Eigen flight-kaart (v0.6.0): zelfde opbouw/schrijflogica als renderTracker's "zelf"-kaart,
  // hier hergebruikt voor een door de beheerder gekozen flight i.p.v. de ingelogde speler. Draft-
  // waarde van de stepper staat in adminLocal.flightDetailHoleDraft (los van trackerLocal, zie
  // nieuwAdminLocal()).
  const holeWeergave = adminLocal.flightDetailHoleDraft ?? weergave.hole;
  const kaartKleur = voltooid ? "var(--accent)" : (conclusie ? conclusie.kleur : "var(--accent)");

  // Flight handmatig klaarmelden (toegevoegd 27 oktober 2026, Kay's feedback tijdens de veldtest:
  // "zie geen knop in admin om flight klaar te kiezen"). Zelfde schrijfactie als de speler-eigen
  // "Ronde afgerond"-knop (zie zelfRondeAfgerond in renderTracker: uitgestapt=true), nu ook
  // beschikbaar voor de beheerder — nodig omdat spelers na afloop lang niet altijd nog even inloggen
  // om dat zelf te bevestigen, waardoor een allang uitgespeelde flight anders voor onbepaalde tijd
  // in de lijst (en als "voor"/"achter"-buur van anderen, zie trackerSelecteerEnSorteer/de voor-
  // achterselectie hierboven) kan blijven staan.
  async function adminMarkeerAlsKlaar() {
    if (adminLocal.flightDetailBezig) return;
    adminLocal.flightDetailBezig = true;
    try {
      await sb(`flights?id=eq.${flight.id}`, { method: "PATCH", prefer: "return=minimal", body: JSON.stringify({ uitgestapt: true }) });
      adminLocal.flightDetailBezig = false;
      sluiten();
    } catch (e) {
      adminLocal.flightDetailFout = "Klaarmelden is niet gelukt. Probeer het nog eens.";
      console.error(e);
      adminLocal.flightDetailBezig = false;
      render();
    }
  }

  async function adminPositieMelden(checkpoint, hole) {
    if (adminLocal.flightDetailBezig) return;
    adminLocal.flightDetailBezig = true;
    try {
      await sb(`flights?id=eq.${flight.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: JSON.stringify({ gerapporteerde_hole: hole, gerapporteerd_checkpoint: checkpoint, gerapporteerd_tijdstip: new Date().toISOString() }),
      });
      adminLocal.flightDetailHoleDraft = null;
      adminLocal.flightDetailFout = null;
    } catch (e) {
      adminLocal.flightDetailFout = "Verplaatsen is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      adminLocal.flightDetailBezig = false;
      render();
    }
  }

  const stepMin = el("button", { class: "stepbtn light", "aria-label": "Een hole terug", onclick: () => { adminLocal.flightDetailHoleDraft = Math.max(1, holeWeergave - 1); render(); } }, [chevronSvg("links", "#fff")]);
  const stepPlus = el("button", { class: "stepbtn light", "aria-label": "Een hole verder", onclick: () => { adminLocal.flightDetailHoleDraft = Math.min(rondeInfo(flight.ronde_type).holesInRonde, holeWeergave + 1); render(); } }, [chevronSvg("rechts", "#fff")]);
  const markerKnoppen = CHECKPOINT_VOLGORDE.map((key) => {
    const geselecteerd = heeftMelding && key === weergave.checkpoint && holeWeergave === weergave.hole;
    return el("button", {
      class: "markerbtn big",
      style: geselecteerd ? "background:#fff;border-color:#fff;color:" + kaartKleur
                           : "background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85)",
      onclick: () => adminPositieMelden(key, holeWeergave),
      text: CHECKPOINT_KNOPLABEL[key],
    });
  });

  // v0.14.2: stepper/marker-knoppen staan voortaan ALTIJD, ook als voltooid===true (Kay's "Test
  // afgerond"-observatie: een flight die het systeem als "waarschijnlijk afgerond" beoordeelt — puur
  // op basis van verstreken tijd, zonder dat er ooit een melding is geweest, zie rondeVoltooid()/
  // berekenFlightPositie hierboven — gaf de beheerder voorheen geen enkele manier om dat te
  // corrigeren als het niet klopte: de stepper/marker-rij verdween volledig zodra voltooid=true).
  // Een melding via adminPositieMelden hieronder zet gerapporteerde_hole/-checkpoint/-tijdstip, dus
  // de volgende render gaat via projecteerVanafMelding() i.p.v. de pure schema-berekening — als de
  // gemelde positie niet ook alweer voorbij de laatste hole ligt, vervalt voltooid daarmee vanzelf.
  const eigenKinderen = [el("div", {
    class: "eyebrow",
    text: voltooid
      ? "Ronde waarschijnlijk afgerond — klopt dit niet? Corrigeer de positie hieronder."
      : (heeftMelding ? "Waar is deze flight nu?" : "Maak een keuze: waar is deze flight nu?"),
  })];
  eigenKinderen.push(
    el("div", { class: "stepperrow big" }, [stepMin, el("div", { class: "stepvalue big", text: String(fysiekeHole(flight.ronde_type, holeWeergave)) }), stepPlus]),
    el("div", { class: "markerrow big" }, markerKnoppen)
  );
  if (heeftMelding && !voltooid) {
    const restFractieNu = weergave.fractie - Math.floor(weergave.fractie);
    eigenKinderen.push(el("div", { class: "tijdlijn" }, [
      el("div", { class: "tijdlijnvak" }, [
        el("div", { class: "tijdlijnvoortgang", style: `width:${tijdlijnPercentage(restFractieNu)}%` }),
      ]),
    ]));
    eigenKinderen.push(el("div", { class: "conclusieline" }, [
      document.createTextNode("Op basis van een start om "),
      el("b", { text: formatTijd(flight.starttijd_effectief) }),
      document.createTextNode(" en een gemiddelde rondetijd van "),
      el("b", { text: formatDuur(rondetijdVoor(params, flight.aantal_spelers, flight.gemiddelde_hcp, flight.ronde_type)) }),
      document.createTextNode(` voor een ${flight.aantal_spelers}-bal over ${rondeInfo(flight.ronde_type).holesInRonde} holes zou deze flight nu ongeveer op de `),
      el("b", { text: `${CHECKPOINT_LABEL[positie.zelfPos.checkpoint]} van hole ${fysiekeHole(flight.ronde_type, positie.zelfPos.hole)}` }),
      document.createTextNode(` moeten zijn. ${conclusie ? conclusie.zin : ""}`),
    ]));
  }
  if (adminLocal.flightDetailFout) eigenKinderen.push(el("div", { class: "msg err", text: adminLocal.flightDetailFout }));
  const eigenKaart = el("div", { class: "card me detaileigenkaart", style: "background:" + kaartKleur }, eigenKinderen);

  const modal = el("div", { class: "detailoverlay" }, [
    el("div", { class: "detailmodal" }, [
      el("div", { class: "detailheader" }, [
        el("div", {}, [
          el("div", { class: "detailtitle", text: flightTitel(spelers) }),
          el("div", { class: "detailsub", text: `Start ${formatTijd(flight.starttijd_effectief)} · Hole ${fysiekeHole(flight.ronde_type, weergave.hole)} · ${rondeInfo(flight.ronde_type).holesInRonde} holes` }),
          flight.toernooi_naam ? el("div", { class: "detailtoernooi", text: `🏆 ${flight.toernooi_naam}` }) : null,
        ].filter(Boolean)),
        el("button", { class: "detailclose", "aria-label": "Sluiten", onclick: sluiten }, [
          (() => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width","13"); s.setAttribute("height","13"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none");
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d","M6 6l12 12M18 6L6 18"); p.setAttribute("stroke","#6B6558"); p.setAttribute("stroke-width","2"); p.setAttribute("stroke-linecap","round"); s.appendChild(p); return s; })(),
        ]),
      ]),
      ...spelersoverzicht,
      eigenKaart,
      el("button", {
        class: "btn secondary",
        style: "margin-top:12px",
        onclick: adminMarkeerAlsKlaar,
        text: adminLocal.flightDetailBezig ? "Bezig…" : "Flight klaarmelden",
      }),
    ].filter(Boolean)),
  ]);
  return modal;
}

/* ---- Tab: Parameters — checkpointtijden bewerken + "analyse"-functie. LET OP: de analyse hier is
   bewust een lichte momentopname van de NU actieve flights, geen echte historische calibratie
   zoals de Marshal App (die rekent op basis van een meetlogboek dat GoyerFlow nog niet heeft — zie
   schema.sql Fase 2b en de toelichting in de chat). ---- */
async function vulAdminParametersTab(inhoud) {
  const [params] = await sb("parameters?select=*&limit=1");
  inhoud.innerHTML = "";

  const iPar3 = el("input", { class: "paraminput", type: "number", step: "0.1", value: params.par3_minuten });
  const iPar4 = el("input", { class: "paraminput", type: "number", step: "0.1", value: params.par4_minuten });
  const iPar5 = el("input", { class: "paraminput", type: "number", step: "0.1", value: params.par5_minuten });
  const iHcp = el("input", { class: "paraminput", type: "number", step: "0.01", value: params.hcp_correctie_per_punt_boven_10 });
  const iFlight = el("input", { class: "paraminput", type: "number", step: "0.1", value: params.flightgrootte_correctie_per_speler_boven_2 });

  const voorbeeldtekst = el("p", { class: "help" });
  const voorbeeldrij = (label, aantalSpelers, hcp) => {
    const waarden = {
      par3_minuten: parseFloat(iPar3.value) || 0,
      par4_minuten: parseFloat(iPar4.value) || 0,
      par5_minuten: parseFloat(iPar5.value) || 0,
      hcp_correctie_per_punt_boven_10: parseFloat(iHcp.value) || 0,
      flightgrootte_correctie_per_speler_boven_2: parseFloat(iFlight.value) || 0,
    };
    return `${label}: ${formatDuur(rondetijdVoor(waarden, aantalSpelers, hcp))}`;
  };
  const herbereken = () => {
    voorbeeldtekst.textContent = [
      voorbeeldrij("Tweebal (hcp 10)", 2, 10),
      voorbeeldrij("Driebal (hcp 15)", 3, 15),
      voorbeeldrij("Vierbal (hcp 18)", 4, 18),
    ].join("  ·  ");
  };
  herbereken();
  [iPar3, iPar4, iPar5, iHcp, iFlight].forEach((input) => input.addEventListener("input", herbereken));

  const opslaan = async () => {
    adminLocal.paramFout = null;
    adminLocal.paramSucces = false;
    const nieuw = {
      par3_minuten: parseFloat(iPar3.value),
      par4_minuten: parseFloat(iPar4.value),
      par5_minuten: parseFloat(iPar5.value),
      hcp_correctie_per_punt_boven_10: parseFloat(iHcp.value),
      flightgrootte_correctie_per_speler_boven_2: parseFloat(iFlight.value),
    };
    if (Object.values(nieuw).some((v) => Number.isNaN(v) || v < 0)) {
      adminLocal.paramFout = "Vul voor elk veld een geldig, niet-negatief getal in.";
      render();
      return;
    }
    adminLocal.paramBezig = true;
    render();
    try {
      await sb(`parameters?id=eq.${params.id}`, {
        method: "PATCH", prefer: "return=minimal",
        body: JSON.stringify({ ...nieuw, updated_at: new Date().toISOString() }),
      });
      adminLocal.paramSucces = true;
    } catch (e) {
      adminLocal.paramFout = "Opslaan is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      adminLocal.paramBezig = false;
      render();
    }
  };

  const fout = adminLocal.paramFout ? el("div", { class: "paramfout", text: adminLocal.paramFout }) : null;
  const succes = adminLocal.paramSucces ? el("div", { class: "okmsg", text: "Opgeslagen." }) : null;

  const paramKaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Checkpointtijden" }),
    el("div", { class: "paramrow" }, [el("div", { class: "paramlabel", text: "Par 3 (minuten)" }), iPar3]),
    el("div", { class: "paramrow" }, [el("div", { class: "paramlabel", text: "Par 4 (minuten)" }), iPar4]),
    el("div", { class: "paramrow" }, [el("div", { class: "paramlabel", text: "Par 5 (minuten)" }), iPar5]),
    el("div", { class: "paramrow" }, [el("div", { class: "paramlabel", text: "Hcp-correctie / punt boven 10" }), iHcp]),
    el("div", { class: "paramrow" }, [el("div", { class: "paramlabel", text: "Flightgrootte-correctie / speler boven 2" }), iFlight]),
    el("p", { class: "help", text: "Verwachte rondetijden:" }),
    voorbeeldtekst,
    ...(fout ? [fout] : []),
    ...(succes ? [succes] : []),
    el("button", { class: "btn", onclick: opslaan, text: adminLocal.paramBezig ? "Bezig…" : "Opslaan" }),
  ]);

  const analyseBtn = el("button", { class: "btn secondary", text: "📊 Analyseer huidige flights" });
  const analyseResultaatNode = el("div", { id: "analyseresultaat" });

  analyseBtn.addEventListener("click", async () => {
    analyseBtn.disabled = true;
    analyseBtn.textContent = "Bezig…";
    analyseResultaatNode.innerHTML = "";
    try {
      const alleFlights = await sb("flights?uitgestapt=eq.false&select=*");
      const metMelding = alleFlights.filter((f) => f.gerapporteerde_hole != null && f.gerapporteerd_checkpoint != null);
      const nu = new Date();
      let opSchema = 0, voor = 0, achter = 0, somAfwijking = 0;
      for (const flight of metMelding) {
        const minutenPerHole = rondetijdVoor(params, flight.aantal_spelers, flight.gemiddelde_hcp, flight.ronde_type) / rondeInfo(flight.ronde_type).holesInRonde;
        const zelfPos = verwachtePositie(flight.starttijd_effectief, minutenPerHole, nu, flight.ronde_type);
        const actueleFractie = (flight.gerapporteerde_hole - 1) + checkpointFractie(flight.gerapporteerd_checkpoint);
        const deltaHoles = actueleFractie - zelfPos.fractie;
        somAfwijking += deltaHoles;
        if (deltaHoles >= 0.4) voor++;
        else if (deltaHoles <= -0.4) achter++;
        else opSchema++;
      }
      const totaal = metMelding.length;
      analyseResultaatNode.append(el("div", {
        class: "analyseresultaat",
        text: totaal === 0
          ? "Geen flights met een actuele melding gevonden — nog geen data om te analyseren."
          : `${totaal} flight(s) met een melding: ${opSchema} op schema, ${voor} voor, ${achter} achter. Gemiddelde afwijking: ${(somAfwijking / totaal).toFixed(2)} hole.`,
      }));
    } catch (e) {
      analyseResultaatNode.append(el("div", { class: "paramfout", text: "Analyse is niet gelukt. Probeer het nog eens." }));
      console.error(e);
    } finally {
      analyseBtn.disabled = false;
      analyseBtn.textContent = "📊 Analyseer huidige flights";
    }
  });

  const analyseKaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Analyse" }),
    el("p", { class: "help", text: "Momentopname van de nu actieve flights — geen historische calibratie (GoyerFlow bewaart nog geen meetlogboek zoals de Marshal App; zie toelichting in de chat)." }),
    analyseBtn,
    analyseResultaatNode,
  ]);

  inhoud.append(paramKaart, analyseKaart);
}

/* ---- Tab: Admin — ledenlijst met pincode-reset + beheerderswachtwoord wijzigen ---- */
async function vulAdminLedenTab(inhoud) {
  const leden = await sb("spelers?pincode_ooit_aangemaakt=eq.true&select=*,flights(*)&order=naam.asc");
  inhoud.innerHTML = "";

  const ledenKaart = el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Leden — pincode resetten" }),
    el("p", { class: "help", text: "Alle leden die ooit zelf een pincode hebben gekozen. Resetten dwingt bij de volgende login een nieuwe keuze af." }),
    leden.length === 0
      ? el("p", { class: "help", text: "Nog geen leden gevonden." })
      : el("div", { class: "ledenlijst" }, leden.flatMap((lid) => renderLidRij(lid))),
  ]);

  inhoud.append(ledenKaart, bouwWachtwoordKaart());
}

function renderLidRij(lid) {
  const open = adminLocal.geopendLid === lid.id;
  const rij = el("div", { class: "ledenrij" + (open ? " open" : "") }, [
    el("div", {}, [
      el("div", { class: "ledennaam", text: lid.naam }),
      el("div", { class: "ledensub", text: `${lid.persoonscode}` + (lid.flights ? ` · ${lid.flights.lus}` : "") }),
    ]),
    el("div", { text: open ? "▾" : "▸" }),
  ]);
  rij.addEventListener("click", () => {
    adminLocal.geopendLid = open ? null : lid.id;
    adminLocal.resetSucces = null;
    render();
  });

  const nodes = [rij];
  if (open) {
    const succes = adminLocal.resetSucces === lid.id
      ? el("div", { class: "okmsg", text: "Pincode gereset — bij de volgende login moet een nieuwe pincode gekozen worden." })
      : null;
    const resetBtn = el("button", { class: "resetbtn", text: adminLocal.resetBezig ? "Bezig…" : "Pincode resetten" });
    resetBtn.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      if (!confirm(`Pincode van ${lid.naam} resetten? De speler moet bij de volgende login zelf een nieuwe pincode kiezen.`)) return;
      adminLocal.resetBezig = true;
      render();
      try {
        await sb(`spelers?id=eq.${lid.id}`, {
          method: "PATCH", prefer: "return=minimal",
          body: JSON.stringify({ pincode: "0000", pincode_gewijzigd: false }),
        });
        adminLocal.resetSucces = lid.id;
      } catch (e) {
        alert("Pincode resetten is niet gelukt. Probeer het nog eens.");
        console.error(e);
      } finally {
        adminLocal.resetBezig = false;
        render();
      }
    });
    nodes.push(el("div", { class: "ledendetail" }, [...(succes ? [succes] : []), resetBtn]));
  }
  return nodes;
}

function bouwWachtwoordKaart() {
  const iOud = el("input", { type: "password", placeholder: "Huidig wachtwoord" });
  const iNieuw = el("input", { type: "password", placeholder: "Nieuw wachtwoord" });
  const iHerhaal = el("input", { type: "password", placeholder: "Herhaal nieuw wachtwoord" });

  const opslaan = async () => {
    adminLocal.wachtwoordFout = null;
    adminLocal.wachtwoordSucces = false;
    const oud = iOud.value, nieuw = iNieuw.value, herhaal = iHerhaal.value;
    if (nieuw.length < 4) { adminLocal.wachtwoordFout = "Kies een nieuw wachtwoord van minstens 4 tekens."; render(); return; }
    if (nieuw !== herhaal) { adminLocal.wachtwoordFout = "De twee nieuwe wachtwoorden komen niet overeen."; render(); return; }
    adminLocal.wachtwoordBezig = true;
    render();
    try {
      const [params] = await sb("parameters?select=id,admin_wachtwoord&limit=1");
      const huidig = (params && params.admin_wachtwoord) || "GF2026";
      if (oud !== huidig) {
        adminLocal.wachtwoordFout = "Huidig wachtwoord is onjuist.";
        return;
      }
      await sb(`parameters?id=eq.${params.id}`, {
        method: "PATCH", prefer: "return=minimal",
        body: JSON.stringify({ admin_wachtwoord: nieuw }),
      });
      adminLocal.wachtwoordSucces = true;
    } catch (e) {
      adminLocal.wachtwoordFout = "Wijzigen is niet gelukt. Probeer het nog eens.";
      console.error(e);
    } finally {
      adminLocal.wachtwoordBezig = false;
      render();
    }
  };

  const fout = adminLocal.wachtwoordFout ? el("div", { class: "msg err", text: adminLocal.wachtwoordFout }) : null;
  const succes = adminLocal.wachtwoordSucces ? el("div", { class: "okmsg", text: "Wachtwoord gewijzigd." }) : null;

  return el("div", { class: "card" }, [
    el("div", { class: "eyebrow", text: "Beheerderswachtwoord wijzigen" }),
    el("label", { text: "Huidig wachtwoord" }), iOud,
    el("label", { text: "Nieuw wachtwoord" }), iNieuw,
    el("label", { text: "Herhaal nieuw wachtwoord" }), iHerhaal,
    ...(fout ? [fout] : []),
    ...(succes ? [succes] : []),
    el("button", { class: "btn", onclick: opslaan, text: adminLocal.wachtwoordBezig ? "Bezig…" : "Wachtwoord wijzigen" }),
  ]);
}

function logout() {
  state.scherm = "persoonscode";
  state.speler = null;
  state.flight = null;
  state.fout = null;
  trackerLocal = nieuweTrackerLocal();
  render();
}

document.getElementById("versiebadge").textContent = `v${APP_VERSIE}`;
render();
</script>
</body>
</html>
